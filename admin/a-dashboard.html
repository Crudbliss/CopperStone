<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-panel: #0a1e2d;
            --bg-card: #12181f;
            --bg-yellow: #1a1c16;
            --bg-green: #0e1b1d;
            --hd-color: #0a1e2c;
            
            --matrix-yellow: #d8a61a;
            --matrix-yellow-hover: #eab308;
            --matrix-dg: #4a8f4b;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.05);
            --border-lighter: rgba(255, 255, 255, 0.1);
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .svg-defs { display: none; }
        svg { display: inline-block; vertical-align: middle; }

        /* --- LAYOUT WRAPPERS --- */
        .sidebar {
            width: 220px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            z-index: 20;
            flex-shrink: 0;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- SIDEBAR COMPONENTS --- */
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .logo-container { display: flex; align-items: center; gap: 12px; }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--matrix-yellow);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: var(--bg-base);
        }
        
        .logo-text {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
        }

        .sidebar-link:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar-link.active {
            background-color: rgba(74, 222, 128, 0.1); 
            border-left-color: var(--matrix-green);
            color: var(--matrix-green);
        }

        /* --- SIDEBAR FOOTER (USER + LOGOUT) --- */
        .sidebar-footer {
            padding: 24px 20px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .sidebar-user { display: flex; align-items: center; gap: 12px; }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(74, 222, 128, 0.15); 
            color: var(--matrix-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .user-details h4 { font-size: 14px; font-weight: 700; line-height: 1.2; color: #ffffff; }
        .user-details p { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

        .sign-out-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding-left: 6px;
            transition: color 0.2s ease;
        }
        .sign-out-link:hover { color: var(--text-main); }

        /* --- TOP HEADER --- */
        .top-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid var(--border-light);
            background-color: rgba(10, 30, 45, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .header-title-box { display: flex; flex-direction: column; justify-content: center; }
        .header-subtitle { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        .header-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
        .header-actions { display: flex; align-items: center; gap: 20px; }

        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: color 0.2s; display: flex; }
        .btn-icon:hover { color: var(--text-main); }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
        }
        .status-text { font-size: 11px; font-weight: 700; color: var(--matrix-green); text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- IFRAME --- */
        #content-frame { width: 100%; flex: 1; border: none; background-color: transparent; }
    </style>
</head>
<body>

    <svg class="svg-defs">
        <symbol id="icon-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
        </symbol>
        <symbol id="icon-students" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </symbol>
        <symbol id="icon-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
        </symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></symbol>
        <symbol id="icon-grad-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></symbol>
    </svg>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-icon">M</div>
                <span class="logo-text">Matrix</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-title">Admin Portal</div>
            
            <a href="dashboard-content.html" target="content-frame" class="sidebar-link active" data-title="Dashboard">
                <svg width="20" height="20"><use href="#icon-overview"></use></svg>
                <span>Dashboard</span>
            </a>
            <a href="questionnaires-content.html" target="content-frame" class="sidebar-link" data-title="Questionnaires">
                <svg width="20" height="20"><use href="#icon-reports"></use></svg>
                <span>Questionnaires</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar" style="color: var(--matrix-blue); background-color: rgba(56, 189, 248, 0.15);">AD</div>
                <div class="user-details">
                    <h4>Administrator</h4>
                    <p>System Admin</p>
                </div>
            </div>
            
            <a href="../index.html" class="sign-out-link">
                <svg width="18" height="18"><use href="#icon-logout"></use></svg>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <div class="header-title-box">
                <span class="header-subtitle">ADMIN PORTAL</span>
                <span class="header-title" id="page-title">Dashboard</span>
            </div>
            
            <div class="header-actions">
                <button class="btn-icon">
                    <svg width="20" height="20"><use href="#icon-bell"></use></svg>
                </button>
                <div class="status-pill" style="border-color: rgba(56, 189, 248, 0.3); background-color: rgba(56, 189, 248, 0.05);">
                    <svg width="16" height="16" style="color: var(--matrix-blue);"><use href="#icon-shield"></use></svg>
                    <span class="status-text" style="color: var(--matrix-blue);">System Online</span>
                </div>
            </div>
        </header>

        <iframe src="dashboard-content.html" name="content-frame" id="content-frame"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebarLinks = document.querySelectorAll('.sidebar-link');
            const pageTitle = document.getElementById('page-title');

            sidebarLinks.forEach(link => {
                link.addEventListener('click', function() {
                    // Update active state
                    sidebarLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update header title based on data attribute
                    if(this.dataset.title) {
                        pageTitle.textContent = this.dataset.title;
                    }
                });
            });
        });
    </script>
</body>
</html>
