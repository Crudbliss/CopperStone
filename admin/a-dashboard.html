<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX | Admin Portal</title>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = '../index.html';
        }
    </script>
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-panel: #0a1e2d;
            --bg-card: #12181f;
            --bg-yellow: #1a1c16;
            --bg-green: #0e1b1d;
            --hd-color: #0a1e2c;
            
            --matrix-yellow: #d8a61a;
            --matrix-yellow-hover: #eab308;
            --matrix-dg: #4a8f4b;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.05);
            --border-lighter: rgba(255, 255, 255, 0.1);
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .svg-defs { display: none; }
        svg { display: inline-block; vertical-align: middle; }

        /* --- LAYOUT WRAPPERS --- */
        .sidebar {
            width: 220px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            z-index: 20;
            flex-shrink: 0;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- SIDEBAR COMPONENTS --- */
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .logo-container { display: flex; align-items: center; gap: 12px; }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: contain;
        }
        
        .logo-text {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
        }

        .sidebar-link:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar-link.active {
            background-color: rgba(74, 222, 128, 0.1); 
            border-left-color: var(--matrix-green);
            color: var(--matrix-green);
        }

        /* --- SIDEBAR FOOTER (USER + LOGOUT) --- */
        .sidebar-footer {
            padding: 24px 20px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .sidebar-user { display: flex; align-items: center; gap: 12px; }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(74, 222, 128, 0.15); 
            color: var(--matrix-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .user-details h4 { font-size: 14px; font-weight: 700; line-height: 1.2; color: #ffffff; }
        .user-details p { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

        .sign-out-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding-left: 6px;
            transition: color 0.2s ease;
        }
        .sign-out-link:hover { color: var(--text-main); }

        /* --- TOP HEADER --- */
        .top-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid var(--border-light);
            background-color: rgba(10, 30, 45, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .header-title-box { display: flex; flex-direction: column; justify-content: center; }
        .header-subtitle { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        .header-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
        .header-actions { display: flex; align-items: center; gap: 20px; }

        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: color 0.2s; display: flex; }
        .btn-icon:hover { color: var(--text-main); }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
        }
        .status-text { font-size: 11px; font-weight: 700; color: var(--matrix-green); text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- IFRAME --- */
        #content-frame { width: 100%; flex: 1; border: none; background-color: transparent; }

        /* --- MOBILE RESPONSIVENESS --- */
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            margin-right: 12px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: 4px 0 24px rgba(0,0,0,0.5);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.active {
                display: block;
                opacity: 1;
            }
            .top-header { padding: 0 20px; }
            .header-title-box { flex-direction: row; align-items: center; }
            .header-subtitle { display: none; }
            .header-title { font-size: 16px; }
            .status-pill { padding: 6px 12px; }
            .header-actions { gap: 12px; }
        }

        /* --- LOGOUT MODAL STYLING --- */
        .custom-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .custom-modal-box {
            background: #0d1722;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-icon-warning {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
        }

        .modal-title-text {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-desc-text {
            font-size: 13.5px;
            color: #8b9eb0;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .modal-actions-row {
            display: flex;
            gap: 10px;
        }

        .btn-modal-cancel {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-modal-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-modal-confirm {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: #ef4444;
            border: none;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-modal-confirm:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>

    <svg class="svg-defs">
        <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </symbol>
        <symbol id="icon-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
        </symbol>
        <symbol id="icon-students" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </symbol>
        <symbol id="icon-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
        </symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></symbol>
        <symbol id="icon-grad-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></symbol>
    </svg>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <img src="../images/matrix_logo.png" alt="Matrix Logo" class="logo-icon">
                <span class="logo-text">Matrix</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-title">Admin Portal</div>
            
            <a href="dashboard-content.html" target="content-frame" class="sidebar-link active" data-title="Dashboard">
                <svg width="20" height="20"><use href="#icon-overview"></use></svg>
                <span>Dashboard</span>
            </a>
            <a href="modules-content.html" target="content-frame" class="sidebar-link" data-title="Modules">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Modules</span>
            </a>
            <a href="ai-settings-content.html" target="content-frame" class="sidebar-link" data-title="AI Settings">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span>AI Settings</span>
            </a>
            <a href="questionnaires-content.html" target="content-frame" class="sidebar-link" data-title="Questionnaires">
                <svg width="20" height="20"><use href="#icon-reports"></use></svg>
                <span>Questionnaires</span>
            </a>
            <a href="students-content.html" target="content-frame" class="sidebar-link" data-title="Students">
                <svg width="20" height="20"><use href="#icon-students"></use></svg>
                <span>Students</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar" style="color: var(--matrix-blue); background-color: rgba(56, 189, 248, 0.15);">AD</div>
                <div class="user-details">
                    <h4>Administrator</h4>
                    <p>System Admin</p>
                </div>
            </div>
            
            <a href="#" class="sign-out-link" onclick="logoutAdmin(event)">
                <svg width="18" height="18"><use href="#icon-logout"></use></svg>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <div style="display: flex; align-items: center;">
                <button class="hamburger-btn" id="mobile-menu-btn">
                    <svg width="24" height="24"><use href="#icon-menu"></use></svg>
                </button>
                <div class="header-title-box">
                    <span class="header-subtitle">ADMIN PORTAL</span>
                    <span class="header-title" id="page-title">Dashboard</span>
                </div>
            </div>
            
            <div class="header-actions">
                <button class="btn-icon">
                    <svg width="20" height="20"><use href="#icon-bell"></use></svg>
                </button>
                <div class="status-pill" style="border-color: rgba(56, 189, 248, 0.3); background-color: rgba(56, 189, 248, 0.05);">
                    <svg width="16" height="16" style="color: var(--matrix-blue);"><use href="#icon-shield"></use></svg>
                    <span class="status-text" style="color: var(--matrix-blue);">System Online</span>
                </div>
            </div>
        </header>

        <!-- Logout Confirmation Modal -->
        <div id="logout-confirm-modal" class="custom-modal-backdrop" style="display: none;">
            <div class="custom-modal-box">
                <div class="modal-icon-warning">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </div>
                <h3 class="modal-title-text">Confirm Logout</h3>
                <p class="modal-desc-text">Are you sure you want to log out of the Admin panel?</p>
                <div class="modal-actions-row">
                    <button type="button" class="btn-modal-cancel" onclick="closeLogoutModal()">Cancel</button>
                    <button type="button" class="btn-modal-confirm" onclick="confirmLogout()">Log Out</button>
                </div>
            </div>
        </div>

        <iframe src="dashboard-content.html" name="content-frame" id="content-frame"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('currentUser');
            if(userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user.role !== 'admin') {
                        alert('Unauthorized access. Please log in with an admin account.');
                        window.location.href = '../index.html';
                        return;
                    }
                } catch(e) { console.error(e); }
            } else {
                window.location.href = '../index.html'; // Basic protection
                return;
            }

            const sidebarLinks = document.querySelectorAll('.sidebar-link');
            const pageTitle = document.getElementById('page-title');
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const menuBtn = document.getElementById('mobile-menu-btn');

            function toggleSidebar() {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            }

            if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
            if (overlay) overlay.addEventListener('click', toggleSidebar);

            sidebarLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    sidebarLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    pageTitle.textContent = this.getAttribute('data-title');
                    
                    if (window.innerWidth <= 768) {
                        toggleSidebar();
                    }
                });
            });
            
            window.logoutAdmin = function(e) {
                if (e) e.preventDefault();
                const modal = document.getElementById('logout-confirm-modal');
                if (modal) modal.style.display = 'flex';
            };

            window.closeLogoutModal = function() {
                const modal = document.getElementById('logout-confirm-modal');
                if (modal) modal.style.display = 'none';
            };

            window.confirmLogout = function() {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            };
        });
    </script>
</body>
</html>
