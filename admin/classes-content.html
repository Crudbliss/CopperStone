<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Classes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Matrix theme styling */
        body { background: transparent; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .card { background: #12181f; border-radius: 12px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #c084fc; }
        
        button { background: #c084fc; color: #060f17; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Poppins', sans-serif;}
        button:hover { background: #a855f7; }
        .btn-close { background: transparent; color: #8b9eb0; padding: 0; font-size: 24px; font-weight: 300; line-height: 1; }
        .btn-close:hover { background: transparent; color: #fff; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 10px; color: #8b9eb0; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 14px; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-active { background: rgba(74, 222, 128, 0.1); color: #4ade80; }
        .status-archived { background: rgba(251, 146, 60, 0.1); color: #fb923c; }

        .btn-sm { padding: 6px 12px; font-size: 12px; margin-right: 4px; }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
        .btn-archive { background: rgba(251, 146, 60, 0.1); color: #fb923c; border: 1px solid #fb923c; }
        .btn-archive:hover { background: #fb923c; color: #fff; }
        .btn-unarchive { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid #4ade80; }
        .btn-unarchive:hover { background: #4ade80; color: #111; }

        /* Modal Styling */
        .modal-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 15, 23, 0.8); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal {
            background: #12181f; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        label { font-size: 13px; color: #8b9eb0; }
        input, select { background: #0a1e2d; border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; font-family: 'Poppins', sans-serif;}
        input:focus, select:focus { outline: none; border-color: #c084fc; }
        
        option { background: #0a1e2d; color: #fff; }

        /* --- MOBILE RESPONSIVENESS --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .card { padding: 16px; }
            .header-row { flex-direction: column; align-items: stretch; gap: 16px; }
            .header-row button { width: 100%; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>

    <div class="card">
        <div class="header-row">
            <h2>Current Classes</h2>
            <button onclick="openModal()">+ Add Class</button>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Program</th>
                        <th>Learning Mode</th>
                        <th>Year & Section</th>
                        <th>School Year</th>
                        <th>Assigned Teacher</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="classTableBody">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- The Modal -->
    <div id="addModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Create New Class</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="addClassForm">
                <div class="form-group">
                    <label>Program</label>
                    <select id="prog_name" required>
                        <option value="" disabled selected>Select Program</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assigned Learning Mode</label>
                    <select id="learning_mode" required>
                        <option value="" disabled selected>Select Learning Mode</option>
                        <option value="HI">Hierarchical Individual (HI)</option>
                        <option value="HC">Hierarchical Collective (HC)</option>
                        <option value="DI">Distributed Individual (DI)</option>
                        <option value="DC">Distributed Collective (DC)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Year Level</label>
                    <select id="year_level" required>
                        <option value="" disabled selected>Select Year Level</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="section" placeholder="e.g. Y2-1" required>
                </div>
                <div class="form-group">
                    <label>School Year</label>
                    <input type="text" id="school_year" placeholder="e.g. 2025-2026" required>
                </div>
                <div class="form-group">
                    <label>Assign to Teacher</label>
                    <select id="teacher_id" required>
                        <option value="">Loading teachers...</option>
                    </select>
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                    <button type="button" onclick="closeModal()" style="background: transparent; color: #8b9eb0; border: 1px solid rgba(255,255,255,0.2);">Cancel</button>
                    <button type="submit">Create Class</button>
                </div>
                <div id="message" style="margin-top: 15px; font-size: 14px; font-weight: 500; text-align: right;"></div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('addModal');
        
        function openModal() {
            modal.style.display = 'flex';
            document.getElementById('message').textContent = '';
        }
        
        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('addClassForm').reset();
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Load Teachers for the dropdown
        async function loadTeachers() {
            try {
                const res = await fetch('/api/teachers');
                const teachers = await res.json();
                const select = document.getElementById('teacher_id');
                select.innerHTML = '<option value="">-- Select a Teacher --</option>';
                
                teachers.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = `${t.first_name} ${t.last_name}`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Error loading teachers:", err);
            }
        }

        // Load Classes for the table
        async function loadClasses() {
            try {
                const res = await fetch('/api/classes');
                const classes = await res.json();
                const tbody = document.getElementById('classTableBody');
                tbody.innerHTML = '';
                
                if (classes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #8b9eb0; padding: 30px;">No classes created yet.</td></tr>';
                    return;
                }

                classes.forEach(c => {
                    const tr = document.createElement('tr');
                    const teacherName = c.teacher_first_name ? `${c.teacher_first_name} ${c.teacher_last_name}` : '<i style="color:#fb923c">Unassigned</i>';
                    
                    const program = c.prog_name || '-';
                    const learningMode = c.learning_mode || 'None';
                    const yl = c.year_level || '';
                    const sec = c.section || '';
                    const sy = c.school_year || '-';
                    
                    let ylsec = '-';
                    if(yl || sec) ylsec = `${yl}-${sec}`;

                    const statusBadge = c.is_archived 
                        ? '<span class="status-badge status-archived">Archived</span>'
                        : '<span class="status-badge status-active">Active</span>';

                    let actionsHtml = '';
                    if(c.is_archived) {
                        actionsHtml += `<button class="btn-sm btn-unarchive" onclick="unarchiveClass(${c.id})">Unarchive</button>`;
                    } else {
                        actionsHtml += `<button class="btn-sm btn-archive" onclick="archiveClass(${c.id})">Archive</button>`;
                    }
                    actionsHtml += `<button class="btn-sm btn-delete" onclick="deleteClass(${c.id})">Delete</button>`;

                    tr.innerHTML = `
                        <td><strong>${program}</strong></td>
                        <td>
                            <span style="background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; font-size: 12px; border: 1px solid rgba(255,255,255,0.1);">
                                ${learningMode}
                            </span>
                        </td>
                        <td>${ylsec}</td>
                        <td>${sy}</td>
                        <td>${teacherName}</td>
                        <td>${statusBadge}</td>
                        <td>${actionsHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading classes:", err);
            }
        }
        
        async function archiveClass(id) {
            if(!confirm("Archive this class?")) return;
            await fetch('/api/classes/' + id + '/archive', { method: 'PUT' });
            loadClasses();
        }

        async function unarchiveClass(id) {
            await fetch('/api/classes/' + id + '/unarchive', { method: 'PUT' });
            loadClasses();
        }

        async function deleteClass(id) {
            if(!confirm("WARNING: This will permanently delete the class and all enrollments. Are you sure?")) return;
            await fetch('/api/classes/' + id, { method: 'DELETE' });
            loadClasses();
        }

        // Initialize
        loadTeachers();
        loadClasses();

        // Form Submit
        document.getElementById('addClassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('message');
            btn.textContent = 'Saving...';
            msg.textContent = '';
            
            const data = {
                prog_name: document.getElementById('prog_name').value,
                learning_mode: document.getElementById('learning_mode').value,
                year_level: document.getElementById('year_level').value,
                section: document.getElementById('section').value,
                school_year: document.getElementById('school_year').value,
                teacher_id: document.getElementById('teacher_id').value
            };

            try {
                const res = await fetch('/api/classes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(res.ok) {
                    closeModal();
                    loadClasses(); // Refresh the list!
                } else {
                    msg.style.color = '#fb923c';
                    msg.textContent = result.error;
                }
            } catch (err) {
                msg.style.color = '#fb923c';
                msg.textContent = 'Server error occurred.';
            }
            btn.textContent = 'Create Class';
        });
    </script>
</body>
</html>
