<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix | Admin Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e2e41; 
            --nav-bg: #0a1e2d; 
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(255, 255, 255, 0.03);
            
            --admin-red: #e11d48;
            --admin-red-hover: #be123c;
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --text-gray: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 75px 75px;
            background-position: center top;
            background-attachment: fixed;
        }

        .login-container {
            background-color: #0c2233;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: contain;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .title span {
            color: var(--admin-red);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: var(--text-gray);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--admin-red);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: var(--admin-red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            margin-top: 16px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: var(--admin-red-hover);
            box-shadow: 0 8px 25px rgba(225, 29, 72, 0.4);
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: white;
            text-decoration: underline;
        }

    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="../images/matrix_logo.png" alt="Matrix Logo" class="logo-icon">
        </div>
        
        <h2 class="title">MAT<span>R</span>IX Admin</h2>
        <p class="subtitle">System Administration Portal</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Administrator ID</label>
                <input type="text" id="username" class="form-control" placeholder="Enter admin ID" required>
            </div>
            
            <div class="form-group">
                <label for="password">Security Key</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="error-message" id="errorMessage">Invalid credentials. Access denied.</div>

            <button type="submit" class="btn-submit">Authenticate</button>
        </form>
        
        <a href="../index.html" class="back-link">← Return to Main Portal</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('currentUser');
            if (userStr) {
                const user = JSON.parse(userStr);
                if (user.role === 'admin') window.location.href = 'a-dashboard.html';
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            // Retaining the local admin/admin fallback for the admin portal
            if (username === 'admin' && password === 'admin') {
                errorMsg.style.display = 'none';
                localStorage.setItem('currentUser', JSON.stringify({ role: 'admin', name: 'Administrator' }));
                window.location.href = 'a-dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                // Add a small shake animation
                const container = document.querySelector('.login-container');
                container.style.transform = 'translateX(-10px)';
                setTimeout(() => container.style.transform = 'translateX(10px)', 100);
                setTimeout(() => container.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => container.style.transform = 'translateX(10px)', 300);
                setTimeout(() => container.style.transform = 'translateX(0)', 400);
            }
        });
    </script>
</body>
</html>
