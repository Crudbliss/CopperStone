<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Questionnaires</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --matrix-blue: #38bdf8;
            --matrix-red: #f87171;
            --matrix-yellow: #d8a61a;
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --text-gray: #a1a1aa;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.5);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: transparent; 
            color: var(--text-main); 
            padding: 40px; 
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 { color: var(--matrix-blue); font-size: 28px; font-weight: 700; margin-bottom: 8px;}
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

        .btn {
            font-family: 'Poppins', sans-serif;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--matrix-blue);
            color: #060f17;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--matrix-blue); color: var(--matrix-blue); }

        /* Questions List */
        #questionsList {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .question-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            max-width: 90%;
            color: white;
        }

        .category-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--matrix-blue);
            font-size: 10px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .answers-list {
            list-style: none;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }
        
        .answer-num {
            color: var(--matrix-blue);
            font-weight: bold;
            margin-right: 12px;
        }

    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>
    
    <div class="header-actions">
        <div>
            <h1>Elmore Framework Questionnaire</h1>
            <p>This is the locked 28-question survey based on Richard Elmore's Leaders of Learning framework. It evaluates the Hierarchical/Distributed and Individual/Collective quadrants.</p>
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="btn btn-outline" onclick="window.location.href='../student/test-content.html?preview=true'" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Preview Student View
            </button>
        </div>
    </div>

    <div id="questionsList">
        <!-- Questions will be rendered here dynamically -->
    </div>

    <script>
        const elmoreQuestions = [
            // PURPOSE
            { q: "HI", text: "Education should prepare students to fit into existing social and economic structures.", cat: "Purpose" },
            { q: "HI", text: "The primary goal of learning is to acquire certified knowledge and skills.", cat: "Purpose" },
            { q: "DI", text: "Education should empower individuals to pursue their own unique interests and passions.", cat: "Purpose" },
            { q: "DI", text: "The primary goal of learning is self-actualization and personal growth.", cat: "Purpose" },
            // HOW
            { q: "HI", text: "Learning happens best when there is a clear, structured curriculum.", cat: "How" },
            { q: "HI", text: "Teachers are the primary source of knowledge and authority in the classroom.", cat: "How" },
            { q: "DI", text: "Learning happens best when students explore topics they choose themselves.", cat: "How" },
            { q: "DI", text: "Teachers should act as facilitators rather than directors of learning.", cat: "How" },
            // WHAT
            { q: "HI", text: "There is a core set of knowledge that every student must learn.", cat: "What" },
            { q: "HI", text: "Standardized tests are a good way to measure what is worth learning.", cat: "What" },
            { q: "DI", text: "What is worth learning changes depending on the individual's goals.", cat: "What" },
            { q: "DI", text: "Practical, hands-on skills are more valuable than theoretical knowledge.", cat: "What" },
            // WHERE
            { q: "HI", text: "The traditional classroom is the most effective environment for learning.", cat: "Where" },
            { q: "HI", text: "Learning environments should be highly organized and free from distractions.", cat: "Where" },
            { q: "DI", text: "Learning can happen anywhere, not just within the walls of a school.", cat: "Where" },
            { q: "DI", text: "Online and informal spaces are often more effective for learning than classrooms.", cat: "Where" },
            // PURPOSE (Collective)
            { q: "HC", text: "Education should prepare citizens to contribute to the greater good of society.", cat: "Purpose" },
            { q: "HC", text: "The primary goal of learning is to maintain social harmony and civic responsibility.", cat: "Purpose" },
            { q: "DC", text: "Education should focus on solving global challenges through collaborative innovation.", cat: "Purpose" },
            { q: "DC", text: "The primary goal of learning is to build networks and communities of practice.", cat: "Purpose" },
            // HOW (Collective)
            { q: "HC", text: "Learning happens best when students work together on teacher-assigned group projects.", cat: "How" },
            { q: "HC", text: "Group cohesion and following shared rules are critical for effective learning.", cat: "How" },
            { q: "DC", text: "Learning happens best when diverse groups self-organize to tackle shared problems.", cat: "How" },
            { q: "DC", text: "Knowledge is co-created through interaction with peers rather than delivered by an expert.", cat: "How" },
            // WHAT (Collective)
            { q: "HC", text: "Students should learn the shared values and traditions of their community.", cat: "What" },
            { q: "HC", text: "Civic education and social studies are essential for everyone.", cat: "What" },
            { q: "DC", text: "Students should learn how to adapt and innovate within complex systems.", cat: "What" },
            { q: "DC", text: "The ability to collaborate across different cultures and disciplines is the most critical skill.", cat: "What" }
        ];

        const questionsList = document.getElementById('questionsList');

        function renderQuestions() {
            let html = '';
            elmoreQuestions.forEach((q, index) => {
                let quadName = "";
                if(q.q === "HI") quadName = "Hierarchical Individual";
                if(q.q === "HC") quadName = "Hierarchical Collective";
                if(q.q === "DI") quadName = "Distributed Individual";
                if(q.q === "DC") quadName = "Distributed Collective";
                
                html += `
                    <div class="question-card">
                        <div class="question-header">
                            <div class="category-badge">${q.cat} • Question ${index + 1}</div>
                        </div>
                        <div class="question-title">"${q.text}"</div>
                        
                        <div style="margin-top: 16px; font-size: 11px; color: var(--text-gray);">
                            Maps to: <strong style="color:var(--matrix-blue);">${quadName}</strong>
                        </div>

                        <ul class="answers-list">
                            <li class="answer-item"><span class="answer-num">1</span> Disagree</li>
                            <li class="answer-item"><span class="answer-num">2</span> Somewhat Agree</li>
                            <li class="answer-item"><span class="answer-num">3</span> Agree</li>
                            <li class="answer-item"><span class="answer-num">4</span> Strongly Agree</li>
                        </ul>
                    </div>
                `;
            });
            questionsList.innerHTML = html;
        }

        renderQuestions();
    </script>
</body>
</html>
