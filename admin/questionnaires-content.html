<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Questionnaires</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --matrix-blue: #38bdf8;
            --matrix-red: #f87171;
            --matrix-yellow: #d8a61a;
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --text-gray: #a1a1aa;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.5);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: transparent; 
            color: var(--text-main); 
            padding: 40px; 
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 { color: var(--matrix-blue); font-size: 28px; font-weight: 700; }

        .btn {
            font-family: 'Poppins', sans-serif;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--matrix-blue);
            color: #060f17;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--text-main); }

        .btn-danger {
            background: rgba(248, 113, 113, 0.1);
            color: var(--matrix-red);
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-danger:hover { background: rgba(248, 113, 113, 0.2); }

        /* Questions List */
        #questionsList {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .question-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            max-width: 80%;
        }

        .answers-list {
            list-style: none;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer-values {
            color: var(--matrix-yellow);
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- MODAL SYSTEM STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 15, 23, 0.85); 
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background-color: #0c2233; 
            border: 1px solid var(--border-light); border-radius: 16px;
            padding: 32px; width: 100%; max-width: 600px; position: relative;
            transform: translateY(20px); transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-close {
            position: absolute; top: 24px; right: 24px; background: transparent; border: none;
            color: var(--text-muted); cursor: pointer; padding: 4px; transition: color 0.2s;
        }
        .modal-close:hover { color: white; }

        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: white; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-gray); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
        .form-group input[type="text"], .form-group input[type="number"] {
            width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 12px 16px; color: white; font-family: 'Poppins', sans-serif;
            font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--border-active); }

        .answer-input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .answer-input-row input { padding: 10px; font-size: 13px; }
        
        .btn-icon-danger {
            background: none; border: none; color: var(--matrix-red); cursor: pointer; padding: 4px; opacity: 0.7;
        }
        .btn-icon-danger:hover { opacity: 1; }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

    </style>
</head>
<body>
    
    <div class="header-actions">
        <h1>Manage Questionnaires</h1>
        <div style="display: flex; gap: 12px;">
            <button class="btn btn-outline" onclick="testQuestionnaire()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Test Questionnaire
            </button>
            <button class="btn btn-primary" onclick="openModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Create Question
            </button>
        </div>
    </div>

    <div id="questionsList">
        <!-- Questions will be rendered here -->
    </div>

    <!-- Create Question Modal -->
    <div class="modal-overlay" id="questionModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            
            <h3 class="modal-title">Create New Question</h3>
            
            <form id="questionForm">
                <div class="form-group">
                    <label>Question Text</label>
                    <input type="text" id="qTitle" placeholder="e.g. When faced with a complex problem, I usually..." required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="margin: 0;">Answers & Weights</label>
                        <button type="button" class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" onclick="addAnswerRow()">+ Add Answer</button>
                    </div>
                    
                    <div id="answersContainer">
                        <!-- Dynamic answer rows go here -->
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Save Question</button>
            </form>
        </div>
    </div>

    <script>
        let questions = [];

        // Fetch questions from the real database
        async function fetchQuestions() {
            try {
                const response = await fetch('/api/questions');
                questions = await response.json();
                renderQuestions();
            } catch (error) {
                console.error("Failed to load questions:", error);
            }
        }

        const questionsList = document.getElementById('questionsList');
        const answersContainer = document.getElementById('answersContainer');

        function renderQuestions() {
            questionsList.innerHTML = '';
            
            if (questions.length === 0) {
                questionsList.innerHTML = '<div class="empty-state">No questions added yet. Click "Create Question" to start.</div>';
                return;
            }

            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                
                let answersHtml = q.answers.map(a => `
                    <li class="answer-item">
                        <span>${a.text}</span>
                        <span class="answer-values">X: ${a.x} | Y: ${a.y}</span>
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="question-header">
                        <div class="question-title">${q.title}</div>
                        <button class="btn btn-danger" onclick="deleteQuestion(${q.id})">Delete</button>
                    </div>
                    <ul class="answers-list">
                        ${answersHtml}
                    </ul>
                `;
                questionsList.appendChild(card);
            });
        }

        async function deleteQuestion(id) {
            if(confirm('Are you sure you want to delete this question?')) {
                try {
                    await fetch(`/api/questions/${id}`, { method: 'DELETE' });
                    await fetchQuestions(); // reload
                } catch(err) {
                    console.error("Failed to delete", err);
                }
            }
        }

        function openModal() {
            document.getElementById('questionForm').reset();
            answersContainer.innerHTML = '';
            addAnswerRow(); // add initial empty row
            addAnswerRow(); // add another empty row for convenience
            document.getElementById('questionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('questionModal').classList.remove('active');
        }

        function addAnswerRow() {
            const row = document.createElement('div');
            row.className = 'answer-input-row';
            row.innerHTML = `
                <input type="text" placeholder="Answer text..." class="ans-text" required>
                <input type="number" step="0.01" placeholder="X Value" class="ans-x" required title="Hierarchical/Distributed (e.g. 1.5)">
                <input type="number" step="0.01" placeholder="Y Value" class="ans-y" required title="Individual/Collective (e.g. -0.5)">
                <button type="button" class="btn-icon-danger" onclick="this.parentElement.remove()" title="Remove Answer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            `;
            answersContainer.appendChild(row);
        }

        document.getElementById('questionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('qTitle').value;
            const rows = document.querySelectorAll('.answer-input-row');
            
            if(rows.length === 0) {
                alert('Please add at least one answer.');
                return;
            }

            const newAnswers = [];
            rows.forEach(row => {
                newAnswers.push({
                    text: row.querySelector('.ans-text').value,
                    x: parseFloat(row.querySelector('.ans-x').value) || 0,
                    y: parseFloat(row.querySelector('.ans-y').value) || 0
                });
            });

            // Save to database
            try {
                await fetch('/api/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, answers: newAnswers })
                });
                
                closeModal();
                await fetchQuestions(); // Reload list
            } catch (err) {
                console.error("Failed to save", err);
                alert("Error saving question to database");
            }
        });

        function testQuestionnaire() {
            if(questions.length === 0) {
                alert("Please add some questions first.");
                return;
            }
            sessionStorage.setItem('matrix_test_questions', JSON.stringify(questions));
            window.location.href = 'test-questionnaire.html';
        }

        // Initialize
        fetchQuestions();
    </script>
</body>
</html>
