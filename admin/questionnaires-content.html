<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Questionnaires</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --matrix-blue: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: transparent; color: var(--text-main); padding: 40px; }
        .glass-card { background-color: var(--bg-card); border: 1px solid var(--border-light); border-radius: 16px; padding: 32px; text-align: center; }
        h1 { color: var(--matrix-blue); margin-bottom: 16px; }
        p { color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Manage Questionnaires</h1>
        <p>This section is under development. Here you will manage assessment questions.</p>
    </div>
</body>
</html>
