<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Matrix theme styling */
        body { background: transparent; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .card { background: #12181f; border-radius: 12px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #4ade80; }
        
        button { background: #4ade80; color: #060f17; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #22c55e; }
        .btn-close { background: transparent; color: #8b9eb0; padding: 0; font-size: 24px; font-weight: 300; line-height: 1; }
        .btn-close:hover { background: transparent; color: #fff; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 10px; color: #8b9eb0; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 14px; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        /* Modal Styling */
        .modal-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 15, 23, 0.8); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal {
            background: #12181f; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; color: #8b9eb0; }
        input { background: #0a1e2d; border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; }
        input:focus { outline: none; border-color: #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-row">
            <h2>Current Students</h2>
            <button onclick="openModal()">+ Add Student</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Student No.</th>
                    <th>Name</th>
                    <th>Program & Sec</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Data will load here -->
            </tbody>
        </table>
    </div>

    <!-- The Modal -->
    <div id="addModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Student</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="addStudentForm">
                <div class="form-grid">
                    <div class="form-group"><label>Student No.</label><input type="text" id="student_no" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                    <div class="form-group"><label>First Name</label><input type="text" id="first_name" required></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="last_name" required></div>
                    <div class="form-group"><label>Middle Initial</label><input type="text" id="mi"></div>
                    <div class="form-group"><label>Program</label><input type="text" id="program" required></div>
                    <div class="form-group"><label>Year Level</label><input type="text" id="year_level" required></div>
                    <div class="form-group"><label>Section</label><input type="text" id="section" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                    <button type="button" onclick="closeModal()" style="background: transparent; color: #8b9eb0; border: 1px solid rgba(255,255,255,0.2);">Cancel</button>
                    <button type="submit">Create Student</button>
                </div>
                <div id="message" style="margin-top: 15px; font-size: 14px; font-weight: 500; text-align: right;"></div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('addModal');
        
        function openModal() {
            modal.style.display = 'flex';
            document.getElementById('message').textContent = '';
        }
        
        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('addStudentForm').reset();
        }

        // Close when clicking outside modal
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        async function loadStudents() {
            try {
                const res = await fetch('/api/students');
                const students = await res.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #8b9eb0; padding: 30px;">No students added yet.</td></tr>';
                    return;
                }

                students.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${s.student_no}</td>
                        <td>${s.first_name} ${s.mi || ''} ${s.last_name}</td>
                        <td>${s.program} - ${s.section}</td>
                        <td>${s.email}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading students:", err);
            }
        }
        
        loadStudents();

        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('message');
            btn.textContent = 'Saving...';
            msg.textContent = '';
            
            const data = {
                student_no: document.getElementById('student_no').value,
                email: document.getElementById('email').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                mi: document.getElementById('mi').value,
                program: document.getElementById('program').value,
                year_level: document.getElementById('year_level').value,
                section: document.getElementById('section').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/students/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(res.ok) {
                    closeModal();
                    loadStudents(); // Refresh the list!
                } else {
                    msg.style.color = '#fb923c';
                    msg.textContent = result.error;
                }
            } catch (err) {
                msg.style.color = '#fb923c';
                msg.textContent = 'Server error occurred.';
            }
            btn.textContent = 'Create Student';
        });
    </script>
</body>
</html>
