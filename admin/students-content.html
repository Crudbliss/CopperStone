<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Matrix theme styling */
        body { background: transparent; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .card { background: #12181f; border-radius: 12px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #4ade80; }
        
        button { background: #4ade80; color: #060f17; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #22c55e; }
        .btn-close { background: transparent; color: #8b9eb0; padding: 0; font-size: 24px; font-weight: 300; line-height: 1; }
        .btn-close:hover { background: transparent; color: #fff; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 10px; color: #8b9eb0; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 14px; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        /* Modal Styling */
        .modal-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 15, 23, 0.8); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal {
            background: #12181f; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; color: #8b9eb0; }
        input, select { background: #0a1e2d; border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; font-family: 'Poppins', sans-serif;}
        input:focus, select:focus { outline: none; border-color: #4ade80; }
        option { background: #0a1e2d; color: #fff; }

        /* --- MOBILE RESPONSIVENESS --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .card { padding: 16px; }
            .header-row { flex-direction: column; align-items: stretch; gap: 16px; }
            .header-row div { flex-direction: column; display: flex; width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>

    <div class="card">
        <div class="header-row">
            <h2>Current Students</h2>
            <div style="display: flex; gap: 12px;">
                <button onclick="factoryResetStudents()" style="background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">⚠️ Factory Reset All Data</button>
                <button onclick="openModal()">+ Add Student</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Student No.</th>
                        <th>Name</th>
                        <th>Learning Mode</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- The Modal -->
    <div id="addModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Student</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="addStudentForm">
                <div class="form-grid">
                    <div class="form-group"><label>Student No.</label><input type="text" id="student_no" placeholder="Leave blank to auto-generate"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                    <div class="form-group"><label>First Name</label><input type="text" id="first_name" required></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="last_name" required></div>
                    <div class="form-group"><label>Middle Initial</label><input type="text" id="mi"></div>
                    <div class="form-group"><label>Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="password" required style="width: 100%; padding-right: 40px;">
                            <span class="toggle-password" style="position: absolute; right: 10px; cursor: pointer; color: #8b9eb0;" onclick="togglePasswordVisibility('password', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </span>
                        </div>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                    <button type="button" onclick="closeModal()" style="background: transparent; color: #8b9eb0; border: 1px solid rgba(255,255,255,0.2);">Cancel</button>
                    <button type="submit">Create Student</button>
                </div>
                <div id="message" style="margin-top: 15px; font-size: 14px; font-weight: 500; text-align: right;"></div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            } else {
                input.type = 'password';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            }
        }

        const modal = document.getElementById('addModal');
        
        function openModal() {
            modal.style.display = 'flex';
            document.getElementById('message').textContent = '';
        }
        
        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('addStudentForm').reset();
        }

        // Close when clicking outside modal
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        async function loadStudents() {
            try {
                const res = await fetch('/api/students');
                const students = await res.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #8b9eb0; padding: 30px;">No students added yet.</td></tr>';
                    return;
                }

                students.forEach(s => {
                    let modeBadge = '<span style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; background: rgba(255, 255, 255, 0.05); color: #8b9eb0;">Unassessed</span>';
                    if (s.learning_mode && s.learning_mode !== 'Unknown') {
                        let color = '#4ade80';
                        let bg = 'rgba(74, 222, 128, 0.1)';
                        if (s.learning_mode === 'Distributed Individual') { color = '#38bdf8'; bg = 'rgba(56, 189, 248, 0.1)'; }
                        else if (s.learning_mode === 'Hierarchical Collective') { color = '#fb923c'; bg = 'rgba(251, 146, 60, 0.1)'; }
                        else if (s.learning_mode === 'Distributed Collective') { color = '#c084fc'; bg = 'rgba(192, 132, 252, 0.1)'; }
                        
                        modeBadge = `<span style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: ${bg}; color: ${color};">${s.learning_mode}</span>`;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 600;">${s.student_no}</td>
                        <td>${s.first_name} ${s.mi || ''} ${s.last_name}</td>
                        <td>${modeBadge}</td>
                        <td>${s.email}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading students:", err);
            }
        }
        
        loadStudents();

        async function factoryResetStudents() {
            if (!confirm("⚠️ WARNING: This will permanently delete ALL student accounts, assessment histories, module progress, and quiz submissions. The database will be completely wiped clean of all student data. Are you sure you want to proceed?")) {
                return;
            }
            
            try {
                const btn = document.querySelector('button[onclick="factoryResetStudents()"]');
                const origText = btn.textContent;
                btn.textContent = 'Wiping Data...';
                btn.disabled = true;
                
                const res = await fetch('/api/admin/reset-students', { method: 'POST' });
                const data = await res.json();
                
                if (res.ok) {
                    alert("✅ Factory Reset Complete. All student accounts and data have been completely wiped clean from the database.");
                    loadStudents(); // Refresh the table UI
                } else {
                    alert("Error: " + (data.error || "Failed to reset student data"));
                }
                
                btn.textContent = origText;
                btn.disabled = false;
            } catch (err) {
                alert("Failed to reach server.");
                console.error(err);
            }
        }

        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('message');
            btn.textContent = 'Saving...';
            msg.textContent = '';
            
            const payloadData = {
                email: document.getElementById('email').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                mi: document.getElementById('mi').value,
                year_level: document.getElementById('year_level') ? document.getElementById('year_level').value : null,
                password: document.getElementById('password').value
            };

            const student_no = document.getElementById('student_no').value.trim();
            if (student_no) {
                payloadData.student_no = student_no;
            }

            try {
                const res = await fetch('/api/students/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadData)
                });
                const result = await res.json();
                
                if(res.ok) {
                    closeModal();
                    loadStudents(); // Refresh the list!
                } else {
                    msg.style.color = '#fb923c';
                    msg.textContent = result.error;
                }
            } catch (err) {
                msg.style.color = '#fb923c';
                msg.textContent = 'Server error occurred.';
            }
            btn.textContent = 'Create Student';
        });
    </script>
</body>
</html>
