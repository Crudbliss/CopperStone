<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Teachers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Matrix theme styling */
        body { background: transparent; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .card { background: #12181f; border-radius: 12px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #38bdf8; }
        
        button { background: #38bdf8; color: #060f17; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; }
        .btn-close { background: transparent; color: #8b9eb0; padding: 0; font-size: 24px; font-weight: 300; line-height: 1; }
        .btn-close:hover { background: transparent; color: #fff; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 10px; color: #8b9eb0; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 14px; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        /* Modal Styling */
        .modal-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 15, 23, 0.8); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal {
            background: #12181f; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; color: #8b9eb0; }
        input, select { background: #0a1e2d; border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }

        /* --- MOBILE RESPONSIVENESS --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .card { padding: 16px; }
            .header-row { flex-direction: column; align-items: stretch; gap: 16px; }
            .header-row button { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group[style*="grid-column: span 2"] { grid-column: span 1 !important; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>

    <div class="card">
        <div class="header-row">
            <h2>Current Teachers</h2>
            <button onclick="openModal()">+ Add Teacher</button>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Learning Mode</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- The Modal -->
    <div id="addModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Teacher</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="addTeacherForm">
                <div class="form-grid">
                    <div class="form-group"><label>First Name</label><input type="text" id="first_name" required></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="last_name" required></div>
                    <div class="form-group"><label>Middle Initial</label><input type="text" id="mi"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" style="text-transform: lowercase;" oninput="this.value = this.value.toLowerCase()" required></div>
                    <div class="form-group"><label>Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="password" required style="width: 100%; padding-right: 40px;">
                            <span class="toggle-password" style="position: absolute; right: 10px; cursor: pointer; color: #8b9eb0;" onclick="togglePasswordVisibility('password', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </span>
                        </div>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Assigned Learning Mode</label>
                        <select id="learning_mode">
                            <option value="">-- No Mode Assigned --</option>
                            <option value="HI">Hierarchical Individual (HI)</option>
                            <option value="HC">Hierarchical Collective (HC)</option>
                            <option value="DI">Distributed Individual (DI)</option>
                            <option value="DC">Distributed Collective (DC)</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                    <button type="button" onclick="closeModal()" style="background: transparent; color: #8b9eb0; border: 1px solid rgba(255,255,255,0.2);">Cancel</button>
                    <button type="submit">Create Teacher</button>
                </div>
                <div id="message" style="margin-top: 15px; font-size: 14px; font-weight: 500; text-align: right;"></div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            } else {
                input.type = 'password';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            }
        }

        const modal = document.getElementById('addModal');
        
        function openModal() {
            modal.style.display = 'flex';
            document.getElementById('message').textContent = '';
        }
        
        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('addTeacherForm').reset();
        }

        // Close when clicking outside modal
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        async function loadTeachers() {
            try {
                const res = await fetch('/api/teachers');
                const teachers = await res.json();
                const tbody = document.getElementById('teacherTableBody');
                tbody.innerHTML = '';
                
                if (teachers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #8b9eb0; padding: 30px;">No teachers added yet.</td></tr>';
                    return;
                }

                teachers.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${t.first_name} ${t.mi || ''} ${t.last_name}</td>
                        <td>${t.email}</td>
                        <td>
                            <select onchange="updateTeacherMode(${t.id}, this.value)" style="background: #0a1e2d; border: 1px solid rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 4px; color: #fff; font-size: 12px; cursor: pointer; outline: none;">
                                <option value="" ${!t.learning_mode ? 'selected' : ''}>-- Unassigned --</option>
                                <option value="HI" ${t.learning_mode === 'HI' ? 'selected' : ''}>HI</option>
                                <option value="HC" ${t.learning_mode === 'HC' ? 'selected' : ''}>HC</option>
                                <option value="DI" ${t.learning_mode === 'DI' ? 'selected' : ''}>DI</option>
                                <option value="DC" ${t.learning_mode === 'DC' ? 'selected' : ''}>DC</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading teachers:", err);
            }
        }
        
        async function updateTeacherMode(id, mode) {
            try {
                const res = await fetch(`/api/teachers/${id}/learning_mode`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ learning_mode: mode || null })
                });
                if (!res.ok) {
                    alert("Failed to update learning mode.");
                    loadTeachers(); // Revert back
                }
            } catch(e) {
                console.error(e);
                alert("Server error updating learning mode.");
            }
        }
        
        loadTeachers();

        document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('message');
            btn.textContent = 'Saving...';
            msg.textContent = '';
            
            const data = {
                first_name: document.getElementById('first_name').value.trim(),
                last_name: document.getElementById('last_name').value.trim(),
                mi: document.getElementById('mi').value.trim(),
                email: document.getElementById('email').value.trim().toLowerCase(),
                password: document.getElementById('password').value,
                learning_mode: document.getElementById('learning_mode').value
            };

            try {
                const res = await fetch('/api/teachers/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(res.ok) {
                    closeModal();
                    loadTeachers(); // Refresh the list!
                } else {
                    msg.style.color = '#fb923c';
                    msg.textContent = result.error;
                }
            } catch (err) {
                msg.style.color = '#fb923c';
                msg.textContent = 'Server error occurred.';
            }
            btn.textContent = 'Create Teacher';
        });
    </script>
</body>
</html>
