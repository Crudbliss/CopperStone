<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --bg-base: #060f17;
            --bg-panel: #0a1e2d;
            --bg-card: #0d1722;
            --bg-card-inner: rgba(255, 255, 255, 0.02);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-card-subtle: rgba(255, 255, 255, 0.05);

            --matrix-yellow: #d8a61a;
            --matrix-yellow-hover: #eab308;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            --matrix-purple-dark: #a855f7;

            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            color: var(--text-main);
            padding: 24px;
            overflow-x: hidden;
        }

        /* --- 2x2 MAIN GRID --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- CARD BASE --- */
        .dash-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: border-color 0.2s ease;
        }

        .dash-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        /* --- CARD 1: WELCOME & DOMINANT MODE --- */
        .eyebrow-green {
            color: var(--matrix-green);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .user-name {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 6px;
            margin-bottom: 2px;
            letter-spacing: -0.2px;
        }

        .user-email {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .dominant-mode-box {
            background: rgba(74, 222, 128, 0.04);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .weakest-mode-box {
            background: rgba(192, 132, 252, 0.04);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .dominant-mode-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dominant-mode-icon, .weakest-mode-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dominant-mode-label {
            color: var(--matrix-green);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .weakest-mode-label {
            color: var(--matrix-purple);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dominant-mode-title {
            color: var(--matrix-green);
            font-size: 14.5px;
            font-weight: 700;
            margin-top: 1px;
        }

        .weakest-mode-title {
            color: var(--matrix-purple);
            font-size: 14.5px;
            font-weight: 700;
            margin-top: 1px;
        }

        .dominant-mode-badge {
            background: rgba(74, 222, 128, 0.15);
            color: var(--matrix-green);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .weakest-mode-badge {
            background: rgba(192, 132, 252, 0.15);
            color: var(--matrix-purple);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn-continue-learning {
            background: var(--matrix-green);
            color: #062816;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            border-radius: 9999px;
            padding: 12px 28px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(74, 222, 128, 0.25);
        }

        .btn-continue-learning:hover {
            background: #3ec46f;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.35);
        }

        /* --- CARD 2: ACTIVE LEARNING ROADMAP --- */
        #card-roadmap {
            --target-color: var(--matrix-blue);
        }

        .roadmap-eyebrow {
            color: var(--target-color, var(--matrix-purple));
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .roadmap-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
            margin-bottom: 22px;
        }

        .roadmap-subcard {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-card-subtle);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .roadmap-subcard-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .roadmap-target-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }

        .roadmap-target-sub {
            color: var(--target-color, var(--matrix-purple-dark));
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .roadmap-active-title {
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.35;
        }

        .roadmap-active-pct {
            color: var(--target-color, var(--matrix-purple));
            font-size: 14px;
            font-weight: 700;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .progress-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-track {
            background: rgba(255, 255, 255, 0.08);
            height: 8px;
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--target-color, var(--matrix-purple-dark));
            border-radius: 9999px;
            transition: width 0.4s ease, background-color 0.3s ease;
        }

        .btn-open-module {
            background: color-mix(in srgb, var(--target-color, #a855f7) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--target-color, #a855f7) 35%, transparent);
            color: var(--target-color, var(--matrix-purple));
            font-weight: 600;
            font-size: 13.5px;
            font-family: inherit;
            border-radius: 9999px;
            padding: 10px 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            transition: all 0.2s ease;
        }

        .btn-open-module:hover {
            background: color-mix(in srgb, var(--target-color, #a855f7) 22%, transparent);
            border-color: color-mix(in srgb, var(--target-color, #a855f7) 55%, transparent);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px color-mix(in srgb, var(--target-color, #a855f7) 25%, transparent);
        }

        /* --- CARD 3: LEARNING MODE DISTRIBUTION --- */
        .eyebrow-muted {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .dist-rows-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .dist-row {
            display: flex;
            flex-direction: column;
        }

        .dist-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .dist-label-left {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .dist-label-left svg {
            flex-shrink: 0;
        }

        .dist-code-muted {
            color: var(--text-subtle);
            font-size: 11px;
            font-weight: 500;
            margin-left: 2px;
        }

        .dist-tag-strength {
            background: rgba(74, 222, 128, 0.12);
            color: var(--matrix-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 6px;
        }

        .dist-tag-intervention {
            background: rgba(251, 146, 60, 0.12);
            color: var(--matrix-orange);
            border: 1px solid rgba(251, 146, 60, 0.3);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 6px;
        }

        .dist-val-pct {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .dist-val-pct.green {
            color: var(--matrix-green);
            font-size: 16px;
            font-weight: 800;
        }

        .dist-val-pct.purple {
            color: var(--matrix-purple);
            font-size: 16px;
            font-weight: 800;
        }

        .dist-sub-code {
            color: var(--text-subtle);
            font-size: 11px;
            margin-top: 1px;
            margin-bottom: 6px;
        }

        .dist-track {
            background: rgba(255, 255, 255, 0.06);
            height: 6px;
            border-radius: 9999px;
            overflow: hidden;
            width: 100%;
        }

        .dist-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.4s ease;
        }

        .dist-fill.green {
            background-color: var(--matrix-green);
        }

        .dist-fill.orange {
            background-color: var(--matrix-orange);
        }

        .dist-fill.blue {
            background-color: var(--matrix-blue);
        }

        .dist-fill.purple {
            background-color: var(--matrix-purple);
        }

        .dist-footnote {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 8px;
        }

        /* --- CARD 4: ASSESSMENT JOURNEY --- */
        .journey-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .journey-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            margin-top: 2px;
        }

        .btn-take-now {
            background: var(--matrix-yellow);
            color: #000000;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            border-radius: 9999px;
            padding: 7px 18px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(216, 166, 26, 0.2);
        }

        .btn-take-now:hover {
            background: var(--matrix-yellow-hover);
            transform: translateY(-1px);
        }

        .journey-stages-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .journey-stage-card {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-card-subtle);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .journey-stage-card.interactive {
            border-color: rgba(216, 166, 26, 0.3);
            cursor: pointer;
        }

        .journey-stage-card.interactive:hover {
            background: rgba(216, 166, 26, 0.05);
            border-color: rgba(216, 166, 26, 0.5);
            transform: translateY(-1px);
        }

        .journey-stage-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .journey-icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .journey-icon-circle.completed {
            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.25);
            color: var(--matrix-green);
        }

        .journey-icon-circle.open {
            background: rgba(216, 166, 26, 0.1);
            border: 1px solid rgba(216, 166, 26, 0.3);
            color: var(--matrix-yellow);
        }

        .journey-icon-circle.locked {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
        }

        .journey-stage-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }

        .journey-stage-date {
            color: var(--text-subtle);
            font-size: 12px;
            margin-top: 2px;
        }

        .journey-stage-date.gold {
            color: var(--matrix-yellow);
        }

        .journey-stage-right {
            text-align: right;
        }

        .journey-stage-pct {
            color: var(--matrix-green);
            font-size: 15px;
            font-weight: 700;
        }

        .journey-stage-mode {
            color: var(--matrix-green);
            font-size: 11px;
            margin-top: 1px;
        }

        .journey-stage-open-tag {
            color: var(--matrix-yellow);
            font-size: 13px;
            font-weight: 700;
        }

        .journey-stage-lock-tag {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }

        /* --- RESPONSIVE LAYOUT --- */
        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard-grid">

        <!-- ================= CARD 1: TOP LEFT (WELCOME) ================= -->
        <section class="dash-card">
            <div>
                <div class="eyebrow-green">WELCOME!</div>
                <h1 class="user-name" id="user-display-name">Student</h1>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
                    <!-- Dominant Mode Box -->
                    <div class="dominant-mode-box" id="dominant-mode-box">
                        <div class="dominant-mode-info">
                            <span class="dominant-mode-icon" id="dominant-mode-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                </svg>
                            </span>
                            <div>
                                <div class="dominant-mode-label" id="dominant-mode-label">DOMINANT MODE</div>
                                <div class="dominant-mode-title" id="dominant-mode-name">Loading...</div>
                            </div>
                        </div>
                        <span class="dominant-mode-badge" id="dominant-mode-code">--</span>
                    </div>

                    <!-- Weakest Quadrant Box -->
                    <div class="weakest-mode-box" id="weakest-mode-box">
                        <div class="dominant-mode-info">
                            <span class="weakest-mode-icon" id="weakest-mode-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                </svg>
                            </span>
                            <div>
                                <div class="weakest-mode-label" id="weakest-mode-label">WEAKEST QUADRANT</div>
                                <div class="weakest-mode-title" id="weakest-mode-name">Loading...</div>
                            </div>
                        </div>
                        <span class="weakest-mode-badge" id="weakest-mode-code">--</span>
                    </div>
                </div>
            </div>

            <div>
                <button class="btn-continue-learning" id="btn-continue-learning" onclick="navigateToModules()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 4 20 12 6 20 6 4"></polygon>
                    </svg>
                    <span>Continue Learning</span>
                </button>
            </div>
        </section>

        <!-- ================= CARD 2: TOP RIGHT (ACTIVE LEARNING ROADMAP) ================= -->
        <section class="dash-card" id="card-roadmap">
            <div>
                <div class="roadmap-eyebrow" id="roadmap-eyebrow">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                    <span>ACTIVE LEARNING ROADMAP</span>
                </div>

                <div class="roadmap-grid">
                    <div class="roadmap-subcard">
                        <div class="roadmap-subcard-label">Target Quadrant</div>
                        <div class="roadmap-target-title">
                            <span id="target-quadrant-icon" style="display: flex; align-items: center;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54z">
                                    </path>
                                    <path
                                        d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54z">
                                    </path>
                                </svg>
                            </span>
                            <span id="target-quadrant-title">Loading...</span>
                        </div>
                        <div class="roadmap-target-sub" id="target-quadrant-sub">--</div>
                    </div>

                    <div class="roadmap-subcard">
                        <div class="roadmap-subcard-label">Active Module</div>
                        <div class="roadmap-active-title" id="active-module-name">Loading recommended module...</div>
                        <div class="roadmap-active-pct" id="active-module-pct">0%</div>
                    </div>
                </div>

                <div>
                    <div class="progress-header-row">
                        <span>Module Progress</span>
                        <span id="module-chapters-text">0/0 chapters</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="module-progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <div>
                <button class="btn-open-module" id="btn-open-module" onclick="navigateToModules()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span>Open Module</span>
                </button>
            </div>
        </section>

        <!-- ================= CARD 3: BOTTOM LEFT (LEARNING MODE DISTRIBUTION) ================= -->
        <section class="dash-card">
            <div class="eyebrow-muted">LEARNING MODE DISTRIBUTION</div>

            <div class="dist-rows-container" id="dist-container">
                <!-- Dynamically populated via renderLearningDistribution -->
            </div>
        </section>

        <!-- ================= CARD 4: BOTTOM RIGHT (ASSESSMENT JOURNEY) ================= -->
        <section class="dash-card">
            <div>
                <div class="journey-header">
                    <div>
                        <div class="eyebrow-muted" style="margin-bottom: 4px;">ASSESSMENT JOURNEY</div>
                        <h3 class="journey-title">28-Item Survey · 3 Stages</h3>
                    </div>
                    <button class="btn-take-now" id="btn-journey-action" onclick="navigateToAssessment()">
                        <span>&rarr;</span>
                        <span id="journey-action-text">Take Now</span>
                    </button>
                </div>

                <div class="journey-stages-container" id="journey-stages-list">
                    <!-- Dynamic stages will be injected here -->
                </div>
            </div>
        </section>

    </main>

    <!-- Navigation & Dynamic Backend Data Handler -->
    <script>
        let activeModuleId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadStudentData();
        });

        // Calculate Quadrant Percentages from coordinates (-5 to 5)
        function getPercentages(x, y) {
            let normX = (x + 5) / 10;
            let normY = (y + 5) / 10;

            let HI = (1 - normX) * normY;
            let DI = normX * normY;
            let HC = (1 - normX) * (1 - normY);
            let DC = normX * (1 - normY);

            const total = (HI + DI + HC + DC) || 1;

            return {
                HI: Math.round((HI / total) * 100),
                DI: Math.round((DI / total) * 100),
                HC: Math.round((HC / total) * 100),
                DC: Math.round((DC / total) * 100)
            };
        }

        // SVG icon definitions for each learning mode
        const svgIcons = {
            HI: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`,
            HC: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
            DI: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
            DC: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54z"></path></svg>`
        };

        const modeMap = {
            'Hierarchical Individual': { code: 'HI', short: 'H. Individual', iconSvg: svgIcons.HI, color: 'var(--matrix-green)' },
            'Hierarchical Collective': { code: 'HC', short: 'H. Collective', iconSvg: svgIcons.HC, color: 'var(--matrix-orange)' },
            'Distributed Individual': { code: 'DI', short: 'D. Individual', iconSvg: svgIcons.DI, color: 'var(--matrix-blue)' },
            'Distributed Collective': { code: 'DC', short: 'D. Collective', iconSvg: svgIcons.DC, color: 'var(--matrix-purple)' }
        };

        async function loadStudentData() {
            let user = null;
            try {
                const userStr = localStorage.getItem('currentUser');
                if (userStr) user = JSON.parse(userStr);
            } catch (e) { }

            // 1. Fetch Fresh Student Profile & Data from Backend
            if (user && user.id) {
                try {
                    const studentRes = await fetch(`/api/students/${user.id}`);
                    if (studentRes.ok) {
                        const freshStudent = await studentRes.json();
                        user = { ...user, ...freshStudent };
                        localStorage.setItem('currentUser', JSON.stringify(user));
                        localStorage.setItem('studentProfile', JSON.stringify(freshStudent));
                    }
                } catch (e) {
                    console.error('Student fetch error', e);
                }
            }

            if (user) {
                const fullName = `${user.name || user.first_name || ''} ${user.last_name || ''}`.trim();
                if (fullName) {
                    document.getElementById('user-display-name').textContent = fullName;
                }
            }

            // 2. Fetch Assessment History & Student Profile
            let history = [];
            let latestCoords = { x: -3, y: 3 }; // default baseline
            let dominantMode = 'Hierarchical Individual';

            if (user && user.id) {
                try {
                    const res = await fetch(`/api/students/${user.id}/history`);
                    if (res.ok) {
                        history = await res.json();
                    }
                } catch (err) {
                    console.error('History fetch error', err);
                }
            }

            // Determine latest assessment coordinates and dominant mode
            if (history && history.length > 0) {
                const latest = history[history.length - 1];
                latestCoords.x = (latest.x_coord !== undefined) ? latest.x_coord : (user.x_coord || -3);
                latestCoords.y = (latest.y_coord !== undefined) ? latest.y_coord : (user.y_coord || 3);
                dominantMode = latest.learning_mode || user.learning_mode || 'Hierarchical Individual';
            } else if (user && user.learning_mode) {
                dominantMode = user.learning_mode;
                latestCoords.x = user.x_coord || -3;
                latestCoords.y = user.y_coord || 3;
            }

            // Populate Card 1: Dominant Mode Box
            const modeInfo = modeMap[dominantMode] || modeMap['Hierarchical Individual'];
            document.getElementById('dominant-mode-name').textContent = dominantMode;
            document.getElementById('dominant-mode-code').textContent = modeInfo.code;
            document.getElementById('dominant-mode-icon').innerHTML = modeInfo.iconSvg;
            document.getElementById('dominant-mode-icon').style.color = modeInfo.color;

            // Apply mode colors
            const domBox = document.getElementById('dominant-mode-box');
            if (domBox) {
                domBox.style.borderColor = `color-mix(in srgb, ${modeInfo.color} 30%, transparent)`;
                domBox.style.background = `color-mix(in srgb, ${modeInfo.color} 5%, transparent)`;
                document.getElementById('dominant-mode-label').style.color = modeInfo.color;
                document.getElementById('dominant-mode-name').style.color = modeInfo.color;
                document.getElementById('dominant-mode-code').style.color = modeInfo.color;
                document.getElementById('dominant-mode-code').style.background = `color-mix(in srgb, ${modeInfo.color} 15%, transparent)`;
            }

            // 3. Card 3: Dynamic Learning Mode Distribution Percentages & Badges
            const pcts = getPercentages(latestCoords.x, latestCoords.y);
            renderLearningDistribution(pcts);

            // 4. Card 2: Active Learning Roadmap (Target Quadrant & Module Progress)
            const modesList = [
                { key: 'HI', name: 'Hierarchical Individual', short: 'H. Individual', pct: pcts.HI, iconSvg: svgIcons.HI, color: 'var(--matrix-green)' },
                { key: 'HC', name: 'Hierarchical Collective', short: 'H. Collective', pct: pcts.HC, iconSvg: svgIcons.HC, color: 'var(--matrix-orange)' },
                { key: 'DI', name: 'Distributed Individual', short: 'D. Individual', pct: pcts.DI, iconSvg: svgIcons.DI, color: 'var(--matrix-blue)' },
                { key: 'DC', name: 'Distributed Collective', short: 'D. Collective', pct: pcts.DC, iconSvg: svgIcons.DC, color: 'var(--matrix-purple)' }
            ].sort((a, b) => a.pct - b.pct);

            const lowest = modesList[0]; // Target Quadrant is the lowest (weakest) quadrant

            // Dynamically tint Card 2 with the target/weak quadrant color
            const cardRoadmap = document.getElementById('card-roadmap');
            if (cardRoadmap) {
                cardRoadmap.style.setProperty('--target-color', lowest.color);
            }

            document.getElementById('target-quadrant-title').textContent = lowest.short;
            document.getElementById('target-quadrant-icon').innerHTML = lowest.iconSvg;
            document.getElementById('target-quadrant-icon').style.color = lowest.color;
            document.getElementById('target-quadrant-sub').textContent = `${lowest.key} · ${lowest.pct}%`;

            // Populate Card 1: Weakest Quadrant Box
            const weakBox = document.getElementById('weakest-mode-box');
            if (weakBox && lowest) {
                weakBox.style.borderColor = `color-mix(in srgb, ${lowest.color} 30%, transparent)`;
                weakBox.style.background = `color-mix(in srgb, ${lowest.color} 5%, transparent)`;
                document.getElementById('weakest-mode-label').style.color = lowest.color;
                document.getElementById('weakest-mode-name').style.color = lowest.color;
                document.getElementById('weakest-mode-name').textContent = lowest.name;
                document.getElementById('weakest-mode-code').style.color = lowest.color;
                document.getElementById('weakest-mode-code').style.background = `color-mix(in srgb, ${lowest.color} 15%, transparent)`;
                document.getElementById('weakest-mode-code').textContent = lowest.key;
                document.getElementById('weakest-mode-icon').innerHTML = lowest.iconSvg;
                document.getElementById('weakest-mode-icon').style.color = lowest.color;
            }

            let isTargetModuleCompleted = false;

            // Fetch Real Modules & Compute Exact Module Progress
            try {
                let modules = [];
                let progressRows = [];

                const modRes = await fetch('/api/modules?role=student');
                if (modRes.ok) modules = await modRes.json();

                if (user && user.id) {
                    const progRes = await fetch(`/api/progress/${user.id}`);
                    if (progRes.ok) progressRows = await progRes.json();
                }

                // Match module for student's weakest/target quadrant
                let targetMod = modules.find(m => m.quadrant_category === lowest.name) || modules[0];
                let activeProg = targetMod ? progressRows.find(p => p.module_id === targetMod.id) : null;

                if (targetMod) {
                    activeModuleId = targetMod.id;
                    document.getElementById('active-module-name').textContent = targetMod.title;

                    const totalChapters = (targetMod.chapters ? targetMod.chapters.length : 0) || (targetMod.chapter_count || 4);

                    // Check local progress storage for granular chapter completions
                    let localProg = null;
                    if (user && user.id) {
                        try {
                            const lpStr = localStorage.getItem(`student_mod_prog_v2_${user.id}_${targetMod.id}`) ||
                                localStorage.getItem(`student_mod_prog_${user.id}_${targetMod.id}`);
                            if (lpStr) localProg = JSON.parse(lpStr);
                        } catch (e) { }
                    }

                    let completedCount = 0;
                    if (localProg && Array.isArray(localProg.completedChapters)) {
                        completedCount = localProg.completedChapters.length;
                    } else if (activeProg) {
                        completedCount = activeProg.tasks_completed || 0;
                    }

                    const maxTasks = totalChapters > 0 ? totalChapters : 4;
                    const clampedCompleted = Math.min(completedCount, maxTasks);
                    const progressPct = maxTasks > 0 ? Math.round((clampedCompleted / maxTasks) * 100) : 0;

                    document.getElementById('active-module-pct').textContent = `${progressPct}%`;
                    document.getElementById('module-chapters-text').textContent = `${clampedCompleted}/${maxTasks} chapters`;
                    document.getElementById('module-progress-fill').style.width = `${progressPct}%`;

                    // Check if target module is 100% completed
                    const isCompletedLocal = localProg && (localProg.moduleCompleted || localProg.completedFinal || (Array.isArray(localProg.completedChapters) && totalChapters > 0 && localProg.completedChapters.length >= totalChapters));
                    const isCompletedServer = activeProg && (activeProg.status === 'Completed' || (totalChapters > 0 && activeProg.tasks_completed >= totalChapters));
                    if (progressPct >= 100 || isCompletedLocal || isCompletedServer) {
                        isTargetModuleCompleted = true;
                    }
                }
            } catch (e) {
                console.error('Modules fetch error', e);
            }

            // 5. Card 4: Assessment Journey (3 Stages)
            renderAssessmentJourney(history, isTargetModuleCompleted);
        }

        function renderLearningDistribution(pcts) {
            const modes = [
                { key: 'HI', name: 'Hierarchical Individual', short: 'H. Individual', pct: pcts.HI, iconSvg: svgIcons.HI, colorClass: 'green' },
                { key: 'HC', name: 'Hierarchical Collective', short: 'H. Collective', pct: pcts.HC, iconSvg: svgIcons.HC, colorClass: 'orange' },
                { key: 'DI', name: 'Distributed Individual', short: 'D. Individual', pct: pcts.DI, iconSvg: svgIcons.DI, colorClass: 'blue' },
                { key: 'DC', name: 'Distributed Collective', short: 'D. Collective', pct: pcts.DC, iconSvg: svgIcons.DC, colorClass: 'purple' }
            ];

            let highest = modes[0];
            let lowest = modes[0];
            modes.forEach(m => {
                if (m.pct > highest.pct) highest = m;
                if (m.pct < lowest.pct) lowest = m;
            });

            const container = document.getElementById('dist-container');
            if (!container) return;

            let html = '';
            modes.forEach(m => {
                const isHighest = m.key === highest.key;
                const isLowest = m.key === lowest.key;

                let badgeHtml = '';
                if (isHighest) {
                    badgeHtml = `<span class="dist-tag-strength">Strengths &uarr;</span>`;
                } else if (isLowest) {
                    badgeHtml = `<span class="dist-tag-intervention">Intervention &darr;</span>`;
                } else {
                    badgeHtml = `<span class="dist-code-muted">${m.key}</span>`;
                }

                const pctClass = isHighest ? 'green' : (isLowest ? 'purple' : '');

                html += `
                    <div class="dist-row">
                        <div class="dist-row-top">
                            <div class="dist-label-left">
                                <span style="display: flex; align-items: center; color: var(--matrix-${m.colorClass});">${m.iconSvg}</span>
                                <span>${m.key === 'HC' || m.key === 'DI' ? m.short : m.name}</span>
                                ${badgeHtml}
                            </div>
                            <span class="dist-val-pct ${pctClass}">${m.pct}%</span>
                        </div>
                        ${(isHighest || isLowest) ? `<div class="dist-sub-code">${m.key}</div>` : ''}
                        <div class="dist-track" style="${!(isHighest || isLowest) ? 'margin-top: 8px;' : ''}">
                            <div class="dist-fill ${m.colorClass}" style="width: ${m.pct}%;"></div>
                        </div>
                    </div>
                `;
            });

            const diff = 70 - lowest.pct;
            const noteText = diff > 0
                ? `${diff}% below the 70% threshold &middot; focus on ${lowest.short}`
                : `All quadrants balanced above standard proficiency threshold`;

            html += `<div class="dist-footnote" id="dist-footnote-text">${noteText}</div>`;
            container.innerHTML = html;
        }

        function renderAssessmentJourney(history, isTargetModuleCompleted) {
            const container = document.getElementById('journey-stages-list');
            if (!container) return;

            const stageNames = ['First Assessment', 'Second Assessment', 'Final Assessment'];
            let html = '';
            let nextActiveStageIndex = -1;
            const completedCount = history ? history.length : 0;

            for (let i = 0; i < 3; i++) {
                const stageEntry = history && history[i];
                const stageTitle = stageNames[i];

                if (stageEntry) {
                    // Completed stage
                    const dateObj = new Date(stageEntry.taken_at || Date.now());
                    const dateStr = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                    const pcts = getPercentages(stageEntry.x_coord || 0, stageEntry.y_coord || 0);
                    const mode = stageEntry.learning_mode || 'Hierarchical Individual';
                    const modeInfo = modeMap[mode] || modeMap['Hierarchical Individual'];
                    const dominantPct = pcts[modeInfo.code] || 70;

                    html += `
                        <div class="journey-stage-card">
                            <div class="journey-stage-left">
                                <div class="journey-icon-circle completed">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                                <div>
                                    <div class="journey-stage-name">${stageTitle}</div>
                                    <div class="journey-stage-date">Completed ${dateStr}</div>
                                </div>
                            </div>
                            <div class="journey-stage-right">
                                <div class="journey-stage-pct">${dominantPct}%</div>
                                <div class="journey-stage-mode">${modeInfo.short}</div>
                            </div>
                        </div>
                    `;
                } else {
                    let isUnlocked = false;
                    let lockedReason = 'Available after milestone';

                    if (i === 0) {
                        // First assessment is open if never taken
                        isUnlocked = true;
                    } else if (i === 1) {
                        // Second assessment is only open after Stage 1 AND Module is completed
                        if (completedCount >= 1) {
                            if (isTargetModuleCompleted) {
                                isUnlocked = true;
                            } else {
                                lockedReason = 'Available after module completion';
                            }
                        } else {
                            lockedReason = 'Available after First Assessment';
                        }
                    } else if (i === 2) {
                        // Final assessment is only open after Stage 2 AND Module is completed
                        if (completedCount >= 2) {
                            if (isTargetModuleCompleted) {
                                isUnlocked = true;
                            } else {
                                lockedReason = 'Available after module completion';
                            }
                        } else {
                            lockedReason = 'Available after Second Assessment';
                        }
                    }

                    if (isUnlocked) {
                        if (nextActiveStageIndex === -1) nextActiveStageIndex = i;
                        html += `
                            <div class="journey-stage-card interactive" onclick="navigateToAssessment()">
                                <div class="journey-stage-left">
                                    <div class="journey-icon-circle open">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                                            <polygon points="6 4 20 12 6 20 6 4"></polygon>
                                        </svg>
                                    </div>
                                    <div>
                                        <div class="journey-stage-name">${stageTitle}</div>
                                        <div class="journey-stage-date gold">Available now</div>
                                    </div>
                                </div>
                                <div class="journey-stage-right">
                                    <div class="journey-stage-open-tag">Open</div>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="journey-stage-card" style="opacity: 0.6;">
                                <div class="journey-stage-left">
                                    <div class="journey-icon-circle locked">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <div class="journey-stage-name">${stageTitle}</div>
                                        <div class="journey-stage-date">${lockedReason}</div>
                                    </div>
                                </div>
                                <div class="journey-stage-right">
                                    <div class="journey-stage-lock-tag">Locked</div>
                                </div>
                            </div>
                        `;
                    }
                }
            }

            container.innerHTML = html;

            // Update top action button
            const actionBtn = document.getElementById('btn-journey-action');
            const actionText = document.getElementById('journey-action-text');
            if (actionBtn && actionText) {
                if (completedCount >= 3) {
                    actionText.textContent = 'View Results';
                    actionBtn.style.display = 'inline-flex';
                    actionBtn.style.opacity = '1';
                    actionBtn.style.pointerEvents = 'auto';
                    actionBtn.style.cursor = 'pointer';
                    actionBtn.onclick = () => navigateToAssessment();
                } else if (nextActiveStageIndex !== -1) {
                    actionText.textContent = 'Take Now';
                    actionBtn.style.display = 'inline-flex';
                    actionBtn.style.opacity = '1';
                    actionBtn.style.pointerEvents = 'auto';
                    actionBtn.style.cursor = 'pointer';
                    actionBtn.onclick = () => navigateToAssessment();
                } else {
                    // Next stage is locked because module is still in progress
                    actionText.textContent = 'Locked';
                    actionBtn.style.display = 'inline-flex';
                    actionBtn.style.opacity = '0.4';
                    actionBtn.style.pointerEvents = 'none';
                    actionBtn.style.cursor = 'not-allowed';
                    actionBtn.onclick = null;
                }
            }
        }

        function navigateToModules() {
            const targetUrl = 'modules-content.html';
            if (window.parent && window.parent.document) {
                const frame = window.parent.document.getElementById('content-frame');
                if (frame) {
                    frame.src = targetUrl;
                } else {
                    window.location.href = targetUrl;
                }
                updateParentSidebar(1);
            } else {
                window.location.href = targetUrl;
            }
        }

        function navigateToAssessment() {
            if (window.parent && window.parent.document) {
                const frame = window.parent.document.getElementById('content-frame');
                if (frame) {
                    frame.src = 'qa-content.html';
                } else {
                    window.location.href = 'qa-content.html';
                }
                updateParentSidebar(2);
            } else {
                window.location.href = 'qa-content.html';
            }
        }

        function updateParentSidebar(activeIndex) {
            if (window.parent && window.parent.document) {
                const sidebarLinks = window.parent.document.querySelectorAll('.sidebar-link');
                if (sidebarLinks && sidebarLinks.length > 0) {
                    sidebarLinks.forEach(link => link.classList.remove('active'));
                    if (sidebarLinks[activeIndex]) {
                        sidebarLinks[activeIndex].classList.add('active');
                    }
                }
            }
        }
    </script>
</body>

</html>
