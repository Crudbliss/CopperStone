<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Modules Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            
            --matrix-yellow: #d8a61a;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            
            /* Status / Difficulty Colors */
            --tag-beginner: #4ade80;
            --tag-intermediate: #d8a61a;
            --tag-advanced: #fb923c;
            
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            
            --border-light: rgba(255, 255, 255, 0.08);
            
            /* Gap Container Backgrounds */
            --bg-purple-faint: rgba(192, 132, 252, 0.05);
            --border-purple-faint: rgba(192, 132, 252, 0.2);
            
            --bg-blue-faint: rgba(56, 189, 248, 0.05);
            --border-blue-faint: rgba(56, 189, 248, 0.2);
            
            --bg-orange-faint: rgba(251, 146, 60, 0.05);
            --border-orange-faint: rgba(251, 146, 60, 0.2);
            
            --bg-green-faint: rgba(74, 222, 128, 0.05);
            --border-green-faint: rgba(74, 222, 128, 0.2);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .svg-defs { display: none; }
        
        svg {
            display: inline-block;
            vertical-align: middle;
        }

        /* --- MAIN CONTAINER --- */
        .modules-container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* --- HEADER --- */
        .page-header {
            margin-bottom: 8px;
        }
        
        .header-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .header-title-row svg {
            width: 24px;
            height: 24px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
        }
        
        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }
        
        .highlight-green {
            color: var(--matrix-green);
            font-weight: 700;
        }

        /* --- MODULE GRID & CARDS --- */
        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .module-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .module-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .module-icon {
            font-size: 20px;
        }

        .tags-row {
            display: flex;
            gap: 8px;
        }

        .tag {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* Tag Variations */
        .tag-beginner { background-color: rgba(74, 222, 128, 0.1); color: var(--tag-beginner); }
        .tag-intermediate { background-color: rgba(216, 166, 26, 0.1); color: var(--tag-intermediate); }
        .tag-advanced { background-color: rgba(251, 146, 60, 0.1); color: var(--tag-advanced); }
        
        .tag-topic { background-color: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-light); }

        .module-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .module-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
            flex: 1;
        }

        .card-bottom {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .card-bottom svg { width: 14px; height: 14px; }


        /* --- DIVIDER --- */
        .section-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
        }
        .section-divider::before, .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }
        .section-divider span {
            padding: 0 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: -16px;
            margin-bottom: 24px;
        }


        /* --- GAP SECTIONS --- */
        .gap-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .gap-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gap-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gap-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .gap-title span { font-size: 18px; } /* For the emoji */

        /* Gap Box Styling */
        .gap-info-box {
            padding: 24px;
            border-radius: 12px;
            border: 1px solid;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gap-description {
            font-size: 14px;
            line-height: 1.6;
            color: #d1d5db; /* Slightly lighter than muted */
        }

        .tips-header {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .tips-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tips-list li {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        /* Specific Gap Colors */
        
        /* Purple (Primary) */
        .gap-purple .gap-pill { background-color: rgba(216, 166, 26, 0.15); color: var(--matrix-yellow); } /* Primary pill is yellow in image */
        .gap-purple .gap-title { color: var(--matrix-purple); }
        .gap-purple .gap-info-box { background-color: var(--bg-purple-faint); border-color: var(--border-purple-faint); }
        .gap-purple .tips-header { color: var(--matrix-purple); }
        .gap-purple .tips-list li::before { content: '→'; color: var(--matrix-purple); }

        /* Cyan/Blue (Secondary) */
        .gap-blue .gap-pill { background-color: rgba(216, 166, 26, 0.15); color: var(--matrix-yellow); }
        .gap-blue .gap-title { color: var(--matrix-blue); }
        .gap-blue .gap-info-box { background-color: var(--bg-blue-faint); border-color: var(--border-blue-faint); }
        .gap-blue .tips-header { color: var(--matrix-blue); }
        .gap-blue .tips-list li::before { content: '→'; color: var(--matrix-blue); }

        /* Orange (Tertiary) */
        .gap-orange .gap-pill { background-color: rgba(216, 166, 26, 0.15); color: var(--matrix-yellow); }
        .gap-orange .gap-title { color: var(--matrix-orange); }
        .gap-orange .gap-info-box { background-color: var(--bg-orange-faint); border-color: var(--border-orange-faint); }
        .gap-orange .tips-header { color: var(--matrix-orange); }
        .gap-orange .tips-list li::before { content: '→'; color: var(--matrix-orange); }

        /* Green (Quaternary) */
        .gap-green .gap-pill { background-color: rgba(216, 166, 26, 0.15); color: var(--matrix-yellow); }
        .gap-green .gap-title { color: var(--matrix-green); }
        .gap-green .gap-info-box { background-color: var(--bg-green-faint); border-color: var(--border-green-faint); }
        .gap-green .tips-header { color: var(--matrix-green); }
        .gap-green .tips-list li::before { content: '→'; color: var(--matrix-green); }

        /* For the specific gap tag colors */
        .tag-purple-outline { border: 1px solid rgba(192, 132, 252, 0.3); color: #c084fc; background: none;}
        .tag-blue-outline { border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; background: none;}
        .tag-orange-outline { border: 1px solid rgba(251, 146, 60, 0.3); color: #fb923c; background: none;}
        .tag-green-outline { border: 1px solid rgba(74, 222, 128, 0.3); color: #4ade80; background: none;}

    </style>
</head>
<body>

    <svg class="svg-defs">
        <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></symbol>
    </svg>

    <div class="modules-container" id="modules-root">
        <div style="text-align: center; color: var(--text-muted); padding: 40px;">
            <p>Loading personalized modules...</p>
        </div>
    </div>

    <script>
        const modesData = {
            "Hierarchical Individual": {
                id: "hi",
                colorName: "green",
                icon: "📚",
                title: "Hierarchical Individual",
                desc: "techniques that align with how you naturally learn best through structured, teacher-directed instruction.",
                gapDesc: "You learn best through structured, teacher-directed instruction in a solo setting. Clear guidelines and direct authority from an instructor help you thrive.",
                tips: [
                    "Practice sitting through a fully lecture-based class session with focused note-taking",
                    "Follow a strictly structured textbook chapter from start to finish, solo",
                    "Submit individual work to a teacher and request direct, authoritative feedback",
                    "Create a strict daily study schedule and adhere to it"
                ],
                modules: [
                    { icon: "✏️", tagClass: "tag-beginner", tagText: "Beginner", topic: "Note-Taking", title: "Cornell Note-Taking System", desc: "Master the Cornell method to organize lectures and textbook content into powerful study notes.", time: "45 min" },
                    { icon: "🎬", tagClass: "tag-beginner", tagText: "Beginner", topic: "Comprehension", title: "Active Lecture Comprehension", desc: "Techniques for absorbing and retaining information from teacher-led lessons and recorded lectures.", time: "30 min" },
                    { icon: "📖", tagClass: "tag-intermediate", tagText: "Intermediate", topic: "Retention", title: "Structured Self-Review Methods", desc: "Spaced repetition and sequential review strategies to reinforce material learned from direct instruction.", time: "20 min" },
                    { icon: "🔧", tagClass: "tag-intermediate", tagText: "Intermediate", topic: "Problem-Solving", title: "Step-by-Step Problem Frameworks", desc: "Systematic approaches to breaking down complex IT problems using structured logical flow.", time: "60 min" }
                ]
            },
            "Distributed Individual": {
                id: "di",
                colorName: "blue",
                icon: "💻",
                title: "Distributed Individual",
                desc: "techniques that align with your preference for autonomous, self-directed exploration.",
                gapDesc: "You are an autonomous, self-directed learner who thrives when given freedom to explore. You excel through technology-enabled discovery at your own pace.",
                tips: [
                    "Dedicate one study session per week to completely solo, unguided review",
                    "Practice making independent academic decisions without seeking teacher approval first",
                    "Start a personal IT project with no assigned rules or rubrics",
                    "Try self-paced online courses and pace yourself without external deadlines"
                ],
                modules: [
                    { icon: "✏️", tagClass: "tag-beginner", tagText: "Beginner", topic: "Planning", title: "Building Your Learning Roadmap", desc: "Create a self-directed study plan using curated online courses, documentation, and open resources.", time: "40 min" },
                    { icon: "🔧", tagClass: "tag-advanced", tagText: "Advanced", topic: "Project-Based", title: "Portfolio Project Development", desc: "Channel your independent learning into a personal IT project that demonstrates your growing skills.", time: "90 min" }
                ]
            },
            "Hierarchical Collective": {
                id: "hc",
                colorName: "orange",
                icon: "🤝",
                title: "Hierarchical Collective",
                desc: "techniques that align with your preference for structured, teacher-guided team environments.",
                gapDesc: "You flourish in teacher-guided group environments. Structured collaborative activities, clear roles, and instructor oversight bring out your best performance.",
                tips: [
                    "Attend structured group study sessions at least once a week",
                    "Volunteer to take a specific, clearly defined role in your next group project",
                    "Ask a teacher or mentor to set a guided learning path for your study group",
                    "Practice evaluating peer work using a strict teacher-provided rubric"
                ],
                modules: [
                    { icon: "✏️", tagClass: "tag-beginner", tagText: "Beginner", topic: "Collaboration", title: "Structured Group Study Design", desc: "Organize effective study groups with clearly defined roles, agendas, and teacher-set objectives.", time: "50 min" },
                    { icon: "🎬", tagClass: "tag-intermediate", tagText: "Intermediate", topic: "Discussion", title: "Socratic Dialogue Techniques", desc: "Participate meaningfully in instructor-led class discussions using structured questioning frameworks.", time: "35 min" }
                ]
            },
            "Distributed Collective": {
                id: "dc",
                colorName: "purple",
                icon: "🧠",
                title: "Distributed Collective",
                desc: "techniques that align with your preference for open, peer-driven, collaborative environments.",
                gapDesc: "You excel in peer-driven, inquiry-based group settings. Shared leadership, open-ended discussions, and co-creation of knowledge define your ideal learning environment.",
                tips: [
                    "Join an open brainstorming session or hackathon without predefined roles",
                    "Engage in peer-review circles where feedback flows freely among students",
                    "Co-lead a flexible group project where the team decides the direction",
                    "Participate in debate clubs or open academic forums"
                ],
                modules: [
                    { icon: "✏️", tagClass: "tag-intermediate", tagText: "Intermediate", topic: "Teaching", title: "Peer Teaching Circles", desc: "Lead and participate in sessions where each member teaches a topic to the group, deepening mutual understanding.", time: "60 min" },
                    { icon: "🔧", tagClass: "tag-advanced", tagText: "Advanced", topic: "Project-Based", title: "Open Inquiry IT Projects", desc: "Collaborate on group projects where the problem, solution, and process are defined collectively by the team.", time: "120 min" }
                ]
            }
        };

        const modeOpposites = {
            "Hierarchical Individual": "Distributed Collective",
            "Distributed Collective": "Hierarchical Individual",
            "Distributed Individual": "Hierarchical Collective",
            "Hierarchical Collective": "Distributed Individual"
        };

        document.addEventListener('DOMContentLoaded', () => {
            const root = document.getElementById('modules-root');
            const profileStr = localStorage.getItem('studentProfile');
            
            if (!profileStr) {
                root.innerHTML = `
                    <div style="text-align: center; color: var(--matrix-orange); padding: 40px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-light);">
                        <h3 style="margin-bottom: 10px;">Not Assessed</h3>
                        <p style="color: var(--text-muted);">Please complete the Learning Mode Assessment to unlock your personalized modules.</p>
                    </div>`;
                return;
            }

            const profile = JSON.parse(profileStr);
            const domModeName = profile.learning_mode || "Hierarchical Individual";
            
            if (!modesData[domModeName]) {
                root.innerHTML = '<p>Unknown learning mode.</p>';
                return;
            }

            const domMode = modesData[domModeName];
            
            // Determine Gaps
            const primaryGapName = modeOpposites[domModeName];
            const primaryGap = modesData[primaryGapName];
            
            const remainingNames = Object.keys(modesData).filter(m => m !== domModeName && m !== primaryGapName);
            const secondaryGap = modesData[remainingNames[0]];
            const tertiaryGap = modesData[remainingNames[1]];

            // Generate HTML
            let html = `
                <div class="page-header">
                    <div class="header-title-row">
                        <span>${domMode.icon}</span>
                        <h1 class="page-title">Your Dominant Mode Modules</h1>
                    </div>
                    <p class="page-subtitle">Personalized for your <span style="color: var(--matrix-${domMode.colorName}); font-weight: 700;">${domMode.title}</span> learning style — ${domMode.desc}</p>
                </div>

                <div class="module-grid">
                    ${domMode.modules.map(m => `
                        <div class="module-card">
                            <div class="card-top">
                                <span class="module-icon">${m.icon}</span>
                                <div class="tags-row">
                                    <span class="tag ${m.tagClass}">${m.tagText}</span>
                                    <span class="tag tag-topic">${m.topic}</span>
                                </div>
                            </div>
                            <h3 class="module-title">${m.title}</h3>
                            <p class="module-desc">${m.desc}</p>
                            <div class="card-bottom">
                                <svg><use href="#icon-clock"></use></svg> ${m.time}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="section-divider">
                    <span>STRENGTHEN YOUR OTHER MODES</span>
                </div>
                <p class="section-desc">These modules target your weaker quadrants. Strengthening them builds cognitive adaptability and makes you a more versatile learner.</p>
            `;

            // Gap Sections Builder
            const buildGap = (gapLevel, gapData) => `
                <div class="gap-section gap-${gapData.colorName}">
                    <div class="gap-header">
                        <span class="gap-pill">${gapLevel} GAP</span>
                        <h3 class="gap-title"><span>${gapData.icon}</span> ${gapData.title}</h3>
                    </div>
                    
                    <div class="gap-info-box">
                        <p class="gap-description">${gapData.gapDesc}</p>
                        <div>
                            <h4 class="tips-header">💡 Strengthening Tips:</h4>
                            <ul class="tips-list">
                                ${gapData.tips.map(t => `<li>${t}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="module-grid">
                        ${gapData.modules.map(m => `
                            <div class="module-card">
                                <div class="card-top">
                                    <span class="module-icon">${m.icon}</span>
                                    <div class="tags-row">
                                        <span class="tag ${m.tagClass}">${m.tagText}</span>
                                        <span class="tag tag-${gapData.colorName}-outline">${m.topic}</span>
                                    </div>
                                </div>
                                <h3 class="module-title">${m.title}</h3>
                                <p class="module-desc">${m.desc}</p>
                                <div class="card-bottom"><svg><use href="#icon-clock"></use></svg> ${m.time}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            html += buildGap("PRIMARY", primaryGap);
            html += buildGap("SECONDARY", secondaryGap);
            html += buildGap("TERTIARY", tertiaryGap);

            root.innerHTML = html;
        });
    </script>
</body>
</html>
