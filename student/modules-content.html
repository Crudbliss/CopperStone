    <script>
        const quadrantConfig = {
            "Hierarchical Individual": { id: "hi", short: "HI", colorName: "hi", title: "Hierarchical Individual" },
            "Distributed Individual": { id: "di", short: "DI", colorName: "di", title: "Distributed Individual" },
            "Hierarchical Collective": { id: "hc", short: "HC", colorName: "hc", title: "Hierarchical Collective" },
            "Distributed Collective": { id: "dc", short: "DC", colorName: "dc", title: "Distributed Collective" }
        };

        const modeOpposites = {
            "Hierarchical Individual": "Distributed Collective",
            "Distributed Collective": "Hierarchical Individual",
            "Distributed Individual": "Hierarchical Collective",
            "Hierarchical Collective": "Distributed Individual"
        };

        let currentActiveModule = null;
        let currentStepId = null; // e.g. "chapter_1" or "kc_1" or "final_assessment"
        let currentStepType = 'chapter'; // 'chapter' or 'kc'
        let currentChapterIndex = 0;
        let currentKCQuestionIndex = 0;
        let studentQuizAnswers = {};
        let quizGradedResults = null;
        let currentActiveQuestions = [];
        let currentStudentId = null;
        let currentStudentName = "Student";
        let currentStudentFirstName = "Student";

        document.addEventListener('DOMContentLoaded', async () => {
            await loadStudentModules();
            const urlParams = new URLSearchParams(window.location.search);
            let targetModuleId = urlParams.get('moduleId') || urlParams.get('module');
            if (!targetModuleId) {
                const prev = urlParams.get('preview');
                if (prev && prev !== 'true' && !isNaN(parseInt(prev))) {
                    targetModuleId = prev;
                }
            }
            if (targetModuleId && !isNaN(parseInt(targetModuleId))) {
                launchModuleReader(parseInt(targetModuleId));
            }
        });

        /* --- PROGRESS TRACKING ENGINE (PER MODULE) --- */
        function getStudentProgress(moduleId) {
            let data = null;
            try {
                const stored = localStorage.getItem(`student_mod_prog_v2_${currentStudentId}_${moduleId}`)
                            || localStorage.getItem(`student_mod_prog_${currentStudentId}_${moduleId}`);
                if (stored) data = JSON.parse(stored);
            } catch(e) {}

            if (!data || typeof data !== 'object') data = {};
            if (!Array.isArray(data.unlockedChapters)) data.unlockedChapters = [0];
            if (!Array.isArray(data.unlockedKCs)) data.unlockedKCs = [];
            if (!Array.isArray(data.completedKCs)) data.completedKCs = [];
            if (!Array.isArray(data.completedChapters)) data.completedChapters = [];
            return data;
        }

        function saveStudentProgress(moduleId, progressData) {
            try {
                localStorage.setItem(`student_mod_prog_v2_${currentStudentId}_${moduleId}`, JSON.stringify(progressData));
                localStorage.setItem(`student_mod_prog_${currentStudentId}_${moduleId}`, JSON.stringify(progressData));
            } catch(e) {}
        }

        /* --- LOAD MODULES OVERVIEW --- */
        async function loadStudentModules() {
            const root = document.getElementById('view-overview');
            
            let currentUser = null;
            try {
                const userStr = localStorage.getItem('currentUser');
                if (userStr) currentUser = JSON.parse(userStr);
            } catch(e) {}

            currentStudentId = currentUser ? currentUser.id : 1;
            currentStudentName = currentUser ? (currentUser.name || currentUser.first_name || 'Student') : 'Student';
            currentStudentFirstName = currentUser ? (currentUser.first_name || currentStudentName.split(' ')[0]) : 'Student';

            let studentProfile = null;
            try {
                const profileStr = localStorage.getItem('studentProfile');
                if (profileStr) studentProfile = JSON.parse(profileStr);
            } catch(e) {}

            if (currentUser && currentUser.id) {
                try {
                    const sRes = await fetch(`/api/students/${currentUser.id}`);
                    if (sRes.ok) {
                        const sData = await sRes.json();
                        if (sData) {
                            studentProfile = sData;
                            if (sData.first_name) currentStudentFirstName = sData.first_name;
                            localStorage.setItem('studentProfile', JSON.stringify(sData));
                        }
                    }
                } catch(e) {}
            }

            let domModeName = (studentProfile && studentProfile.learning_mode && studentProfile.learning_mode !== 'Unknown') 
                ? studentProfile.learning_mode 
                : "Hierarchical Individual";

            let weakestModeName = (studentProfile && studentProfile.weakest_learning_mode && studentProfile.weakest_learning_mode !== 'Unknown')
                ? studentProfile.weakest_learning_mode
                : modeOpposites[domModeName] || "Distributed Collective";

            const weakestConfig = quadrantConfig[weakestModeName] || quadrantConfig["Distributed Collective"];

            try {
                const res = await fetch('/api/modules');
                const allModules = await res.json();

                // Exclusively show the quadrant modules they are weak at
                const weakestModules = allModules.filter(m => m.quadrant_category === weakestModeName);

                let html = `
                    <div class="page-header">
                        <h1 class="page-title">My Modules</h1>
                        <p class="page-subtitle">Weakness-first routing: your lowest-scoring quadrant module is unlocked and shown first.</p>
                        
                        <div class="adaptive-banner">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                            </svg>
                            <span>
                                <strong>Adaptive Routing Active:</strong> Modules targeting your weakest quadrant (${weakestConfig.short}) are automatically prioritized.
                            </span>
                        </div>
                    </div>
                `;

                if (weakestModules.length > 0) {
                    html += `
                        <div class="modules-list">
                            ${weakestModules.map((m, idx) => renderHorizontalModuleCard(m, idx, weakestConfig)).join('')}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="empty-state-box">
                            <div style="color: var(--text-muted); margin-bottom: 4px;">
                                <svg width="36" height="36"><use href="#icon-book"></use></svg>
                            </div>
                            <h3 style="font-size: 18px; font-weight: 700; color: #fff;">No Modules Available Yet for ${weakestConfig.title}</h3>
                            <p style="font-size: 13px; color: var(--text-muted); max-width: 480px; line-height: 1.5;">Your learning coach has routed your focus to <strong>${weakestConfig.title} (${weakestConfig.short})</strong>. Modules tailored for this dimension will appear here soon.</p>
                        </div>
                    `;
                }

                root.innerHTML = html;

            } catch (err) {
                console.error("Failed to load student modules:", err);
                root.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 40px;">Error loading modules. Please try again later.</div>';
            }
        }

        function renderHorizontalModuleCard(m, index, config) {
            const indexStr = (index + 1).toString().padStart(2, '0');
            const chapters = m.chapters || [];
            const chapterCount = chapters.length;
            const questionCount = parseInt(m.question_count) || 0;
            const progress = getStudentProgress(m.id);
            
            // Calculate percentage accurately
            let pct = 0;
            if (progress.moduleCompleted || progress.completedFinal) {
                pct = 100;
            } else if (questionCount === 0) {
                // Reading-only module (no quizzes)
                pct = chapterCount > 0 ? Math.min(100, Math.round((progress.completedChapters.length / chapterCount) * 100)) : (progress.completedChapters.length > 0 ? 100 : 0);
            } else {
                // Modules with chapters, knowledge checks, and final assessment
                const totalSteps = (chapterCount * 2) + 1;
                const completedSteps = progress.completedChapters.length + progress.completedKCs.length + (progress.completedFinal ? 1 : 0);
                pct = totalSteps > 0 ? Math.min(100, Math.round((completedSteps / totalSteps) * 100)) : 0;
            }

            if (pct >= 100) pct = 100;

            // Current active chapter label
            let currentChapterTitle = 'Introduction';
            if (chapters.length > 0) {
                const nextChapterIdx = Math.min(progress.completedKCs.length, chapters.length - 1);
                currentChapterTitle = chapters[nextChapterIdx].title;
            }

            const totalDots = Math.max(chapterCount, 4);
            let dotsHtml = '';
            for (let i = 0; i < totalDots; i++) {
                const isDotActive = i <= progress.completedKCs.length;
                dotsHtml += `<div class="step-dot ${isDotActive ? 'active-' + config.colorName : ''}"></div>`;
            }

            const isRecommended = index === 0;

            return `
                <div class="module-card-horizontal" onclick="launchModuleReader(${m.id})">
                    <div class="card-header-row">
                        <div class="card-left-group">
                            <div class="module-index-badge badge-${config.colorName}">
                                ${indexStr}
                            </div>
                            <div class="module-info">
                                <div class="module-title-row">
                                    <span class="module-title-text">Module ${index + 1}: ${escapeHtml(m.title)}</span>
                                    ${isRecommended ? `<span class="pill-recommended ${config.colorName}">★ Recommended</span>` : ''}
                                </div>
                                <p class="module-description-text">${escapeHtml(m.description || `Develop your ${config.title} skills through peer-driven inquiry, co-creation, and shared leadership activities.`)}</p>
                                <div class="module-meta-info">
                                    <span><svg width="13" height="13" style="vertical-align: middle; margin-right: 2px;"><use href="#icon-book"></use></svg> ${chapterCount} chapters</span>
                                    <span><svg width="13" height="13" style="vertical-align: middle; margin-right: 2px; color: var(--matrix-green);"><use href="#icon-check"></use></svg> ${progress.completedChapters.length} completed</span>
                                    <span><svg width="13" height="13" style="vertical-align: middle; margin-right: 2px;"><use href="#icon-clock"></use></svg> ${m.estimated_time || '30 min'}</span>
                                    ${chapterCount > 0 ? `<span><svg width="11" height="11" style="vertical-align: middle; margin-right: 2px; color: #38bdf8;"><use href="#icon-play"></use></svg> Current: <strong class="current-chapter-highlight">${escapeHtml(currentChapterTitle)}</strong></span>` : ''}
                                </div>
                            </div>
                        </div>

                        <div class="card-right-group">
                            <div class="pct-large">${pct}%</div>
                            <div class="pct-label">complete</div>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-labels">
                            <span>Progress</span>
                            <span>${progress.completedChapters.length}/${chapterCount} chapters</span>
                        </div>
                        <div class="progress-track-bar">
                            <div class="progress-fill-bar fill-${config.colorName}" style="width: ${pct}%;"></div>
                        </div>
                    </div>

                    <div class="card-action-row">
                        <div class="step-dots">
                            ${dotsHtml}
                        </div>
                        <button class="btn-continue btn-${config.colorName}" onclick="event.stopPropagation(); launchModuleReader(${m.id});">
                            Continue &gt;
                        </button>
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           FULL-SCREEN READER CONTROLLER
           ========================================================================== */
        async function launchModuleReader(moduleId) {
            const numId = parseInt(moduleId);
            if (!numId || isNaN(numId)) {
                console.warn("Invalid moduleId for launchModuleReader:", moduleId);
                return;
            }

            try {
                const res = await fetch(`/api/modules/${numId}`);
                if (!res.ok) throw new Error("Failed to load module");
                currentActiveModule = await res.json();

                // Switch UI views
                document.getElementById('view-overview').style.display = 'none';
                document.getElementById('view-reader').style.display = 'grid';

                // Populate Sidebar Header
                document.getElementById('sidebar-mod-badge').textContent = '1';
                document.getElementById('sidebar-mod-title').textContent = currentActiveModule.title;

                // Find initial step (first unlocked incomplete chapter)
                const progress = getStudentProgress(currentActiveModule.id);
                const chapters = currentActiveModule.chapters || [];
                
                let targetChapterIdx = 0;
                for (let i = 0; i < chapters.length; i++) {
                    if (!progress.completedKCs.includes(i)) {
                        targetChapterIdx = i;
                        break;
                    }
                }

                currentChapterIndex = targetChapterIdx;
                currentStepId = `chapter_${targetChapterIdx}`;
                currentStepType = 'chapter';
                studentQuizAnswers = {};
                quizGradedResults = null;

                renderReaderStepper();
                renderCurrentReaderContent();

            } catch(e) {
                console.error("Error launching module reader:", e);
                alert("Failed to load module content.");
            }
        }

        function exitReaderView() {
            document.getElementById('view-reader').style.display = 'none';
            document.getElementById('view-overview').style.display = 'flex';
            loadStudentModules(); // Refresh cards with updated progress
        }

        /* --- STEPPER RENDERER --- */
        function renderReaderStepper() {
            const container = document.getElementById('reader-stepper-list');
            if (!container || !currentActiveModule) return;
            const chapters = currentActiveModule.chapters || [];
            const allModuleQuestions = currentActiveModule.questions || [];
            const progress = getStudentProgress(currentActiveModule.id);

            // Compute total steps dynamically
            let totalSteps = chapters.length;
            chapters.forEach(ch => {
                const qCount = allModuleQuestions.filter(q => q.chapter_id == ch.id).length;
                if (qCount > 0) totalSteps += 1;
            });
            if (allModuleQuestions.length > 0) totalSteps += 1; // Final Assessment

            const completedSteps = progress.completedChapters.length + progress.completedKCs.length + (progress.completedFinal ? 1 : 0);
            const pct = totalSteps > 0 ? Math.min(100, Math.round((completedSteps / totalSteps) * 100)) : (progress.moduleCompleted ? 100 : 0);
            
            document.getElementById('sidebar-mod-pct').textContent = `${pct}%`;
            document.getElementById('sidebar-mod-fill').style.width = `${pct}%`;

            let html = '';

            chapters.forEach((ch, idx) => {
                const isChapterUnlocked = progress.unlockedChapters.includes(idx);
                const isChapterCompleted = progress.completedChapters.includes(idx);
                const isChapterActive = currentStepId === `chapter_${idx}`;
                const chQuestions = allModuleQuestions.filter(q => q.chapter_id == ch.id);

                const chapterIconHtml = !isChapterUnlocked 
                    ? `<svg width="14" height="14"><use href="#icon-lock"></use></svg>` 
                    : (isChapterCompleted 
                        ? `<svg width="14" height="14" style="color: var(--matrix-green);"><use href="#icon-check"></use></svg>` 
                        : `<svg width="14" height="14"><use href="#icon-book"></use></svg>`);

                if (idx > 0) {
                    html += `<div class="stepper-connector"></div>`;
                }

                // Chapter Item
                html += `
                    <div class="step-item ${isChapterActive ? 'active' : ''} ${!isChapterUnlocked ? 'locked' : ''} ${isChapterCompleted ? 'completed' : ''}" 
                         onclick="${isChapterUnlocked ? `selectStep('chapter', ${idx})` : ''}">
                        <div class="step-left">
                            <span class="step-icon">${chapterIconHtml}</span>
                            <div class="step-text-wrap">
                                <span class="step-title-text">${escapeHtml(ch.title)}</span>
                            </div>
                        </div>
                        <div class="step-dot-indicator"></div>
                    </div>
                `;

                // Only render Knowledge Check step if this chapter actually has questions!
                if (chQuestions.length > 0) {
                    html += `<div class="stepper-connector"></div>`;

                    const isKCUnlocked = progress.unlockedKCs.includes(idx) || isChapterCompleted;
                    const isKCCompleted = progress.completedKCs.includes(idx);
                    const isKCActive = currentStepId === `kc_${idx}`;

                    const kcIconHtml = !isKCUnlocked 
                        ? `<svg width="14" height="14"><use href="#icon-lock"></use></svg>` 
                        : (isKCCompleted 
                            ? `<svg width="14" height="14" style="color: var(--matrix-green);"><use href="#icon-check"></use></svg>` 
                            : (isKCActive 
                                ? `<svg width="14" height="14" style="color: var(--matrix-purple);"><use href="#icon-play"></use></svg>`
                                : `<svg width="14" height="14"><use href="#icon-clipboard"></use></svg>`));

                    html += `
                        <div class="step-item sub-item ${isKCActive ? 'active' : ''} ${!isKCUnlocked ? 'locked' : ''} ${isKCCompleted ? 'completed' : ''}"
                             onclick="${isKCUnlocked ? `selectStep('kc', ${idx})` : ''}">
                            <div class="step-left">
                                <span class="step-icon">${kcIconHtml}</span>
                                <div class="step-text-wrap">
                                    <span class="step-title-text">Knowledge Check ${idx + 1}</span>
                                    <span class="step-sub-text">Knowledge Check</span>
                                </div>
                            </div>
                            <div class="step-dot-indicator"></div>
                        </div>
                    `;
                }
            });

            // Final Assessment Item ONLY if module has questions
            if (allModuleQuestions.length > 0) {
                const chaptersWithKCs = chapters.filter(c => allModuleQuestions.some(q => q.chapter_id == c.id));
                const allKCsCompleted = chaptersWithKCs.every(c => progress.completedKCs.includes(chapters.indexOf(c)));
                const isFinalActive = currentStepId === 'final_assessment';
                const isFinalCompleted = progress.completedFinal;

                const finalIconHtml = !allKCsCompleted 
                    ? `<svg width="14" height="14"><use href="#icon-lock"></use></svg>` 
                    : (isFinalCompleted 
                        ? `<svg width="14" height="14" style="color: var(--matrix-green);"><use href="#icon-check"></use></svg>` 
                        : (isFinalActive 
                            ? `<svg width="14" height="14" style="color: var(--matrix-purple);"><use href="#icon-target"></use></svg>`
                            : `<svg width="14" height="14"><use href="#icon-target"></use></svg>`));

                html += `
                    <div class="stepper-connector"></div>
                    <div class="step-item sub-item ${isFinalActive ? 'active' : ''} ${!allKCsCompleted ? 'locked' : ''} ${isFinalCompleted ? 'completed' : ''}"
                         onclick="${allKCsCompleted ? `selectStep('final', 0)` : ''}">
                        <div class="step-left">
                            <span class="step-icon">${finalIconHtml}</span>
                            <div class="step-text-wrap">
                                <span class="step-title-text">Final Assessment</span>
                                <span class="step-sub-text">Final Assessment</span>
                            </div>
                        </div>
                        <div class="step-dot-indicator"></div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function selectStep(type, index) {
            currentStepType = type;
            currentChapterIndex = index;
            currentStepId = type === 'final' ? 'final_assessment' : `${type}_${index}`;
            currentKCQuestionIndex = 0;
            studentQuizAnswers = {};
            quizGradedResults = null;

            renderReaderStepper();
            renderCurrentReaderContent();

            // Scroll top of content pane
            const scrollPane = document.getElementById('reader-scroll-container');
            if (scrollPane) scrollPane.scrollTop = 0;
        }

        /* --- CONTENT RENDERER (CHAPTER vs KNOWLEDGE CHECK) --- */
        function renderCurrentReaderContent() {
            const body = document.getElementById('reader-content-body');
            const bottomBar = document.getElementById('bottom-action-bar');
            const chapters = currentActiveModule.chapters || [];

            if (currentStepType === 'chapter') {
                const ch = chapters[currentChapterIndex];
                if (!ch) {
                    body.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">No chapter content available.</div>';
                    bottomBar.style.display = 'none';
                    return;
                }

                const quadName = currentActiveModule.quadrant_category || 'Distributed Collective';
                const quadShort = quadName === 'Distributed Collective' ? 'DC' : (quadName === 'Hierarchical Individual' ? 'HI' : (quadName === 'Distributed Individual' ? 'DI' : 'HC'));

                let html = `
                    <!-- 1. Header Card (Screenshot 1) -->
                    <div class="reader-header-card">
                        <div class="reader-header-top">
                            <span class="reader-quadrant-tag">${quadShort} &middot; ${escapeHtml(quadName)}</span>
                            <span class="reader-time-tag">
                                <svg width="12" height="12" style="vertical-align: middle; margin-right: 2px;"><use href="#icon-clock"></use></svg>
                                ${escapeHtml(ch.estimated_time || '45 min')}
                            </span>
                        </div>
                        <h1 class="reader-chapter-title">${escapeHtml(ch.title)}</h1>
                    </div>
                `;

                // Dynamic Content Blocks Rendering in exact sequence
                let blocks = ch.content_blocks;
                if (!blocks || !Array.isArray(blocks) || blocks.length === 0) {
                    // Fallback to legacy structure if content_blocks is not defined
                    blocks = [];
                    if (ch.learning_objectives) {
                        const objs = parseListItems(ch.learning_objectives, []);
                        if (objs.length) blocks.push({ type: 'card', title: 'LEARNING OBJECTIVES', items: objs });
                    }
                    if (ch.text_content && ch.text_content.trim()) {
                        blocks.push({ type: 'text', content: ch.text_content.trim() });
                    }
                    if (ch.youtube_url && ch.youtube_url.trim()) {
                        blocks.push({ type: 'video', url: ch.youtube_url.trim() });
                    }
                    if (ch.pdf_url && ch.pdf_url.trim()) {
                        blocks.push({ type: 'pdf', url: ch.pdf_url.trim(), title: 'Reference Material (PDF)' });
                    }
                    if (ch.examples) {
                        const exs = parseListItems(ch.examples, []);
                        if (exs.length) blocks.push({ type: 'card', title: 'EXAMPLES & PRACTICAL APPLICATIONS', items: exs });
                    }
                }

                // Render each block sequentially
                blocks.forEach(block => {
                    if (block.type === 'card') {
                        const items = Array.isArray(block.items) ? block.items : parseListItems(block.items, []);
                        if (items.length > 0) {
                            html += `
                                <div class="content-block-card">
                                    <div class="content-block-title">${escapeHtml(block.title || 'KEY POINTS')}</div>
                                    <div style="display: flex; flex-direction: column; gap: 12px;">
                                        ${items.map((it, i) => `
                                            <div class="objective-item">
                                                <span class="num-circle">${i + 1}</span>
                                                <span>${escapeHtml(it)}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }
                    } else if (block.type === 'text') {
                        if (block.content && block.content.trim()) {
                            const paragraphs = block.content.split(/\n\s*\n/).filter(p => p.trim() !== '');
                            const formattedHtml = paragraphs.map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
                            html += `<div class="article-body-text">${formattedHtml}</div>`;
                        }
                    } else if (block.type === 'video') {
                        if (block.url && block.url.trim()) {
                            const embedUrl = formatYoutubeEmbedUrl(block.url);
                            if (embedUrl) {
                                html += `
                                    <div class="video-container">
                                        <iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                                    </div>
                                `;
                            }
                        }
                    } else if (block.type === 'pdf') {
                        if (block.url && block.url.trim()) {
                            html += `
                                <div>
                                    <div style="font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                                        <svg width="14" height="14" style="color: var(--matrix-blue);"><use href="#icon-book"></use></svg> ${escapeHtml(block.title || 'Reference Material (PDF)')}
                                    </div>
                                    <iframe src="${escapeHtml(block.url)}" class="pdf-viewer-frame"></iframe>
                                </div>
                            `;
                        }
                    }
                });

                body.innerHTML = html;
                bottomBar.style.display = 'flex';

                // Check initial unlock status and auto-unlock if content is short/fits on screen
                updateUnlockStatus();
                checkAutoUnlockIfShort();

            } else if (currentStepType === 'kc' || currentStepType === 'final') {
                bottomBar.style.display = 'none';
                renderKnowledgeCheckContent();
            }
        }

        function checkAutoUnlockIfShort() {
            setTimeout(() => {
                const container = document.getElementById('reader-scroll-container');
                if (!container || currentStepType !== 'chapter') return;
                if (container.scrollHeight <= container.clientHeight + 60) {
                    markChapterScrolled();
                }
            }, 80);
        }

        function parseListItems(raw, fallback) {
            if (!raw || raw.trim() === '') return fallback;
            const items = raw.split(/\r?\n/).map(s => s.replace(/^\d+[\.\)]\s*|^[-*]\s*/, '').trim()).filter(Boolean);
            return items.length > 0 ? items : fallback;
        }

        /* --- SCROLL-TO-UNLOCK LOGIC --- */
        function handleChapterScroll() {
            if (currentStepType !== 'chapter') return;
            const container = document.getElementById('reader-scroll-container');
            if (!container) return;

            const scrollPos = container.scrollTop + container.clientHeight;
            const scrollHeight = container.scrollHeight;

            // When scrolled near bottom (within 80px) or if content fits on screen
            if (scrollPos >= scrollHeight - 80 || scrollHeight <= container.clientHeight + 60) {
                markChapterScrolled();
            }
        }

        function markChapterScrolled() {
            const progress = getStudentProgress(currentActiveModule.id);
            const chapters = currentActiveModule.chapters || [];
            const allModuleQuestions = currentActiveModule.questions || [];
            const ch = chapters[currentChapterIndex];
            const chQuestions = ch ? allModuleQuestions.filter(q => q.chapter_id == ch.id) : [];

            let updated = false;

            if (!progress.completedChapters.includes(currentChapterIndex)) {
                progress.completedChapters.push(currentChapterIndex);
                updated = true;
            }

            if (chQuestions.length > 0) {
                if (!progress.unlockedKCs.includes(currentChapterIndex)) {
                    progress.unlockedKCs.push(currentChapterIndex);
                    updated = true;
                }
            } else {
                // Chapter has no KC questions! Unlock next chapter or complete module!
                const nextChapterIdx = currentChapterIndex + 1;
                if (nextChapterIdx < chapters.length) {
                    if (!progress.unlockedChapters.includes(nextChapterIdx)) {
                        progress.unlockedChapters.push(nextChapterIdx);
                        updated = true;
                    }
                } else if (allModuleQuestions.length === 0) {
                    // Last chapter and 0 questions in whole module -> Module is completed!
                    progress.completedFinal = true;
                    progress.moduleCompleted = true;
                    updated = true;
                }
            }

            if (updated) {
                saveStudentProgress(currentActiveModule.id, progress);
                renderReaderStepper();
            }

            updateUnlockStatus();
        }

        function updateUnlockStatus() {
            const progress = getStudentProgress(currentActiveModule.id);
            const chapters = currentActiveModule.chapters || [];
            const allModuleQuestions = currentActiveModule.questions || [];
            const ch = chapters[currentChapterIndex];
            const chQuestions = ch ? allModuleQuestions.filter(q => q.chapter_id == ch.id) : [];
            const isRead = progress.completedChapters.includes(currentChapterIndex);

            const statusMsg = document.getElementById('unlock-status-msg');
            const btnOpen = document.getElementById('btn-open-kc');
            if (!statusMsg || !btnOpen) return;

            if (chQuestions.length > 0) {
                const isUnlocked = progress.unlockedKCs.includes(currentChapterIndex);
                if (isUnlocked) {
                    statusMsg.className = 'unlock-status-text unlocked';
                    statusMsg.innerHTML = '<span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="13" height="13" style="color: var(--matrix-green);"><use href="#icon-check"></use></svg> Chapter Complete! Knowledge Check is now unlocked &rarr;</span>';
                    btnOpen.disabled = false;
                    btnOpen.innerHTML = 'Open KC &rarr;';
                    btnOpen.onclick = handleOpenCurrentKC;
                } else {
                    statusMsg.className = 'unlock-status-text locked';
                    statusMsg.innerHTML = `<span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="13" height="13"><use href="#icon-lock"></use></svg> Scroll through the entire chapter to unlock Knowledge Check ${currentChapterIndex + 1}</span>`;
                    btnOpen.disabled = true;
                    btnOpen.innerHTML = 'Open KC &rarr;';
                }
            } else {
                // No KC questions for this chapter
                const nextChapterIdx = currentChapterIndex + 1;
                if (isRead) {
                    statusMsg.className = 'unlock-status-text unlocked';
                    statusMsg.innerHTML = '<span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="13" height="13" style="color: var(--matrix-green);"><use href="#icon-check"></use></svg> Chapter Read &amp; Complete!</span>';
                    btnOpen.disabled = false;

                    if (nextChapterIdx < chapters.length) {
                        btnOpen.innerHTML = 'Next Chapter &rarr;';
                        btnOpen.onclick = () => selectStep('chapter', nextChapterIdx);
                    } else if (allModuleQuestions.length > 0) {
                        btnOpen.innerHTML = 'Final Assessment &rarr;';
                        btnOpen.onclick = () => selectStep('final', 0);
                    } else {
                        btnOpen.innerHTML = 'Complete Module &check;';
                        btnOpen.onclick = () => {
                            const prog = getStudentProgress(currentActiveModule.id);
                            prog.moduleCompleted = true;
                            prog.completedFinal = true;
                            if (!prog.completedChapters.includes(currentChapterIndex)) {
                                prog.completedChapters.push(currentChapterIndex);
                            }
                            saveStudentProgress(currentActiveModule.id, prog);
                            renderReaderStepper();
                            showVictoryModal();
                        };
                    }
                } else {
                    statusMsg.className = 'unlock-status-text locked';
                    statusMsg.innerHTML = `<span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="13" height="13"><use href="#icon-lock"></use></svg> Read through the chapter to complete</span>`;
                    btnOpen.disabled = true;
                    btnOpen.innerHTML = nextChapterIdx < chapters.length ? 'Next Chapter &rarr;' : 'Complete Module &check;';
                }
            }
        }

        function handleOpenCurrentKC() {
            selectStep('kc', currentChapterIndex);
        }

        /* --- KNOWLEDGE CHECK QUIZ RENDERER (Screenshot 2) --- */
        function renderKnowledgeCheckContent() {
            const body = document.getElementById('reader-content-body');
            const chapters = currentActiveModule.chapters || [];
            const ch = chapters[currentChapterIndex];

            // Get questions for this chapter (or final questions)
            let questions = [];
            if (currentStepType === 'kc' && ch) {
                questions = ch.questions && ch.questions.length > 0 
                    ? ch.questions 
                    : (currentActiveModule.questions || []).filter(q => q.chapter_id == ch.id);
            } else if (currentStepType === 'final') {
                // Compile EVERY question from the whole module for the comprehensive Final Assessment!
                questions = (currentActiveModule.questions && currentActiveModule.questions.length > 0)
                    ? currentActiveModule.questions
                    : (currentActiveModule.final_questions || []);
            }

            if (questions.length === 0) {
                body.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: rgba(0,0,0,0.18); border-radius: 14px; border: 1px dashed rgba(255,255,255,0.15); max-width: 600px; margin: 40px auto;">
                        <div style="font-size: 36px; margin-bottom: 12px;">📝</div>
                        <h3 style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px;">No Knowledge Check Questions</h3>
                        <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px;">
                            This section does not have quiz questions assigned. You may continue to the next section.
                        </p>
                        <button type="button" class="btn-primary" style="padding: 10px 24px; font-weight: 700;" onclick="handleVictoryContinue()">Continue &rarr;</button>
                    </div>
                `;
                return;
            }

            currentActiveQuestions = questions;

            // Ensure valid question index
            if (currentKCQuestionIndex >= questions.length) currentKCQuestionIndex = 0;
            const q = questions[currentKCQuestionIndex];
            if (!q) return;

            const kcTitle = currentStepType === 'final' ? 'Final Module Assessment' : `Knowledge Check ${currentChapterIndex + 1}`;
            const subtitleText = currentStepType === 'final'
                ? `${questions.length} questions · Comprehensive Final Assessment for ${escapeHtml(currentActiveModule.title)}`
                : `${questions.length} questions · ${escapeHtml(ch ? ch.title : currentActiveModule.title)}`;
            const isGraded = quizGradedResults !== null;

            // Answer status check for carousel navigation
            const isCurrentAnswered = isQuestionAnswered(q);
            const allAnswered = questions.every(item => isQuestionAnswered(item));

            const pct = Math.round(((currentKCQuestionIndex + 1) / questions.length) * 100);

            // Step dots HTML
            let dotsHtml = '';
            questions.forEach((item, dIdx) => {
                let dotClass = 'kc-step-dot';
                if (dIdx === currentKCQuestionIndex) dotClass += ' active';
                if (isGraded) {
                    const gr = (quizGradedResults.results || []).find(r => r.question_id === item.id);
                    if (gr && gr.is_correct) dotClass += ' correct';
                    else if (gr) dotClass += ' wrong';
                } else if (isQuestionAnswered(item)) {
                    dotClass += ' answered';
                }
                dotsHtml += `<div class="${dotClass}" onclick="handleKCJmp(${dIdx})" title="Question ${dIdx + 1}"></div>`;
            });

            let html = `
                <!-- KC Header Card -->
                <div class="kc-header-card" style="flex-direction: column; align-items: stretch; gap: 14px;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <div class="kc-icon-box" style="display: flex; align-items: center; justify-content: center;">
                                <svg width="22" height="22" style="color: var(--matrix-purple);"><use href="#icon-clipboard"></use></svg>
                            </div>
                            <div class="kc-title-block">
                                <h2 class="kc-title">${kcTitle}</h2>
                                <div class="kc-subtitle">${subtitleText}</div>
                            </div>
                        </div>
                        <div style="background: rgba(192, 132, 252, 0.12); color: var(--matrix-purple); font-weight: 700; font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(192, 132, 252, 0.3);">
                            Question ${currentKCQuestionIndex + 1} of ${questions.length}
                        </div>
                    </div>
                    <div class="kc-progress-bar-wrap">
                        <div class="kc-progress-bar-fill" style="width: ${pct}%;"></div>
                    </div>
                </div>
            `;

            // Graded summary banner if graded
            if (isGraded) {
                if (quizGradedResults.passed) {
                    html += `
                        <div class="mastery-banner perfect" style="margin-bottom: 8px;">
                            <div style="font-size: 16px; font-weight: 700; color: #4ade80; display: flex; align-items: center; gap: 8px;">
                                <svg width="22" height="22"><use href="#icon-award"></use></svg>
                                100% Perfect Mastery! (${quizGradedResults.score} / ${quizGradedResults.total})
                            </div>
                            <p style="font-size: 13.5px; color: #cbd5e1;">
                                Outstanding job! You have perfected this Knowledge Check. You can review your answers below or proceed.
                            </p>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="mastery-banner" style="margin-bottom: 8px;">
                            <div style="font-size: 15.5px; font-weight: 700; color: #fb923c; display: flex; align-items: center; gap: 8px;">
                                <svg width="18" height="18"><use href="#icon-lock"></use></svg>
                                Mastery Required (${quizGradedResults.score} / ${quizGradedResults.total} Correct &middot; ${quizGradedResults.percentage}%)
                            </div>
                            <p style="font-size: 13px; color: #cbd5e1; max-width: 540px; line-height: 1.55;">
                                You must achieve a <strong>perfect 100% score</strong> to unlock the next chapter. Review the explanation slides below and try again!
                            </p>
                        </div>
                    `;
                }
            }

            // Render Current Question Card (Slide)
            const letters = ['A', 'B', 'C', 'D', 'E'];
            const savedAns = studentQuizAnswers[q.id];
            const gradeInfo = isGraded ? (quizGradedResults.results || []).find(r => r.question_id === q.id) : null;
            const correctAns = gradeInfo ? gradeInfo.correct_answer : q.correct_answer;

            html += `
                <div class="question-card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="question-num-tag">QUESTION ${currentKCQuestionIndex + 1} OF ${questions.length}</div>
                        <div class="kc-step-dots">${dotsHtml}</div>
                    </div>
                    <div class="question-text-title">${escapeHtml(q.question_text)}</div>
                    <div class="options-list">
            `;

            if (q.question_type === 'true_false') {
                ['True', 'False'].forEach((opt, optIdx) => {
                    let optClass = 'option-choice-btn';
                    const isThisCorrect = isGraded && (String(correctAns).toLowerCase() === opt.toLowerCase());
                    const isThisUserSelection = savedAns === opt;

                    if (isGraded) {
                        if (isThisCorrect) {
                            optClass += ' correct';
                        } else if (isThisUserSelection) {
                            optClass += ' wrong';
                        } else {
                            optClass += ' dimmed';
                        }
                    } else if (isThisUserSelection) {
                        optClass += ' selected';
                    }

                    html += `
                        <button class="${optClass}" onclick="handleSelectOptionByIndex(${q.id}, ${optIdx})" ${isGraded ? 'disabled' : ''}>
                            <div style="display: flex; align-items: center; gap: 14px;">
                                <span class="opt-letter-circle">${opt[0]}</span>
                                <span>${opt}</span>
                            </div>
                            ${isThisCorrect ? `<svg width="18" height="18" style="color: #10b981; flex-shrink: 0;"><use href="#icon-check-circle"></use></svg>` : ''}
                        </button>
                    `;
                });
            } else if (q.question_type === 'multiple_choice') {
                (q.options || []).forEach((opt, optIdx) => {
                    let optClass = 'option-choice-btn';
                    const isThisCorrect = isGraded && (String(correctAns).trim() === String(opt).trim());
                    const isThisUserSelection = savedAns === opt;

                    if (isGraded) {
                        if (isThisCorrect) {
                            optClass += ' correct';
                        } else if (isThisUserSelection) {
                            optClass += ' wrong';
                        } else {
                            optClass += ' dimmed';
                        }
                    } else if (isThisUserSelection) {
                        optClass += ' selected';
                    }

                    html += `
                        <button class="${optClass}" onclick="handleSelectOptionByIndex(${q.id}, ${optIdx})" ${isGraded ? 'disabled' : ''}>
                            <div style="display: flex; align-items: center; gap: 14px;">
                                <span class="opt-letter-circle">${letters[optIdx] || optIdx + 1}</span>
                                <span>${escapeHtml(opt)}</span>
                            </div>
                            ${isThisCorrect ? `<svg width="18" height="18" style="color: #10b981; flex-shrink: 0;"><use href="#icon-check-circle"></use></svg>` : ''}
                        </button>
                    `;
                });
            } else if (q.question_type === 'matching') {
                const pairs = Array.isArray(q.options) ? q.options : [];
                const matchAnswers = (typeof savedAns === 'object' && savedAns !== null) ? savedAns : {};
                const targetOptions = pairs.map(p => p.match || p.right || '');

                pairs.forEach((pair, pairIdx) => {
                    const term = pair.term || pair.left || '';
                    const currentVal = matchAnswers[term] || '';
                    const expectedMatch = (correctAns && typeof correctAns === 'object') ? (correctAns[term] || pair.match || pair.right || '') : (pair.match || pair.right || '');
                    const isPairCorrect = isGraded && (String(currentVal).trim() === String(expectedMatch).trim());
                    const isPairWrong = isGraded && !isPairCorrect;

                    let rowClass = 'match-pair-row';
                    if (isGraded) {
                        rowClass += isPairCorrect ? ' correct' : ' wrong';
                    }

                    html += `
                        <div class="${rowClass}">
                            <div class="match-term-box">${escapeHtml(term)}</div>
                            <div class="match-arrow">➔</div>
                    `;

                    if (!isGraded) {
                        html += `
                            <select class="match-select" onchange="handleSelectMatchByIndex(${q.id}, ${pairIdx}, this.value)">
                                <option value="" style="color: #6b7280;">Select matching answer...</option>
                                ${targetOptions.map(t => `<option value="${escapeHtml(t)}" ${currentVal === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
                            </select>
                        `;
                    } else {
                        // Graded View: Show clear color-coded pill with student choice & correct answer
                        html += `
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <div class="match-result-pill ${isPairCorrect ? 'correct' : 'wrong'}">
                                    <span>${isPairCorrect ? '✓' : '✗'} ${escapeHtml(currentVal || '(No Answer)')}</span>
                                    ${isPairCorrect ? '<span style="font-size: 11px; font-weight: 700; opacity: 0.9; text-transform: uppercase;">Correct</span>' : '<span style="font-size: 11px; font-weight: 700; opacity: 0.9; text-transform: uppercase;">Incorrect</span>'}
                                </div>
                                ${isPairWrong ? `<div class="match-correct-hint"><span>✓ Correct:</span> <strong>${escapeHtml(expectedMatch)}</strong></div>` : ''}
                            </div>
                        `;
                    }

                    html += `</div>`;
                });
            }

            if (isGraded) {
                const explText = (gradeInfo && gradeInfo.explanation) ? gradeInfo.explanation : (q.explanation || 'Reflecting on active practice deepens structural retention and conceptual clarity.');
                const relConcept = q.related_concept || `${currentActiveModule.quadrant_category || 'Distributed Collective'} learning mode`;
                const recChapter = q.recommended || (ch ? `Chapter ${currentChapterIndex + 1}: ${ch.title}` : currentActiveModule.title);

                html += `
                    <div class="explanation-box">
                        <div><strong style="color: #ffffff;">Explanation:</strong> <span style="color: #cbd5e1;">${escapeHtml(explText)}</span></div>
                        <div><strong style="color: #ffffff;">Related concept:</strong> <span style="color: #94a3b8;">${escapeHtml(relConcept)}</span></div>
                        <div><strong style="color: #ffffff;">Recommended:</strong> <span style="color: #94a3b8;">${escapeHtml(recChapter)}</span></div>
                    </div>
                `;
            }

            html += `</div>`; // end options-list

            // Carousel Navigation Footer
            const isLastQuestion = currentKCQuestionIndex === questions.length - 1;

            html += `
                <div class="kc-carousel-footer">
                    <button class="btn-kc-nav" onclick="handleKCCarouselNav(-1)" ${currentKCQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    
                    <div style="display: flex; align-items: center; gap: 10px;">
            `;

            if (!isGraded) {
                if (!isLastQuestion) {
                    html += `
                        <button class="btn-kc-nav btn-kc-next" onclick="handleKCCarouselNav(1)" ${!isCurrentAnswered ? 'disabled' : ''}>
                            Next Question &rarr;
                        </button>
                    `;
                } else {
                    html += `
                        <button class="btn-kc-submit" onclick="handleSubmitKCAnswers(${JSON.stringify(questions.map(item => item.id))})" ${!isCurrentAnswered || !allAnswered ? 'disabled' : ''}>
                            Submit Answers &rarr;
                        </button>
                    `;
                }
            } else {
                if (!isLastQuestion) {
                    html += `
                        <button class="btn-kc-nav btn-kc-next" onclick="handleKCCarouselNav(1)">
                            Next Question &rarr;
                        </button>
                    `;
                } else {
                    if (quizGradedResults.passed) {
                        html += `
                            <button class="btn-continue-next-kc" onclick="handleVictoryContinue()">
                                Continue to Next Section &rarr;
                            </button>
                        `;
                    } else {
                        html += `
                            <button class="btn-retake-kc" onclick="handleRetakeKC()">
                                <svg width="15" height="15" style="vertical-align: middle; margin-right: 6px;"><use href="#icon-refresh"></use></svg>
                                Retake Knowledge Check
                            </button>
                        `;
                    }
                }
            }

            html += `
                    </div>
                </div>
            `;

            html += `</div>`; // end question-card

            body.innerHTML = html;
        }

        function handleKCCarouselNav(direction) {
            currentKCQuestionIndex += direction;
            if (currentKCQuestionIndex < 0) currentKCQuestionIndex = 0;
            if (currentKCQuestionIndex >= currentActiveQuestions.length) currentKCQuestionIndex = currentActiveQuestions.length - 1;
            renderKnowledgeCheckContent();
        }

        function handleKCJmp(index) {
            currentKCQuestionIndex = index;
            renderKnowledgeCheckContent();
        }

        function handleRetakeKC() {
            studentQuizAnswers = {};
            quizGradedResults = null;
            currentKCQuestionIndex = 0;
            renderKnowledgeCheckContent();
            
            const scrollPane = document.getElementById('reader-scroll-container');
            if (scrollPane) scrollPane.scrollTop = 0;
        }

        function handleSelectOptionByIndex(qId, optIdx) {
            const q = currentActiveQuestions.find(item => item.id === qId);
            if (!q) return;
            const val = q.question_type === 'true_false' 
                ? (optIdx === 0 ? 'True' : 'False')
                : (q.options ? q.options[optIdx] : '');
            studentQuizAnswers[qId] = val;
            renderKnowledgeCheckContent();
        }

        function isQuestionAnswered(question) {
            if (!question) return false;
            const ans = studentQuizAnswers[question.id];
            if (ans === undefined || ans === null || ans === '') return false;
            if (question.question_type === 'matching') {
                const pairs = Array.isArray(question.options) ? question.options : [];
                if (pairs.length === 0) return true;
                if (typeof ans !== 'object' || ans === null) return false;
                return pairs.every(p => {
                    const term = p.term || p.left || '';
                    return ans[term] !== undefined && ans[term] !== null && String(ans[term]).trim() !== '';
                });
            }
            return true;
        }

        function updateKCNavState() {
            const q = currentActiveQuestions[currentKCQuestionIndex];
            if (!q) return;
            const isCurrentAnswered = isQuestionAnswered(q);
            const allAnswered = currentActiveQuestions.every(item => isQuestionAnswered(item));

            const nextBtn = document.querySelector('.btn-kc-next');
            if (nextBtn) {
                nextBtn.disabled = !isCurrentAnswered;
            }

            const submitBtn = document.querySelector('.btn-kc-submit');
            if (submitBtn) {
                submitBtn.disabled = (!isCurrentAnswered || !allAnswered);
            }

            // Update step dots
            const dots = document.querySelectorAll('.kc-step-dot');
            currentActiveQuestions.forEach((item, dIdx) => {
                if (dots[dIdx]) {
                    if (isQuestionAnswered(item)) {
                        dots[dIdx].classList.add('answered');
                    } else {
                        dots[dIdx].classList.remove('answered');
                    }
                }
            });
        }

        function handleSelectMatchByIndex(qId, pairIdx, value) {
            const q = currentActiveQuestions.find(item => item.id === qId);
            if (!q) return;
            const pairs = Array.isArray(q.options) ? q.options : [];
            const pair = pairs[pairIdx];
            if (!pair) return;
            const term = pair.term || pair.left || '';

            if (typeof studentQuizAnswers[qId] !== 'object' || studentQuizAnswers[qId] === null) {
                studentQuizAnswers[qId] = {};
            }
            studentQuizAnswers[qId][term] = value;
            updateKCNavState();
        }

        /* --- SUBMIT KC & TRIGGER VICTORY MODAL --- */
        async function handleSubmitKCAnswers(questionIds) {
            const chapters = currentActiveModule.chapters || [];
            const ch = chapters[currentChapterIndex];
            // When submitting Final Assessment, send chapter_id = null so backend evaluates all module questions!
            const chapterId = (currentStepType === 'final') ? null : (ch ? ch.id : null);

            const submitBtns = document.querySelectorAll('.btn-kc-submit');
            submitBtns.forEach(btn => {
                btn.disabled = true;
                btn.innerHTML = '<span class="submit-spinner"></span> Grading Answers...';
            });

            try {
                let resData = null;
                try {
                    const res = await fetch(`/api/modules/${currentActiveModule.id}/submit-quiz`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            student_id: currentStudentId,
                            chapter_id: chapterId,
                            answers: studentQuizAnswers
                        })
                    });
                    if (res.ok) {
                        resData = await res.json();
                    }
                } catch(netErr) {
                    console.warn("Quiz submission network fallback:", netErr);
                }

                if (resData && resData.total > 0 && resData.results && resData.results.length > 0) {
                    quizGradedResults = resData;
                } else {
                    // Fallback accurate client-side evaluation of currentActiveQuestions
                    let correctCount = 0;
                    const results = currentActiveQuestions.map(q => {
                        const studentVal = studentQuizAnswers[q.id];
                        let isCorrect = false;
                        if (q.question_type === 'true_false') {
                            isCorrect = String(studentVal).toLowerCase() === String(q.correct_answer).toLowerCase();
                        } else if (q.question_type === 'multiple_choice') {
                            isCorrect = String(studentVal).trim() === String(q.correct_answer).trim();
                        } else if (q.question_type === 'matching') {
                            const pairs = Array.isArray(q.options) ? q.options : [];
                            const isAllMatched = pairs.every(p => {
                                const term = p.term || p.left || '';
                                const match = p.match || p.right || '';
                                return studentVal && studentVal[term] === match;
                            });
                            isCorrect = isAllMatched && pairs.length > 0;
                        }
                        if (isCorrect) correctCount++;
                        return {
                            question_id: q.id,
                            is_correct: isCorrect,
                            student_answer: studentVal,
                            correct_answer: q.correct_answer,
                            explanation: q.explanation || ''
                        };
                    });

                    const totalQ = currentActiveQuestions.length;
                    const isPerfect = totalQ > 0 && correctCount === totalQ;
                    quizGradedResults = {
                        score: correctCount,
                        total: totalQ,
                        percentage: totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0,
                        passed: isPerfect,
                        results: results
                    };
                }

                // If perfected 100%, unlock next chapter and trigger victory modal
                if (quizGradedResults.passed && quizGradedResults.total > 0) {
                    const progress = getStudentProgress(currentActiveModule.id);
                    if (currentStepType === 'final') {
                        progress.completedFinal = true;
                        progress.moduleCompleted = true;
                    } else {
                        if (!progress.completedKCs.includes(currentChapterIndex)) {
                            progress.completedKCs.push(currentChapterIndex);
                        }

                        const nextChapterIdx = currentChapterIndex + 1;
                        if (nextChapterIdx < chapters.length && !progress.unlockedChapters.includes(nextChapterIdx)) {
                            progress.unlockedChapters.push(nextChapterIdx);
                        }
                    }

                    saveStudentProgress(currentActiveModule.id, progress);
                    renderReaderStepper();
                    renderKnowledgeCheckContent();
                    showVictoryModal();
                } else {
                    // Score < 100%: Keep next section locked, re-render to display graded answers, explanations, and retake button
                    renderKnowledgeCheckContent();
                }

            } catch(e) {
                console.error("Submit quiz error:", e);
                renderKnowledgeCheckContent();
            }
        }

        /* --- VICTORY MODAL CONTROLS (Screenshot 3) --- */
        function showVictoryModal() {
            const allModuleQuestions = (currentActiveModule && currentActiveModule.questions) || [];
            const isFinal = currentStepType === 'final' || (allModuleQuestions.length === 0);
            const kcName = isFinal ? 'the entire module!' : `Knowledge Check ${currentChapterIndex + 1}`;
            document.getElementById('victory-student-title').textContent = isFinal ? `Module Mastered, ${currentStudentFirstName}!` : `Great Job, ${currentStudentFirstName}!`;
            document.getElementById('victory-kc-name').textContent = kcName;
            
            const btnContinue = document.querySelector('.btn-victory-continue');
            if (btnContinue) {
                btnContinue.innerHTML = isFinal ? 'Finish & Back to Modules &rarr;' : 'Continue to Next &rarr;';
            }
            document.getElementById('victory-modal').style.display = 'flex';
        }

        function closeVictoryModal() {
            document.getElementById('victory-modal').style.display = 'none';
        }

        function handleVictoryContinue() {
            closeVictoryModal();
            const allModuleQuestions = (currentActiveModule && currentActiveModule.questions) || [];
            if (currentStepType === 'final' || allModuleQuestions.length === 0) {
                exitReaderView();
                return;
            }
            const chapters = currentActiveModule.chapters || [];
            const nextChapterIdx = currentChapterIndex + 1;

            if (nextChapterIdx < chapters.length) {
                selectStep('chapter', nextChapterIdx);
            } else if (allModuleQuestions.length > 0) {
                selectStep('final', 0);
            } else {
                exitReaderView();
            }
        }

        function formatYoutubeEmbedUrl(url) {
            if (!url || url.trim() === '') return '';
            let videoId = '';
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (match && match[1]) {
                videoId = match[1];
                return `https://www.youtube.com/embed/${videoId}`;
            }
            return url;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function (m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
