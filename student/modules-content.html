<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Modules Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-card: #0d1520;
            --bg-card-hover: #111b27;
            --bg-pane: #0a111a;
            
            --matrix-yellow: #d8a61a;
            --matrix-yellow-hover: #eab308;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --text-subtle: #7a8d9e;
            
            --border-light: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.16);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- CUSTOM DARK SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #060e16;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            border: 2px solid #060e16;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        html, body, .reader-scrollable-area {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.16) #060e16;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
        }

        .svg-defs { display: none; }
        svg { display: inline-block; vertical-align: middle; }

        /* ==========================================================================
           VIEW 1: MODULES OVERVIEW LIST
           ========================================================================== */
        #view-overview {
            max-width: 980px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        
        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Adaptive Routing Banner */
        .adaptive-banner {
            background: rgba(216, 166, 26, 0.05);
            border: 1px solid rgba(216, 166, 26, 0.25);
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #d8a61a;
            line-height: 1.4;
            margin-top: 4px;
        }

        .adaptive-banner svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            stroke: #d8a61a;
        }

        .adaptive-banner strong {
            color: #eab308;
            font-weight: 700;
        }

        /* Modules Horizontal List */
        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        .module-card-horizontal {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .module-card-horizontal:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.18);
            background: var(--bg-card-hover);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .card-left-group {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            flex: 1;
        }

        .module-index-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .badge-dc { background: rgba(192, 132, 252, 0.12); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }
        .badge-di { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-hc { background: rgba(251, 146, 60, 0.12); color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.3); }
        .badge-hi { background: rgba(74, 222, 128, 0.12); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }

        .module-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .module-title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .module-title-text {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .pill-recommended {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pill-recommended.dc { background: rgba(192, 132, 252, 0.15); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }
        .pill-recommended.di { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .pill-recommended.hc { background: rgba(251, 146, 60, 0.15); color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.3); }
        .pill-recommended.hi { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }

        .module-description-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .module-meta-info {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 12px;
            color: var(--text-subtle);
            font-weight: 500;
            margin-top: 2px;
        }

        .module-meta-info span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .current-chapter-highlight {
            color: #38bdf8;
            font-weight: 600;
        }

        .card-right-group {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 75px;
        }

        .pct-large {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .pct-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: lowercase;
        }

        /* Progress Bar Section */
        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-subtle);
        }

        .progress-track-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .fill-dc { background: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.4); }
        .fill-di { background: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .fill-hc { background: #fb923c; box-shadow: 0 0 10px rgba(251, 146, 60, 0.4); }
        .fill-hi { background: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }

        /* Card Action Row */
        .card-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2px;
        }

        .step-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }

        .step-dot.active-dc { background: #c084fc; box-shadow: 0 0 8px rgba(192, 132, 252, 0.6); }
        .step-dot.active-di { background: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }
        .step-dot.active-hc { background: #fb923c; box-shadow: 0 0 8px rgba(251, 146, 60, 0.6); }
        .step-dot.active-hi { background: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, 0.6); }

        .btn-continue {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-continue:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateX(2px);
        }

        .btn-continue.btn-dc { color: #c084fc; border-color: rgba(192, 132, 252, 0.3); }
        .btn-continue.btn-di { color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
        .btn-continue.btn-hc { color: #fb923c; border-color: rgba(251, 146, 60, 0.3); }
        .btn-continue.btn-hi { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }

        /* Empty State */
        .empty-state-box {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* ==========================================================================
           VIEW 2: FULL-SCREEN INTERACTIVE MODULE & KNOWLEDGE CHECK READER
           ========================================================================== */
        #view-reader {
            display: none;
            width: 100%;
            height: 100vh;
            background: var(--bg-base);
            grid-template-columns: 320px 1fr;
            overflow: hidden;
        }

        /* Reader Left Sidebar */
        .reader-sidebar-pane {
            background: #091018;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            padding: 24px 20px;
            gap: 20px;
        }

        .back-to-modules-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-to-modules-btn:hover {
            color: #ffffff;
        }

        .sidebar-module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-module-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-module-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(192, 132, 252, 0.15);
            color: var(--matrix-purple);
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-module-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .sidebar-progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-subtle);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .sidebar-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .sidebar-fill {
            height: 100%;
            background: var(--matrix-purple);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Stepper Navigation List (Reference Match) */
        .reader-stepper {
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
            margin-top: 4px;
        }

        .step-item {
            position: relative;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid transparent;
            user-select: none;
            width: 100%;
        }

        .step-item:hover:not(.locked) {
            background: rgba(255, 255, 255, 0.04);
        }

        .step-item:hover:not(.locked) .step-title-text {
            color: #ffffff;
        }

        .step-item.active {
            background: rgba(192, 132, 252, 0.08);
            border-color: rgba(192, 132, 252, 0.3);
            padding: 12px 14px;
        }

        .step-item.active .step-title-text {
            color: var(--matrix-purple);
            font-weight: 700;
        }

        .step-item.active .step-sub-text {
            color: rgba(192, 132, 252, 0.75);
        }

        .step-item.active .step-dot-indicator {
            background: var(--matrix-purple);
            box-shadow: 0 0 8px rgba(192, 132, 252, 0.85);
            display: block;
        }

        .step-item.locked {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .step-item.completed .step-title-text {
            color: #94a3b8;
        }

        .step-item.sub-item {
            margin-left: 6px;
        }

        .step-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .step-icon {
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
        }

        .step-text-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .step-title-text {
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.35;
            color: #cbd5e1;
            word-break: break-word;
            white-space: normal;
            transition: color 0.2s;
        }

        .step-sub-text {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            line-height: 1.2;
        }

        .step-dot-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: transparent;
            flex-shrink: 0;
            margin-top: 6px;
            display: none;
        }

        .stepper-connector {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            margin-left: 20px;
            margin-top: -1px;
            margin-bottom: -1px;
        }

        /* Reader Right Content Pane */
        .reader-main-pane {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #060e16;
            position: relative;
        }

        .reader-scrollable-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px 56px 120px 56px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 880px;
            margin: 0 auto;
            width: 100%;
        }

        #reader-content-body {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        #reader-content-body > div {
            margin-bottom: 10px;
        }

        #reader-content-body > div:last-child {
            margin-bottom: 0;
        }

        /* Top Header Card (Reference Match) */
        .reader-header-card {
            background: rgba(13, 21, 32, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .reader-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
        }

        .reader-quadrant-tag {
            color: var(--matrix-purple);
            letter-spacing: 0.5px;
        }

        .reader-time-tag {
            color: var(--text-subtle);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            font-size: 12px;
        }

        .reader-chapter-title {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
            line-height: 1.35;
        }

        /* Content Block Cards (Callout Cards: Learning Objectives & Examples) */
        .content-block-card {
            background: rgba(13, 21, 32, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 10px;
        }

        .content-block-title {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.9px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .objective-item, .example-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            font-size: 14.5px;
            line-height: 1.65;
            color: #cbd5e1;
        }

        .num-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .article-body-text {
            font-size: 15px;
            line-height: 1.85;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 10px;
        }

        .article-body-text p {
            margin: 0;
            line-height: 1.85;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: #000;
            margin-bottom: 10px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-viewer-frame {
            width: 100%;
            height: 520px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            background: #111;
            margin-bottom: 10px;
        }

        /* Bottom Sticky Unlock Bar */
        .bottom-action-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 48px;
            background: rgba(13, 21, 32, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .unlock-status-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .unlock-status-text.locked {
            color: var(--matrix-yellow);
        }

        .unlock-status-text.unlocked {
            color: var(--matrix-green);
        }

        .btn-unlock-kc {
            background: #10b981;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-unlock-kc:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-unlock-kc:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* ==========================================================================
           KNOWLEDGE CHECK QUIZ VIEW (Screenshot 2)
           ========================================================================== */
        .kc-header-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .kc-icon-box {
            font-size: 24px;
            background: rgba(192, 132, 252, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .kc-title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .kc-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        .kc-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .question-num-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .question-text-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-choice-btn {
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 18px;
            color: #cbd5e1;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
