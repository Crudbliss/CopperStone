<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --bg-box: #1a222a; /* Slightly lighter background for inner boxes */
            
            --matrix-yellow: #d8a61a;
            --matrix-yellow-faint: rgba(216, 166, 26, 0.15);
            --matrix-green: #4ade80;
            --matrix-green-faint: rgba(74, 222, 128, 0.1);
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --text-dark-muted: #4e6376;
            
            --border-light: rgba(255, 255, 255, 0.06);
            --border-yellow: rgba(216, 166, 26, 0.2);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent; /* Allows parent background to show */
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .svg-defs { display: none; }
        
        svg {
            display: inline-block;
            vertical-align: middle;
        }

        /* --- MAIN CONTAINER --- */
        .profile-container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- GLASS CARD BASE --- */
        .glass-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 32px;
        }

        /* --- 1. PROFILE HEADER CARD --- */
        .card-profile {
            border-color: var(--border-yellow); /* Slight yellow tint to the border */
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .profile-top-row {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .profile-avatar-lg {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background-color: var(--matrix-yellow-faint);
            border: 1px solid rgba(216, 166, 26, 0.4);
            color: var(--matrix-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .profile-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }

        .profile-id {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .profile-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--matrix-green);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Info Grid */
        .profile-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .info-box {
            background-color: var(--bg-box);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* --- 2. ASSESSMENT HISTORY CARD --- */
        .history-card-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .history-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .history-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Status Colors for History Icons */
        .icon-success { color: var(--matrix-green); }
        .icon-pending { color: var(--matrix-yellow); }
        .icon-locked { color: var(--text-dark-muted); }

        .history-item-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .history-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .history-item-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .history-mode {
            color: var(--matrix-green);
            font-weight: 500;
        }

        .history-score {
            color: var(--matrix-green);
            font-weight: 800;
            font-size: 14px;
        }

        .history-status-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- 3. FOOTER CARD --- */
        .card-footer {
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .univ-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background-color: var(--matrix-yellow-faint);
            color: var(--matrix-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
        }

        .univ-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .univ-title {
            font-size: 14px;
            font-weight: 700;
        }

        .univ-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <svg class="svg-defs">
        <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </symbol>
    </svg>

    <div class="profile-container">
        
        <div class="glass-card card-profile">
            
            <div class="profile-top-row">
                <div class="profile-avatar-lg" id="profile-avatar">--</div>
                <div class="profile-details">
                    <h2 class="profile-name" id="profile-name">Loading...</h2>
                    <p class="profile-id" id="profile-id">----</p>
                    <div class="profile-status-pill">
                        <span>📚</span> <span id="profile-mode">Hierarchical Individual</span>
                    </div>
                </div>
            </div>

            <div class="profile-info-grid">
                <div class="info-box">
                    <span class="info-label">Program</span>
                    <span class="info-value" id="profile-program">Loading...</span>
                </div>
                <div class="info-box">
                    <span class="info-label">Year Level</span>
                    <span class="info-value" id="profile-year">Loading...</span>
                </div>
                <div class="info-box">
                    <span class="info-label">Section</span>
                    <span class="info-value" id="profile-section">Loading...</span>
                </div>
                <div class="info-box">
                    <span class="info-label">Email</span>
                    <span class="info-value" id="profile-email">Loading...</span>
                </div>
            </div>

        </div>

        <div class="glass-card">
            <div class="card-header" style="margin-bottom: 24px;">
                <div class="history-card-header">ASSESSMENT HISTORY</div>
            </div>
            
            <div class="history-list" id="history-list">
                <!-- Dynamically populated -->
                <div style="text-align: center; padding: 20px; color: var(--text-muted);">Loading history...</div>
            </div>
        </div>

        <div class="glass-card card-footer">
            <div class="univ-icon">M</div>
            <div class="univ-text">
                <span class="univ-title">Our Lady of Fatima University</span>
                <span class="univ-subtitle">MATRIX Platform • Academic Year 2025–2026</span>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('currentUser');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    
                    // Name and Initials
                    const fName = user.name || '';
                    const lName = user.last_name || '';
                    document.getElementById('profile-name').textContent = `${fName} ${lName}`.trim();
                    document.getElementById('profile-avatar').textContent = (fName.charAt(0) + lName.charAt(0)).toUpperCase() || '--';
                    
                    // ID
                    document.getElementById('profile-id').textContent = user.student_no || 'Unknown ID';
                    
                    // Format Program
                    let fullProgram = user.program || '--';
                    if (fullProgram.toUpperCase() === 'BSIT') fullProgram = 'BS in Information Technology';
                    if (fullProgram.toUpperCase() === 'BSCS') fullProgram = 'BS in Computer Science';
                    
                    // Format Year Level
                    let yearFormatted = '--';
                    if (user.year_level) {
                        const yr = String(user.year_level);
                        if (yr === '1') yearFormatted = '1st Year';
                        else if (yr === '2') yearFormatted = '2nd Year';
                        else if (yr === '3') yearFormatted = '3rd Year';
                        else if (yr === '4') yearFormatted = '4th Year';
                        else yearFormatted = `${yr}th Year`;
                    }

                    // Format Section
                    let sectionFormatted = '--';
                    if (user.program && user.year_level && user.section) {
                        sectionFormatted = `${user.program.toUpperCase()} ${user.year_level}-${user.section}`;
                    }

                    // Info Grid
                    document.getElementById('profile-program').textContent = fullProgram;
                    document.getElementById('profile-year').textContent = yearFormatted;
                    document.getElementById('profile-section').textContent = sectionFormatted;
                    
                    // Generate dummy email from names
                    let email = `${fName.toLowerCase()}.${lName.toLowerCase()}@student.olfu.edu.ph`.replace(/\s/g, '');
                    if (!fName && !lName) email = 'student@olfu.edu.ph';
                    document.getElementById('profile-email').textContent = email;
                    
                    // Populate Mode from cached profile
                    const profileStr = localStorage.getItem('studentProfile');
                    if(profileStr) {
                        const profile = JSON.parse(profileStr);
                        const mode = profile.learning_mode;
                        const modeEl = document.getElementById('profile-mode');
                        const pillEl = modeEl.parentElement;
                        
                        if(mode) {
                            let color = 'var(--matrix-green)';
                            if(mode === 'Hierarchical Individual') color = 'var(--matrix-green)';
                            else if(mode === 'Distributed Individual') color = 'var(--matrix-blue)';
                            else if(mode === 'Hierarchical Collective') color = 'var(--matrix-orange)';
                            else if(mode === 'Distributed Collective') color = 'var(--matrix-purple)';
                            
                            modeEl.textContent = mode;
                            modeEl.style.color = color;
                            pillEl.style.borderColor = `color-mix(in srgb, ${color} 30%, transparent)`;
                            pillEl.style.backgroundColor = `color-mix(in srgb, ${color} 10%, transparent)`;
                        } else {
                            modeEl.textContent = 'Not Assessed';
                            modeEl.style.color = 'var(--text-muted)';
                        }
                    }
                    
                    fetchHistory(user.id);

                } catch(e) {
                    console.error("Error parsing user data:", e);
                }
            }
        });

        async function fetchHistory(studentId) {
            try {
                const [activeRes, historyRes] = await Promise.all([
                    fetch('/api/students/' + studentId + '/active-sessions'),
                    fetch('/api/students/' + studentId + '/history')
                ]);
                
                const activeSessions = await activeRes.json();
                const history = await historyRes.json();
                
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                
                if (history.length === 0 && activeSessions.length === 0) {
                    list.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted);">No assessment history found.</div>';
                    return;
                }
                
                // Render completed history
                history.forEach(item => {
                    const dateObj = new Date(item.taken_at);
                    const dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    const pct = Math.round((Math.max(Math.abs(item.x_coord || 0), Math.abs(item.y_coord || 0)) / 5) * 100);
                    
                    let color = 'var(--matrix-green)';
                    if(item.learning_mode === 'Hierarchical Individual') color = 'var(--matrix-green)';
                    else if(item.learning_mode === 'Distributed Individual') color = 'var(--matrix-blue)';
                    else if(item.learning_mode === 'Hierarchical Collective') color = 'var(--matrix-orange)';
                    else if(item.learning_mode === 'Distributed Collective') color = 'var(--matrix-purple)';

                    list.innerHTML += `
                        <div class="history-item">
                            <div class="history-item-left">
                                <div class="history-icon" style="color: ${color}; background-color: color-mix(in srgb, ${color} 10%, transparent); border: 1px solid color-mix(in srgb, ${color} 20%, transparent); width: 36px; height: 36px; border-radius: 10px;">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                </div>
                                <div class="history-item-text">
                                    <span class="history-title">${item.quarter_name}</span>
                                    <span class="history-date">${dateStr}</span>
                                </div>
                            </div>
                            <div class="history-item-right" style="gap: 8px;">
                                <span class="history-mode" style="color: ${color}; font-size: 13px; font-weight: 600;">${item.learning_mode}</span>
                                <span class="history-score" style="color: ${color}; font-weight: 800; font-size: 14px; min-width: 32px; text-align: right;">${pct}%</span>
                            </div>
                        </div>
                    `;
                });

                // Render active
                let hasActive = false;
                if (activeSessions.length > 0) {
                    const active = activeSessions[0];
                    const alreadyTook = history.some(h => h.session_id === active.session_id);
                    
                    if (!alreadyTook) {
                        hasActive = true;
                        const d = active.deadline ? new Date(active.deadline).toLocaleDateString('en-US', {month: 'long', year: 'numeric'}) : 'Open Now';
                        list.innerHTML += `
                            <div class="history-item">
                                <div class="history-item-left">
                                    <div class="history-icon" style="color: var(--matrix-yellow); background-color: rgba(216, 166, 26, 0.1); border: 1px solid rgba(216, 166, 26, 0.2); width: 36px; height: 36px; border-radius: 10px;">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    </div>
                                    <div class="history-item-text">
                                        <span class="history-title">${active.quarter_name}</span>
                                        <span class="history-date">${d}</span>
                                    </div>
                                </div>
                                <div class="history-item-right">
                                    <span style="color: var(--text-muted); font-size: 13px; font-weight: 500;">current</span>
                                </div>
                            </div>
                        `;
                    }
                }

                // Render locked
                const quarters = ['Prelim', 'Midterm', 'Final'];
                quarters.forEach(q => {
                    const isDone = history.some(h => h.quarter_name.includes(q));
                    let isActive = false;
                    if (activeSessions.length > 0) {
                        const active = activeSessions[0];
                        isActive = active.quarter_name.includes(q) && !history.some(h => h.session_id === active.session_id);
                    }
                    
                    if (!isDone && !isActive) {
                        list.innerHTML += `
                            <div class="history-item" style="opacity: 0.6;">
                                <div class="history-item-left">
                                    <div class="history-icon" style="color: var(--text-muted); background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px; border-radius: 10px;">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                    </div>
                                    <div class="history-item-text">
                                        <span class="history-title">${q}</span>
                                        <span class="history-date">Upcoming</span>
                                    </div>
                                </div>
                                <div class="history-item-right">
                                    <span style="color: var(--text-muted); font-size: 13px; font-weight: 500;">locked</span>
                                </div>
                            </div>
                        `;
                    }
                });

            } catch (err) {
                console.error("Failed to fetch history:", err);
                document.getElementById('history-list').innerHTML = '<div style="color: #f87171; text-align: center;">Error loading history</div>';
            }
        }
    </script>
</body>
</html>
