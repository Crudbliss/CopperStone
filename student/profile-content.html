<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --bg-box: #1a222a;

            --matrix-yellow: #d8a61a;
            --matrix-yellow-faint: rgba(216, 166, 26, 0.15);
            --matrix-green: #4ade80;
            --matrix-green-faint: rgba(74, 222, 128, 0.1);
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;

            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --text-dark-muted: #4e6376;

            --border-light: rgba(255, 255, 255, 0.06);
            --border-yellow: rgba(216, 166, 26, 0.2);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        /* --- MAIN CONTAINER --- */
        .profile-container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- GLASS CARD BASE --- */
        .glass-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 32px;
        }

        /* --- PROFILE HEADER CARD --- */
        .card-profile {
            border-color: var(--border-yellow);
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .profile-top-row {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .profile-avatar-lg {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background-color: var(--matrix-yellow-faint);
            border: 1px solid rgba(216, 166, 26, 0.4);
            color: var(--matrix-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .profile-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }

        .profile-id {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .profile-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--matrix-green);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Info Grid */
        .profile-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .info-box {
            background-color: var(--bg-box);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* --- FOOTER CARD --- */
        .card-footer {
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .univ-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background-color: var(--matrix-yellow-faint);
            color: var(--matrix-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
        }

        .univ-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .univ-title {
            font-size: 14px;
            font-weight: 700;
        }

        .univ-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .profile-container { gap: 16px; }
            .glass-card { padding: 20px; }
            .card-profile { gap: 24px; }
            .profile-top-row { flex-direction: column; align-items: center; text-align: center; gap: 16px; }
            .profile-details { align-items: center; }
            .profile-info-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>

<body>

    <div class="profile-container">

        <div class="glass-card card-profile">

            <div class="profile-top-row">
                <div class="profile-avatar-lg" id="profile-avatar">--</div>
                <div class="profile-details">
                    <h2 class="profile-name" id="profile-name">Loading...</h2>
                    <p class="profile-id" id="profile-id">----</p>
                    <div class="profile-status-pill">
                        <span>📚</span> <span id="profile-mode">Hierarchical Individual</span>
                    </div>
                </div>
            </div>

            <div class="profile-info-grid">
                <div class="info-box">
                    <span class="info-label">Student ID</span>
                    <span class="info-value" id="profile-student-no">Loading...</span>
                </div>
                <div class="info-box">
                    <span class="info-label">Email Address</span>
                    <span class="info-value" id="profile-email">Loading...</span>
                </div>
            </div>

        </div>

        <div class="glass-card card-footer">
            <div class="univ-icon" style="padding: 6px; background: transparent;">
                <img src="../images/matrix_logo.png" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="univ-text">
                <span class="univ-title">Our Lady of Fatima University</span>
                <span class="univ-subtitle">MATRIX Platform • Academic Year 2025–2026</span>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('currentUser');
            if (userStr) {
                try {
                    let user = JSON.parse(userStr);
                    let profile = {};
                    const profileStr = localStorage.getItem('studentProfile');
                    if (profileStr) {
                        try { profile = JSON.parse(profileStr); } catch(e){}
                    }

                    // Fetch latest profile from DB to guarantee student_no and details are accurate
                    if (user && user.id) {
                        try {
                            const studentRes = await fetch('/api/students/' + user.id);
                            if (studentRes.ok) {
                                const dbStudent = await studentRes.json();
                                user = { ...user, ...dbStudent };
                                profile = { ...profile, ...dbStudent };
                                localStorage.setItem('currentUser', JSON.stringify(user));
                                localStorage.setItem('studentProfile', JSON.stringify(profile));
                            }
                        } catch (fetchErr) {
                            console.warn("Could not fetch latest student profile", fetchErr);
                        }
                    }

                    // Name and Initials
                    const fName = user.first_name || user.name || profile.first_name || '';
                    const lName = user.last_name || profile.last_name || '';
                    const fullName = `${fName} ${lName}`.trim();
                    document.getElementById('profile-name').textContent = fullName || 'Student Account';
                    document.getElementById('profile-avatar').textContent = (fName.charAt(0) + (lName ? lName.charAt(0) : '')).toUpperCase() || 'ST';

                    // ID - prioritize student_no from user or profile, fallback to formatted ID based on id
                    let studentId = user.student_no || profile.student_no;
                    if (!studentId || studentId === 'Unknown ID') {
                        const numericId = user.id || profile.id || 1;
                        studentId = `0226${numericId.toString().padStart(4, '0')}`;
                    }
                    document.getElementById('profile-id').textContent = studentId;
                    document.getElementById('profile-student-no').textContent = studentId;

                    // Email
                    let email = user.email || profile.email || (fName && lName ? `${fName.toLowerCase()}.${lName.toLowerCase()}@student.olfu.edu.ph`.replace(/\s/g, '') : 'student@olfu.edu.ph');
                    document.getElementById('profile-email').textContent = email;

                    // Populate Mode from cached profile
                    const mode = profile.learning_mode || user.learning_mode;
                    const modeEl = document.getElementById('profile-mode');
                    const pillEl = modeEl.parentElement;

                    if (mode && mode !== 'Unknown' && mode !== 'null') {
                        let color = 'var(--matrix-green)';
                        if (mode === 'Hierarchical Individual') color = 'var(--matrix-green)';
                        else if (mode === 'Distributed Individual') color = 'var(--matrix-blue)';
                        else if (mode === 'Hierarchical Collective') color = 'var(--matrix-orange)';
                        else if (mode === 'Distributed Collective') color = 'var(--matrix-purple)';

                        modeEl.textContent = mode;
                        modeEl.style.color = color;
                        pillEl.style.borderColor = `color-mix(in srgb, ${color} 30%, transparent)`;
                        pillEl.style.backgroundColor = `color-mix(in srgb, ${color} 10%, transparent)`;
                    } else {
                        modeEl.textContent = 'Not Assessed';
                        modeEl.style.color = 'var(--text-muted)';
                    }

                } catch (e) {
                    console.error("Error parsing user data:", e);
                }
            }
        });
    </script>
</body>

</html>
