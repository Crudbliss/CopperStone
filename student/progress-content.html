<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Mode Progress Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* --- CSS VARIABLES (Theme Colors) --- */
        :root {
            --bg-base: #060f17;
            --bg-panel: #0a1e2d;
            --bg-card: #12181f;

            --matrix-yellow: #d8a61a;
            --matrix-yellow-hover: #eab308;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;

            --text-main: #ffffff;
            --text-muted: #8b9eb0;

            --border-light: rgba(255, 255, 255, 0.05);
            --border-lighter: rgba(255, 255, 255, 0.1);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            /* Allows parent background to show */
            color: var(--text-main);
            /* Removed flex and hidden overflow so it scrolls properly inside iframe */
        }

        .svg-defs {
            display: none;
        }

        svg {
            display: inline-block;
            vertical-align: middle;
        }

        /* --- MAIN CONTENT CONTAINER --- */
        .content-container {
            padding: 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* --- HEADER --- */
        .page-header {
            margin-bottom: 8px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* --- CARDS BASE --- */
        .glass-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
        }

        /* --- PROGRESS GRIDS --- */
        .progress-grid-2-1 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        /* --- PROGRESS QUADRANT CARD --- */
        .progress-quad-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .prog-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .quarter-label {
            font-size: 16px;
            font-weight: 700;
        }

        .dominant-mode-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--matrix-green);
        }

        /* QUADRANT GRAPH */
        .quadrant-map-outer {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .quadrant-graph {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-lighter);
        }

        .quadrant-grid-lines {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .q-cell {
            position: relative;
            border: 1px solid var(--border-lighter);
        }

        .q-cell.top-left {
            background-color: rgba(74, 222, 128, 0.04);
        }

        .q-cell.top-right {
            background-color: rgba(56, 189, 248, 0.04);
        }

        .q-cell.bottom-left {
            background-color: rgba(251, 146, 60, 0.04);
        }

        .q-cell.bottom-right {
            background-color: rgba(192, 132, 252, 0.04);
        }

        .data-point {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: var(--bg-card);
            border-radius: 50%;
            border: 4px solid var(--matrix-green);
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 16px 4px rgba(74, 222, 128, 0.3);
        }

        /* TEXT AXIS LABELS */
        .axis-label {
            position: absolute;
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .axis-y-left {
            left: 110px;
            top: 25%;
            font-size: 10px;
            transform: translateY(-50%) rotate(-90deg);
        }

        .axis-y-right {
            left: 110px;
            top: 75%;
            font-size: 10px;
            transform: translateY(-50%) rotate(-90deg);
        }

        .axis-x-bottom {
            position: absolute;
            bottom: -28px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 190px;
        }

        /* CARD FOOTER */
        .prog-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .score-percentage {
            font-size: 13px;
            font-weight: 700;
            color: var(--matrix-green);
        }


        /* --- Quarter 3 Placeholder Card --- */
        .card-prog-quarter-3 {
            padding: 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
        }

        .prog-clock-icon {
            color: var(--text-dark-muted, #4e6376);
            width: 48px;
            height: 48px;
        }

        .q3-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .q3-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }


        /* --- COORDINATE MOVEMENT CARD --- */
        .coord-movement-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
        }

        .coord-card-header {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .coord-boxes-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .coord-data-box {
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .coord-box-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .coord-box-value-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .coord-box-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .coord-box-delta-pos {
            font-size: 14px;
            color: var(--matrix-green);
            font-weight: 600;
        }

        .coord-box-delta-neg {
            font-size: 14px;
            color: var(--matrix-orange);
            font-weight: 600;
        }

        .coord-box-comparison {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* SVG definitions logic - including them for standalone use */
    </style>
</head>

<body>

    <svg class="svg-defs">
        <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </symbol>
    </svg>

    <div class="content-container">

        <div class="page-header">
            <h1 class="page-title">Learning Mode Progress</h1>
            <p class="page-subtitle">Track how your quadrant position evolves across each quarterly assessment.</p>
        </div>

        <div id="dynamic-content">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading progress data...</div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('currentUser');
            if (!userStr) return;
            const user = JSON.parse(userStr);

            try {
                // Fetch active sessions and history
                const [activeRes, historyRes] = await Promise.all([
                    fetch('/api/students/' + user.id + '/active-sessions'),
                    fetch('/api/students/' + user.id + '/history')
                ]);

                const activeSessions = await activeRes.json();
                const history = await historyRes.json();

                renderProgressPage(activeSessions, history);

            } catch (err) {
                console.error("Failed to load progress data", err);
                document.getElementById('dynamic-content').innerHTML = '<div style="color: #f87171; text-align: center; padding: 20px;">Failed to load progress data.</div>';
            }
        });

        function getModeColor(mode) {
            if (mode === 'Hierarchical Individual') return 'var(--matrix-green)';
            if (mode === 'Distributed Individual') return 'var(--matrix-blue)';
            if (mode === 'Hierarchical Collective') return 'var(--matrix-orange)';
            if (mode === 'Distributed Collective') return 'var(--matrix-purple)';
            return 'var(--matrix-green)';
        }

        function getQuadrantGridHtml(x, y, modeColor) {
            // Map coordinates (-5 to 5) to percentages (5% to 95%)
            let xPct = ((x + 5) / 10) * 100;
            let yPct = ((5 - y) / 10) * 100;
            xPct = Math.max(5, Math.min(95, xPct));
            yPct = Math.max(5, Math.min(95, yPct));

            return `
                <div class="quadrant-map-outer">
                    <div class="axis-label axis-y-left">INDIVIDUAL</div>
                    <div class="axis-label axis-y-right">COLLECTIVE</div>

                    <div class="quadrant-graph">
                        <div class="quadrant-grid-lines">
                            <div class="q-cell top-left"></div>
                            <div class="q-cell top-right"></div>
                            <div class="q-cell bottom-left"></div>
                            <div class="q-cell bottom-right"></div>
                        </div>
                        <div class="data-point" style="top: ${yPct}%; left: ${xPct}%; border-color: ${modeColor}; box-shadow: 0 0 16px 4px color-mix(in srgb, ${modeColor} 30%, transparent);"></div>
                    </div>
                    
                    <div class="axis-x-bottom">
                        <div class="axis-label" style="position: relative;">← HIERARCHICAL</div>
                        <div class="axis-label" style="position: relative;">DISTRIBUTED →</div>
                    </div>
                </div>
            `;
        }

        function renderProgressPage(activeSessions, history) {
            let html = '<div class="progress-grid-2-1">';

            // Render History Cards
            history.forEach(h => {
                const dateStr = new Date(h.taken_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const modeColor = getModeColor(h.learning_mode);
                const pct = Math.round((Math.max(Math.abs(h.x_coord || 0), Math.abs(h.y_coord || 0)) / 5) * 100);

                html += `
                    <div class="glass-card progress-quad-card">
                        <div class="prog-card-header">
                            <span class="quarter-label">${h.quarter_name}</span>
                            <span class="dominant-mode-label" style="color: ${modeColor}; background-color: color-mix(in srgb, ${modeColor} 10%, transparent); padding: 6px 12px; border-radius: 6px; font-weight: 700;">${h.learning_mode}</span>
                        </div>
                        
                        ${getQuadrantGridHtml(h.x_coord, h.y_coord, modeColor)}

                        <div class="prog-card-footer">
                            <span>${dateStr}</span>
                            <span class="score-percentage" style="color: ${modeColor};">${pct}%</span>
                        </div>
                    </div>
                `;
            });

            // Next Quarter State
            const quarters = ['Q1 Assessment', 'Q2 Assessment', 'Q3 Assessment', 'Q4 Assessment'];
            let nextQ = quarters.find(q => !history.some(h => h.quarter_name.includes(q.substring(0, 2))));

            if (activeSessions.length > 0) {
                const active = activeSessions[0];
                const d = active.deadline ? new Date(active.deadline).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : 'Open Now';
                html += `
                    <div class="glass-card card-prog-quarter-3" style="border: 1px dashed var(--border-light); border-color: rgba(74, 222, 128, 0.4); background-color: rgba(74, 222, 128, 0.05);">
                        <svg class="prog-clock-icon" style="color: var(--matrix-green);"><use href="#icon-clock"></use></svg>
                        <div class="q3-title" style="color: var(--matrix-green);">${active.quarter_name}</div>
                        <div class="q3-subtitle" style="color: var(--matrix-green);">Deadline: ${d}</div>
                    </div>
                `;
            } else if (nextQ) {
                html += `
                    <div class="glass-card card-prog-quarter-3" style="border: 1px dashed var(--border-light); background-color: rgba(255, 255, 255, 0.02);">
                        <svg class="prog-clock-icon"><use href="#icon-clock"></use></svg>
                        <div class="q3-title">${nextQ}</div>
                        <div class="q3-subtitle">Opens soon</div>
                    </div>
                `;
            }

            html += '</div>';

            // Coordinate Movement Logic
            if (history.length >= 2) {
                const last = history[history.length - 1];
                const prev = history[history.length - 2];

                const deltaX = (last.x_coord - prev.x_coord).toFixed(2);
                const deltaY = (last.y_coord - prev.y_coord).toFixed(2);

                const getDeltaClass = (val) => parseFloat(val) >= 0 ? 'coord-box-delta-pos' : 'coord-box-delta-neg';
                const getDeltaStr = (val) => parseFloat(val) > 0 ? '+' + val : val;

                html += `
                    <div class="glass-card coord-movement-card">
                        <div class="coord-card-header">COORDINATE MOVEMENT (${prev.quarter_name.substring(0, 2)} &rarr; ${last.quarter_name.substring(0, 2)})</div>
                        
                        <div class="coord-boxes-row">
                            <div class="coord-data-box">
                                <span class="coord-box-label">X (Hierarchical &harr; Distributed)</span>
                                <div class="coord-box-value-row">
                                    <span class="coord-box-value">${last.x_coord.toFixed(2)}</span>
                                    <span class="${getDeltaClass(deltaX)}">${getDeltaStr(deltaX)}</span>
                                </div>
                                <span class="coord-box-comparison">from ${prev.quarter_name.substring(0, 2)}: ${prev.x_coord.toFixed(2)}</span>
                            </div>

                            <div class="coord-data-box">
                                <span class="coord-box-label">Y (Collective &harr; Individual)</span>
                                <div class="coord-box-value-row">
                                    <span class="coord-box-value">${last.y_coord.toFixed(2)}</span>
                                    <span class="${getDeltaClass(deltaY)}">${getDeltaStr(deltaY)}</span>
                                </div>
                                <span class="coord-box-comparison">from ${prev.quarter_name.substring(0, 2)}: ${prev.y_coord.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (history.length === 1) {
                html += `
                    <div class="glass-card coord-movement-card" style="text-align: center; color: var(--text-muted); align-items: center;">
                        <p style="font-size: 14px;">Take another assessment to track your coordinate movement!</p>
                    </div>
                `;
            }

            document.getElementById('dynamic-content').innerHTML = html;
        }
    </script>
</body>

</html>
