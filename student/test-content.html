<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --bg-hover: #1a222a;

            --matrix-yellow: #d8a61a;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;

            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-active: rgba(74, 222, 128, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 22px 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header {
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* --- PROGRESS BAR --- */
        .progress-wrapper {
            margin-bottom: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .progress-info .current {
            color: var(--matrix-green);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--matrix-green);
            border-radius: 3px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* --- QUESTION CARD --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeSlideIn 0.35s ease;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-option {
            background-color: var(--bg-base);
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .answer-option:hover {
            border-color: var(--matrix-blue);
            background-color: var(--bg-hover);
        }

        .answer-option.selected {
            border-color: var(--matrix-green);
            background-color: rgba(74, 222, 128, 0.05);
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
        }

        .answer-option.selected .radio-circle {
            border-color: var(--matrix-green);
        }

        .answer-option.selected .radio-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background-color: var(--matrix-green);
            border-radius: 50%;
        }

        .answer-text {
            font-size: 14px;
            font-weight: 500;
        }

        .btn-submit {
            background-color: var(--matrix-green);
            color: var(--bg-base);
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 16px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        /* --- QUADRANT MAP --- */
        .quadrant-card {
            padding: 32px;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 32px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .quadrant-map-container {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quadrant-graph {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quadrant-grid-lines {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        /* --- NEW LAYOUT STYLES --- */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .logo-container img {
            width: 32px;
            height: 32px;
        }

        .pre-assessment-pill {
            background: rgba(216, 166, 26, 0.1);
            color: var(--matrix-yellow);
            border: 1px solid rgba(216, 166, 26, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .greeting-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .greeting-box strong {
            color: var(--matrix-yellow);
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .dimension-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .answers-grid.stacked {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .dot.answered {
            background: var(--matrix-green);
        }

        .dot.active {
            background: var(--matrix-yellow);
            box-shadow: 0 0 0 3px rgba(216, 166, 26, 0.3);
        }

        .dot.answered.active {
            background: var(--matrix-green);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.3);
        }

        .q-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .q-cell.top-left {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(74, 222, 128, 0.04);
        }

        .q-cell.top-right {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(56, 189, 248, 0.04);
        }

        .q-cell.bottom-left {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(251, 146, 60, 0.04);
        }

        .q-cell.bottom-right {
            background-color: rgba(192, 132, 252, 0.04);
        }

        .q-label {
            font-size: 11px;
            font-weight: 700;
        }

        .axis-label {
            position: absolute;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .axis-y-top {
            left: -28px;
            top: 25%;
            transform: translateY(-50%) rotate(-90deg);
        }

        .axis-y-bot {
            left: -28px;
            top: 75%;
            transform: translateY(-50%) rotate(-90deg);
        }

        .axis-x-container {
            position: absolute;
            bottom: -32px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
        }

        .data-point {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background-color: var(--bg-card);
            border-radius: 50%;
            border: 4px solid var(--matrix-green);
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 20px 5px rgba(74, 222, 128, 0.3);
            display: none;
            transition: all 0.5s ease;
        }

        /* Utilities */
        .text-matrix-green {
            color: var(--matrix-green);
        }

        .text-matrix-blue {
            color: var(--matrix-blue);
        }

        .text-matrix-orange {
            color: #fb923c;
        }

        .text-matrix-purple {
            color: #c084fc;
        }

        /* Result Screen overlay */
        #result-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-base);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .result-mode {
            font-size: 32px;
            font-weight: 800;
            color: var(--matrix-green);
            margin-bottom: 12px;
        }

        .result-sub {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 400px;
        }

        /* Loading Screen overlay */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-base);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(74, 222, 128, 0.2);
            border-bottom-color: var(--matrix-green);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Fuzzy Bars */
        .fuzzy-bar-row {
            margin-bottom: 16px;
            text-align: left;
        }

        .fuzzy-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .fuzzy-bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .fuzzy-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            body { padding: 0; background-color: var(--bg-base); }
            .container { padding: 16px; min-height: 100vh; }
            .top-navbar { flex-direction: column; gap: 12px; }
            .question-card { padding: 24px 16px; border-radius: 0; border: none; border-bottom: 1px solid var(--border-light); }
            .question-text { font-size: 20px; }
            .card-footer { flex-direction: column; gap: 16px; }
            .nav-btn { width: 100%; text-align: center; }
            .quadrant-graph { max-width: 100%; aspect-ratio: auto; min-height: 250px; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>

<body>

    <div class="container" id="test-container">

        <div class="top-navbar">
            <div class="logo-container">
                <img src="../images/matrix_logo.png" alt="Matrix Logo">
                MATRIX
            </div>
            <div class="pre-assessment-pill" id="session-pill">
                <span>🧠</span> PRE-ASSESSMENT
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span>Question <span class="current" id="progress-current"
                        style="color:var(--text-main); font-weight:700;">1</span> of <span
                        id="progress-total">28</span></span>
                <span id="progress-pct">0% complete</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="background-color: var(--matrix-blue);"></div>
            </div>
        </div>

        <div id="questions-container">
            <!-- Single question injected here -->
        </div>

        <div class="pagination-dots" id="dots-container">
            <!-- Dots injected here -->
        </div>

    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h3>Analyzing Responses...</h3>
        <p style="color: var(--text-muted); margin-top: 8px;">Calculating your optimal learning mode quadrant</p>
    </div>

    <div id="result-screen">
        <div class="result-icon">🎯</div>
        <h3>Assessment Complete!</h3>
        <p style="color: var(--text-muted); margin-top: 8px;">Your Learning Mode is:</p>
        <div class="result-mode" id="final-mode" style="margin-bottom: 24px;">Loading...</div>

        <div class="quadrant-card" id="quadrant-card-container"
            style="display: none; width: 100%; max-width: 480px; margin-bottom: 24px; padding: 24px;">
            <div
                style="font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 24px; text-align: left; text-transform: uppercase;">
                FUZZY K-NN PROFILE BREAKDOWN
            </div>
            <div id="fuzzy-bars-container">
                <!-- Bars injected here -->
            </div>
        </div>

        <p id="mode-description"
            style="max-width: 480px; font-size: 14px; margin: 0 auto 24px; color: var(--text-gray); line-height: 1.6;">
        </p>



        <button id="return-btn" class="btn-submit" onclick="returnFromTest()">Return to Dashboard</button>
    </div>

    <script>
        const submitBtn = document.getElementById('btn-submit');
        let activeSession = null;

        // 28 Questions grouped and ordered
        const surveyQuestions = [
            // 1. How does learning occur? (Old 5)
            { title: "How does learning occur?", q: "DC", text: "Learning occurs when individuals engage in activities that have meaning to them and contribute to their own as well as a communal knowledge base." },
            { title: "How does learning occur?", q: "HI", text: "Learning occurs when experts provide scaffolding and sequencing to build knowledge and skill." },
            { title: "How does learning occur?", q: "DI", text: "Learning occurs when individuals have to make sense of competing and diverse sources of knowledge, skill and expertise." },
            { title: "How does learning occur?", q: "HC", text: "Learning occurs through socialization by participating in a community with strong, clear values and norms." },

            // 2. What is the definition of learning? (Old 6)
            { title: "What is the definition of learning?", q: "DC", text: "Learning is a collective activity requiring cooperation among people with diverse knowledge and skills." },
            { title: "What is the definition of learning?", q: "DI", text: "Learning is an innate biological imperative that is driven by individual interests." },
            { title: "What is the definition of learning?", q: "HC", text: "Learning is a social activity guided by experts who create learning opportunities." },
            { title: "What is the definition of learning?", q: "HI", text: "Learning is the transfer of knowledge and skill from an expert to a novice." },

            // 3. What constitutes successful learning? (Old 7)
            { title: "What constitutes successful learning?", q: "DI", text: "Successful learning can only be defined by the individual learner." },
            { title: "What constitutes successful learning?", q: "DC", text: "Successful learning means an exchange of ideas among learners in a community." },
            { title: "What constitutes successful learning?", q: "HI", text: "Successful learning is expressed via certification or recognition from an institution or expert." },
            { title: "What constitutes successful learning?", q: "HC", text: "Successful learning is expressed via recognition by and positive participation in a community." },

            // 4. What is the purpose of learning? (Old 1)
            { title: "What is the purpose of learning?", q: "HI", text: "The purpose of learning is to gain access to knowledge that is valued in society." },
            { title: "What is the purpose of learning?", q: "DC", text: "The purpose of learning is to know how to participate in a community with others of diverse, competing, and broadly distributed viewpoints." },
            { title: "What is the purpose of learning?", q: "DI", text: "The purpose of learning is to live up to one's unique individual potential." },
            { title: "What is the purpose of learning?", q: "HC", text: "The purpose of learning is to socialize citizens for participation in democracy." },

            // 5. What is worth learning? (Old 2)
            { title: "What is worth learning?", q: "DC", text: "What is worth learning is determined by communities that are formed around mutual interest." },
            { title: "What is worth learning?", q: "DI", text: "What is worth learning can only be determined by the individual for her/himself." },
            { title: "What is worth learning?", q: "HC", text: "What is worth learning are the knowledge and skills necessary to be an effective participant in a democratic society." },
            { title: "What is worth learning?", q: "HI", text: "What is worth learning is measured by clear standards and assessments." },

            // 6. How do people learn best? (Old 3)
            { title: "How do people learn best?", q: "DC", text: "People learn best when motivated by pursuing shared interests, values, and preferences with others." },
            { title: "How do people learn best?", q: "DI", text: "People learn best when they make individual choices about what they learn." },
            { title: "How do people learn best?", q: "HI", text: "People learn best in educational institutions that provide them with competent teachers." },
            { title: "How do people learn best?", q: "HC", text: "People learn best when they participate in a strong community with shared values about what to learn and how to learn." },

            // 7. What are individuals responsible for in learning? (Old 4)
            { title: "What are individuals responsible for in learning?", q: "HI", text: "Individuals are responsible for acquiring the knowledge and skills that teachers and schools teach them." },
            { title: "What are individuals responsible for in learning?", q: "DI", text: "Individuals are responsible for initiating and choosing what and how they learn." },
            { title: "What are individuals responsible for in learning?", q: "DC", text: "Individuals are responsible for joining networks or communities in order to learn what they want." },
            { title: "What are individuals responsible for in learning?", q: "HC", text: "Individuals are responsible for playing an active role in supporting the learning and participation of others in their community." }
        ];

        let answers = {};
        let shuffledQuestions = [];
        let currentQuestionIndex = 0;

        function updateProgress() {
            const answered = Object.keys(answers).length;
            const total = surveyQuestions.length;
            const pct = Math.round((answered / total) * 100);

            document.getElementById('progress-current').textContent = currentQuestionIndex + 1;
            document.getElementById('progress-total').textContent = total;
            document.getElementById('progress-pct').textContent = pct + '% complete';
            document.getElementById('progress-fill').style.width = ((currentQuestionIndex + 1) / total * 100) + '%';

            // Update dots
            const dotsContainer = document.getElementById('dots-container');
            if (dotsContainer.children.length === 0) {
                // Initialize dots
                for (let i = 0; i < total; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dotsContainer.appendChild(dot);
                }
            }
            // highlight current dot and answered status
            Array.from(dotsContainer.children).forEach((dot, idx) => {
                let classes = ['dot'];
                
                // Check if answered using the original item index
                if (shuffledQuestions[idx] && answers[shuffledQuestions[idx].i] !== undefined) {
                    classes.push('answered');
                }
                
                if (idx === currentQuestionIndex) {
                    classes.push('active');
                }
                
                dot.className = classes.join(' ');
            });
        }

        function showQuestion(index) {
            const container = document.getElementById('questions-container');
            const item = shuffledQuestions[index];
            const qNum = index + 1;

            const userStr = localStorage.getItem('currentUser');
            let firstName = "Student";
            if (userStr) {
                const userObj = JSON.parse(userStr);
                firstName = userObj.first_name || userObj.username || "Student";
            }

            container.innerHTML = `
                <div class="question-card">
                    <div class="greeting-box">
                        <strong>Hello, ${firstName}!</strong>
                        Answer honestly — there are no right or wrong answers. Your responses will map your exact position on the MATRIX learning quadrant.
                    </div>
                    
                    <div class="dimension-label">${item.val.title}</div>
                    
                    <div class="question-title" style="font-size: 18px; margin-bottom: 24px;">${item.val.text}</div>
                    
                    <div class="answers-grid stacked">
                        <label class="answer-option" data-value="4">
                            <div class="radio-circle"></div>
                            <div class="answer-text">Strongly agree</div>
                        </label>
                        <label class="answer-option" data-value="3">
                            <div class="radio-circle"></div>
                            <div class="answer-text">Agree</div>
                        </label>
                        <label class="answer-option" data-value="2">
                            <div class="radio-circle"></div>
                            <div class="answer-text">Somewhat agree</div>
                        </label>
                        <label class="answer-option" data-value="1">
                            <div class="radio-circle"></div>
                            <div class="answer-text">Disagree</div>
                        </label>
                    </div>
                    
                    <div class="card-footer">
                        <button class="nav-btn prev-btn" ${index === 0 ? 'disabled' : ''}>&lt; Previous</button>
                        <button class="nav-btn next-btn" id="next-btn-action">Next &gt;</button>
                    </div>
                </div>
            `;

            if (answers[item.i] !== undefined) {
                const prev = container.querySelector(`.answer-option[data-value="${answers[item.i]}"]`);
                if (prev) prev.classList.add('selected');
            }

            // Check if on last question and all answered
            const nextBtn = container.querySelector('#next-btn-action');
            if (index === shuffledQuestions.length - 1) {
                nextBtn.textContent = 'Submit';
                nextBtn.style.backgroundColor = 'var(--matrix-green)';
                nextBtn.style.color = '#000';
                if (Object.keys(answers).length !== surveyQuestions.length) {
                    nextBtn.disabled = true;
                }
            }

            // Answer clicks
            container.querySelectorAll('.answer-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    container.querySelectorAll('.answer-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    const val = parseInt(opt.dataset.value);
                    answers[item.i] = val;
                    updateProgress();

                    if (index === shuffledQuestions.length - 1 && Object.keys(answers).length === surveyQuestions.length) {
                        nextBtn.disabled = false;
                    }
                });
            });

            // Prev Button
            const prevBtn = container.querySelector('.prev-btn');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (currentQuestionIndex > 0) {
                        currentQuestionIndex--;
                        showQuestion(currentQuestionIndex);
                        updateProgress();
                    }
                });
            }

            // Next / Submit Button
            nextBtn.addEventListener('click', () => {
                if (index === shuffledQuestions.length - 1) {
                    // Trigger submit logic
                    submitAssessment();
                } else {
                    currentQuestionIndex++;
                    showQuestion(currentQuestionIndex);
                    updateProgress();
                }
            });
        }

        function renderQuestions() {
            // Keep the exact order defined above
            shuffledQuestions = surveyQuestions.map((val, i) => ({ val, i }));
            currentQuestionIndex = 0;
            answers = {};
            document.getElementById('dots-container').innerHTML = ''; // reset dots
            updateProgress();
            showQuestion(0);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isPreview = urlParams.get('preview') === 'true';
            const isViewResults = urlParams.get('view_results') === 'true';

            if (isPreview) {
                const sessionPill = document.getElementById('session-pill');
                if (sessionPill) sessionPill.innerHTML = `<span>⚙️</span> ADMIN PREVIEW`;
                renderQuestions();
                return;
            }

            if (isViewResults) {
                // Show the result screen directly without taking the test again
                const mode = decodeURIComponent(urlParams.get('mode') || '');
                document.getElementById('test-container').style.display = 'none';
                const resultScreen = document.getElementById('result-screen');
                resultScreen.style.display = 'flex';
                document.getElementById('final-mode').textContent = mode || 'See your profile for details';
                // Render fuzzy graph with equal weights since we don't have the raw fuzzy data
                const fakeFuzzy = { 'Hierarchical Individual': 0, 'Hierarchical Collective': 0, 'Distributed Individual': 0, 'Distributed Collective': 0 };
                if (mode && fakeFuzzy.hasOwnProperty(mode)) fakeFuzzy[mode] = 1;
                
                const xStr = urlParams.get('x');
                const yStr = urlParams.get('y');
                const finalX = xStr !== null ? parseFloat(xStr) : undefined;
                const finalY = yStr !== null ? parseFloat(yStr) : undefined;
                
                renderFuzzyGraph(mode, fakeFuzzy, finalX, finalY);

                // Modify the existing return button to act as a back button
                const returnBtn = document.getElementById('return-btn');
                returnBtn.textContent = '← Back to Assessment';
                returnBtn.onclick = () => window.history.back();
                return;
            }

            const userStr = localStorage.getItem('currentUser');
            if (!userStr) return;
            const user = JSON.parse(userStr);

            // Determine if this is the mandatory initial assessment.
            // Check cached profile first; fall back to a fresh API call.
            let isMandatoryInitialTest = false;
            try {
                const profileStr = localStorage.getItem('studentProfile');
                if (profileStr) {
                    const profile = JSON.parse(profileStr);
                    isMandatoryInitialTest = !profile.learning_mode;
                } else {
                    // Profile not cached yet (e.g. page loaded before s-dashboard.html populated it)
                    const freshProfile = await fetch('/api/students/' + user.id).then(r => r.json());
                    isMandatoryInitialTest = !freshProfile.learning_mode;
                }
            } catch (e) {
                console.warn('Could not determine mandatory test status', e);
            }

            try {
                const [sessionRes, historyRes] = await Promise.all([
                    fetch('/api/students/' + user.id + '/active-sessions'),
                    fetch('/api/students/' + user.id + '/history')
                ]);
                const sessions = await sessionRes.json();
                const history = await historyRes.json();

                if (isMandatoryInitialTest) {
                    // New student with no quadrant — skip session check, go straight to questions
                    renderQuestions();
                    return;
                }

                if (!sessions || sessions.length === 0) {
                    document.getElementById('test-container').innerHTML = `
                        <div style="text-align: center; padding: 60px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-light);">
                            <h2 style="color: var(--matrix-blue); margin-bottom: 12px;">No Active Assessments</h2>
                            <p style="color: var(--text-muted);">Your teachers have not opened any assessment sessions for you at this time.</p>
                        </div>
                    `;
                    return;
                }

                activeSession = sessions.find(s => !history.some(h => h.quarter_name === s.quarter_name));

                if (!activeSession) {
                    document.getElementById('test-container').innerHTML = `
                        <div style="text-align: center; padding: 60px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-light);">
                            <h2 style="color: var(--matrix-green); margin-bottom: 12px;">All Assessments Completed</h2>
                            <p style="color: var(--text-muted);">You have already completed all currently active assessments. Great job!</p>
                        </div>
                    `;
                    return;
                }

                const sessionPill = document.getElementById('session-pill');
                if (sessionPill) {
                    sessionPill.innerHTML = `<span>🎯</span> ${activeSession.course_subj_name} - ${activeSession.quarter_name}`;
                }

                renderQuestions();

            } catch (err) {
                console.error("Failed to check sessions", err);
            }
        });

        async function submitAssessment() {
            const urlParams = new URLSearchParams(window.location.search);
            const isPreview = urlParams.get('preview') === 'true';

            // Build 28-element array
            let answersArray = [];
            for (let i = 0; i < surveyQuestions.length; i++) {
                answersArray.push(answers[i] || 0);
            }

            if (isPreview) {
                try {
                    document.getElementById('test-container').style.display = 'none';
                    document.getElementById('loading-screen').style.display = 'flex';

                    const res = await fetch('/api/ai/simulate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ answersArray: answersArray })
                    });
                    const data = await res.json();

                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        if (data.success) {
                            const resultScreen = document.getElementById('result-screen');
                            resultScreen.style.display = 'flex';
                            document.getElementById('final-mode').textContent = data.result.mode;
                            renderFuzzyGraph(data.result.mode, data.result.fuzzy);
                        } else {
                            alert('Simulation Error: ' + data.error);
                            document.getElementById('test-container').style.display = 'flex';
                        }
                    }, 1500);
                } catch (e) {
                    alert("Network error.");
                }
                return;
            }

            const userStr = localStorage.getItem('currentUser');
            if (!userStr) { alert("You are not logged in!"); return; }
            const user = JSON.parse(userStr);

            try {
                document.getElementById('test-container').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';

                const payload = { student_id: user.id, answersArray: answersArray };
                if (activeSession) payload.session_id = activeSession.session_id;

                const res = await fetch('/api/assessments/submit-fknn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    if (data.success) {
                        const profileStr = localStorage.getItem('studentProfile');
                        if (profileStr) {
                            const profile = JSON.parse(profileStr);
                            profile.x_coord = data.result.x;
                            profile.y_coord = data.result.y;
                            profile.learning_mode = data.result.mode;
                            localStorage.setItem('studentProfile', JSON.stringify(profile));
                        }

                        // Post message removed, handled by returnFromTest instead

                        const resultScreen = document.getElementById('result-screen');
                        resultScreen.style.display = 'flex';
                        document.getElementById('final-mode').textContent = data.result.mode;
                        renderFuzzyGraph(data.result.mode, data.result.fuzzy, data.result.x, data.result.y);
                    } else {
                        alert('Error submitting assessment: ' + (data.error || 'Unknown error'));
                        console.error("Backend returned:", data);
                        document.getElementById('test-container').style.display = 'flex';
                    }
                }, 1500);
            } catch (err) {
                console.error("Submit error", err);
                alert("Network error occurred.");
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('test-container').style.display = 'flex';
            }
        }

        // Function to render the 4-quadrant graph and description
        function renderFuzzyGraph(mode, fuzzyDict, finalX, finalY) {
            // Set Description
            const descEl = document.getElementById('mode-description');
            if (mode === 'Hierarchical Individual') {
                descEl.textContent = "You thrive in structured environments where knowledge is transferred from an expert. You prefer clear goals, certification, and independent mastery of standard curriculum.";
            } else if (mode === 'Distributed Individual') {
                descEl.textContent = "You learn best by pursuing your own unique interests. You are self-directed, preferring informal environments where you control what and how you learn to achieve personal growth.";
            } else if (mode === 'Hierarchical Collective') {
                descEl.textContent = "You prefer learning in structured group settings. You value shared civic responsibility, group cohesion, and learning the traditions of a community under expert guidance.";
            } else if (mode === 'Distributed Collective') {
                descEl.textContent = "You excel in peer-driven, inquiry-based group settings. Shared leadership, open-ended discussions, and co-creation of knowledge define your ideal learning environment.";
            } else {
                descEl.textContent = "Based on Elmore's framework, this is your optimal learning environment.";
            }

            document.getElementById('quadrant-card-container').style.display = 'block';

            // Calculate exact percentages from coords using Cartesian model
            let px = parseFloat(finalX || 0);
            let py = parseFloat(finalY || 0);
            let normX = (px + 5) / 10;
            let normY = (py + 5) / 10;
            
            normX = Math.max(0, Math.min(1, normX));
            normY = Math.max(0, Math.min(1, normY));

            let HI = (1 - normX) * normY;
            let DI = normX * normY;
            let HC = (1 - normX) * (1 - normY);
            let DC = normX * (1 - normY);
            
            let total = HI + DI + HC + DC;
            if (total === 0) total = 1;

            const pHI = Math.round((HI / total) * 100);
            const pDI = Math.round((DI / total) * 100);
            const pHC = Math.round((HC / total) * 100);
            const pDC = Math.round((DC / total) * 100);

            // Construct array for sorting
            const breakdown = [
                { name: 'Distributed Collective', pct: pDC, icon: '🧠', color: '#c084fc' }, // purple
                { name: 'Distributed Individual', pct: pDI, icon: '💻', color: '#38bdf8' }, // blue/teal
                { name: 'Hierarchical Collective', pct: pHC, icon: '🤝', color: '#fb923c' }, // orange
                { name: 'Hierarchical Individual', pct: pHI, icon: '📚', color: '#4ade80' }  // green
            ];

            // Sort by percentage descending
            breakdown.sort((a, b) => b.pct - a.pct);

            const container = document.getElementById('fuzzy-bars-container');
            container.innerHTML = '';

            breakdown.forEach(item => {
                const row = document.createElement('div');
                row.className = 'fuzzy-bar-row';
                row.innerHTML = `
                    <div class="fuzzy-bar-header" style="color: ${item.color};">
                        <span>${item.icon} ${item.name}</span>
                        <span style="color: white;">${item.pct}%</span>
                    </div>
                    <div class="fuzzy-bar-track">
                        <div class="fuzzy-bar-fill" style="width: 0%; background-color: ${item.color};"></div>
                    </div>
                `;
                container.appendChild(row);

                // Animate
                setTimeout(() => {
                    row.querySelector('.fuzzy-bar-fill').style.width = item.pct + '%';
                }, 100);
            });
        }

        function returnFromTest() {
            if (window.location.search.includes('preview=true')) {
                window.location.href = '../admin/questionnaires-content.html';
            } else if (window.location.search.includes('view_results=true')) {
                window.history.back();
            } else {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'assessmentComplete' }, '*');
                } else {
                    window.location.href = 'dashboard-content.html';
                }
            }
        }

        // Helper to sync sidebar when returning to dashboard
        function updateParentSidebar(activeIndex) {
            if (window.parent && window.parent.document) {
                const sidebarLinks = window.parent.document.querySelectorAll('.sidebar-link');
                if (sidebarLinks && sidebarLinks.length > 0) {
                    sidebarLinks.forEach(link => link.classList.remove('active'));
                    if (sidebarLinks[activeIndex]) {
                        sidebarLinks[activeIndex].classList.add('active');
                    }
                }
            }
        }
    </script>
