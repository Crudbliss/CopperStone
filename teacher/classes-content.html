<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Classes Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-base: #060f17;
            --bg-card: #1c2632;
            --bg-banner: #fef0c7;
            
            --matrix-yellow: #d8a61a;
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-dashed: rgba(139, 158, 176, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            color: var(--text-main);
            padding: 40px;
        }

        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .class-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .class-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .card-banner {
            background-color: var(--bg-banner);
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
        }

        .card-banner svg { width: 64px; height: 64px; }

        .card-info {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .class-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .class-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .class-card-add {
            border: 2px dashed var(--border-dashed);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            background-color: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .class-card-add:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Modal Styling */
        .modal-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 15, 23, 0.8); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal {
            background: #12181f; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; }
        .btn-close { background: transparent; color: #8b9eb0; padding: 0; font-size: 24px; font-weight: 300; line-height: 1; border:none; cursor:pointer;}
        .btn-close:hover { color: #fff; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        label { font-size: 13px; color: #8b9eb0; }
        input, select { background: #0a1e2d; border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 6px; color: #fff; font-family: 'Poppins', sans-serif; width: 100%; appearance: none;}
        input:focus, select:focus { outline: none; border-color: var(--matrix-yellow); }
        select option { background: #0a1e2d; color: #fff; }
        .btn-submit { background: var(--matrix-yellow); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Poppins', sans-serif;}
        .btn-submit:hover { background: #e0a31c; }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .classes-grid { grid-template-columns: 1fr; }
            .modal { padding: 16px; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="../images/matrix_logo.ico">
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-course" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </symbol>
    </svg>

    <div class="content-container">
        
        <div class="classes-section">
            <h2 class="section-header">Active Classes</h2>
            
            <div class="classes-grid" id="classesGrid">
                <!-- Classes injected here -->
                
                <div class="class-card-add" onclick="openModal()">
                    + Add class
                </div>
            </div>
        </div>

    </div>

    <!-- The Modal -->
    <div id="addModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Class</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="addClassForm">
                <div class="form-group">
                    <label>Program</label>
                    <select id="prog_name" required>
                        <option value="" disabled selected>Select Program</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Learning Mode</label>
                    <select id="learning_mode" required>
                        <option value="" disabled selected>Select Learning Mode</option>
                        <option value="HI">HI</option>
                        <option value="HC">HC</option>
                        <option value="DI">DI</option>
                        <option value="DC">DC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Year Level</label>
                    <select id="year_level" required>
                        <option value="" disabled selected>Select Year Level</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="section" placeholder="e.g. A" required>
                </div>
                <div class="form-group">
                    <label>School Year</label>
                    <input type="text" id="school_year" placeholder="e.g. 2025-2026" required>
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                    <button type="button" onclick="closeModal()" style="background: transparent; color: #8b9eb0; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 10px 20px; font-family: 'Poppins', sans-serif; cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-submit">Create Class</button>
                </div>
                <div id="message" style="margin-top: 15px; font-size: 14px; font-weight: 500; text-align: right;"></div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('addModal');
        const classesGrid = document.getElementById('classesGrid');
        
        // Get the current logged-in teacher from localStorage
        const currentUserStr = localStorage.getItem('currentUser');
        let teacherId = null;
        if (currentUserStr) {
            const user = JSON.parse(currentUserStr);
            teacherId = user.id;
        }
        
        function openModal() {
            modal.style.display = 'flex';
            document.getElementById('message').textContent = '';
        }
        
        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('addClassForm').reset();
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Load Classes for the grid
        async function loadClasses() {
            if (!teacherId) return;
            try {
                const res = await fetch('/api/classes/teacher/' + teacherId);
                const classes = await res.json();
                
                // Keep the 'Add Class' card, clear the rest
                classesGrid.innerHTML = '';
                
                classes.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'class-card';
                    card.onclick = () => window.location.href = 'class-details.html?id=' + c.id;
                    
                    const program = c.prog_name || 'Unknown Program';
                    const lm = c.learning_mode || 'None';
                    const sec = c.section || '';
                    const sy = c.school_year || '';
                    
                    // class-title: "Prog_name"
                    let titleStr = program;
                    // class-desc: "learning_mode-section school_year"
                    let descStr = `${lm}-${sec} ${sy}`;

                    card.innerHTML = `
                        <div class="card-banner">
                            <svg><use href="#icon-course"></use></svg>
                        </div>
                        <div class="card-info">
                            <h3 class="class-title">${titleStr}</h3>
                            <p class="class-desc">${descStr}</p>
                        </div>
                    `;
                    classesGrid.appendChild(card);
                });

                // Re-append the Add button card
                const addCard = document.createElement('div');
                addCard.className = 'class-card-add';
                addCard.onclick = openModal;
                addCard.textContent = '+ Add class';
                classesGrid.appendChild(addCard);

            } catch (err) {
                console.error("Error loading classes:", err);
            }
        }
        
        // Initialize
        if (teacherId) {
            loadClasses();
        } else {
            classesGrid.innerHTML = '<div style="color: #fb923c; font-weight: 500;">Please log in as a teacher first.</div>';
        }

        // Form Submit
        document.getElementById('addClassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!teacherId) return alert("You must be logged in to create a class.");
            
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('message');
            btn.textContent = 'Saving...';
            msg.textContent = '';
            
            const data = {
                prog_name: document.getElementById('prog_name').value,
                learning_mode: document.getElementById('learning_mode').value,
                year_level: document.getElementById('year_level').value,
                section: document.getElementById('section').value,
                school_year: document.getElementById('school_year').value,
                teacher_id: teacherId
            };

            try {
                const res = await fetch('/api/classes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(res.ok) {
                    closeModal();
                    loadClasses(); // Refresh the grid!
                } else {
                    msg.style.color = '#fb923c';
                    msg.textContent = result.error;
                }
            } catch (err) {
                msg.style.color = '#fb923c';
                msg.textContent = 'Server error occurred.';
            }
            btn.textContent = 'Create Class';
        });
    </script>
</body>
</html>
