<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Work in Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060f17;
            --bg-card: #12181f;
            --matrix-yellow: #d8a61a;
            --matrix-blue: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 40px;
        }

        .wip-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .wip-icon {
            width: 80px;
            height: 80px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--matrix-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .wip-icon svg {
            width: 40px;
            height: 40px;
        }

        .wip-title {
            font-size: 24px;
            font-weight: 700;
        }

        .wip-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }
        
        .wip-pill {
            background-color: rgba(216, 166, 26, 0.1);
            color: var(--matrix-yellow);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 50px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="wip-container">
        <div class="wip-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
        </div>
        <h2 class="wip-title">Reports Dashboard</h2>
        <p class="wip-subtitle">We are currently building this feature. Soon, you will be able to generate and export detailed analytics and performance reports for your classes.</p>
        <span class="wip-pill">Work in Progress</span>
    </div>

</body>
</html>
