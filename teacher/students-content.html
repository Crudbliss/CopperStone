<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Students Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-base: #060f17;
            --bg-card: #1c2632; /* Slightly lighter than the base to match the image */
            --bg-banner: #fef0c7; /* Pale yellow for the card top */
            
            --matrix-yellow: #d8a61a;
            --matrix-green: #4ade80;
            --matrix-blue: #38bdf8;
            --matrix-orange: #fb923c;
            --matrix-purple: #c084fc;
            
            --text-main: #ffffff;
            --text-muted: #8b9eb0;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-dashed: rgba(139, 158, 176, 0.5); /* Muted dashed border */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            color: var(--text-main);
            padding: 40px;
        }

        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- SECTION STYLES --- */
        .section-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* --- CLASSES GRID --- */
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* --- STANDARD CLASS CARD --- */
        .class-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .class-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .card-banner {
            background-color: var(--bg-banner);
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155; /* Dark icon color for contrast against yellow */
        }

        .card-banner svg {
            width: 64px;
            height: 64px;
        }

        .card-info {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .class-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .class-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- ADD CLASS CARD (DASHED) --- */
        .class-card-add {
            border: 2px dashed var(--border-dashed);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px; /* Matches the approximate height of the other cards */
            background-color: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .class-card-add:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.02);
        }

    </style>
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-course" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </symbol>
    </svg>

    <div class="content-container">
        
        <div class="classes-section">
            <h2 class="section-header">Active Classes</h2>
            
            <div class="classes-grid">
                
                <div class="class-card" onclick="window.location.href='class-details.html';">
                    <div class="card-banner">
                        <svg><use href="#icon-course"></use></svg>
                    </div>
                    <div class="card-info">
                        <h3 class="class-title">Course Subject Name 1</h3>
                        <p class="class-desc">Platform Name - Section Name & Term Info</p>
                    </div>
                </div>

                <div class="class-card" onclick="window.location.href='class-details.html';">
                    <div class="card-banner">
                        <svg><use href="#icon-course"></use></svg>
                    </div>
                    <div class="card-info">
                        <h3 class="class-title">Course Subject Name 2</h3>
                        <p class="class-desc">Platform Name - Section Name & Term Info</p>
                    </div>
                </div>

                <div class="class-card" onclick="window.location.href='class-details.html';">
                    <div class="card-banner">
                        <svg><use href="#icon-course"></use></svg>
                    </div>
                    <div class="card-info">
                        <h3 class="class-title">Course Subject Name 3</h3>
                        <p class="class-desc">Platform Name - Section Name & Term Info</p>
                    </div>
                </div>

                <div class="class-card-add">
                    + Add class
                </div>

            </div>
        </div>

    </div>

</body>
</html>
